id: tlp_research
name: tlp_research
version: 0.1.3
title: TLP Mechanistic Research
description: Governed confirmatory study of layer-specific non-flat morphological
  max-plus pooling.
type: desktop
supported_locales:
- en
- ru
depends:
- research_manager_skill
- mlflow_tracker_skill
runtime:
  skills:
    required:
    - research_manager_skill
    - mlflow_tracker_skill
    optional: []
workflow:
  manifest: workflow.json
ui:
  manifest: webui.json
trigger: manual
vars:
  study_title: TLP layer-specific spatial selectivity
steps:
- name: create_tlp_study
  call: research_manager_skill.create_study
  args:
    title: TLP layer-specific spatial selectivity
    hypothesis: Channel-wise non-flat max-plus pooling in the second pooling layer
      improves paired validation accuracy and shift consistency relative to MaxPool
      without a universal all-layer advantage.
    mode: confirmatory
    study_id: study.ee75f7af4b82a95e6525aeb11efe51cfbf6fdf45f58e382cb030bd3f6542675c
    idempotency_key: tlp-scenario-create-v1
    protocol:
      fixture_ref: fixtures/protocol.v1.json
      primary_dataset: STL10
      primary_operator_location: pool2
      paired_seeds: '10'
    analysis_plan:
      fixture_ref: fixtures/analysis-plan.v1.json
      primary_estimand: paired_accuracy_delta
      confidence_interval: paired_bootstrap_95
    splits:
      validation:
        digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
        dataset_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        locator: dataset:stl10/validation-v1
      robustness:
        digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
        dataset_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        locator: dataset:stl10/robustness-v1
      test:
        digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
        dataset_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        locator: secret-ref:tlp/stl10-test-v1
  save_as: created
- name: submit_protocol_review
  call: research_manager_skill.advance_workflow
  args:
    study_id: study.ee75f7af4b82a95e6525aeb11efe51cfbf6fdf45f58e382cb030bd3f6542675c
    command: submit_protocol_review
    expected_generation: '0'
    idempotency_key: tlp-scenario-review-v1
    actor: user:scenario
- name: create_control_experiment
  call: research_manager_skill.create_experiment
  args:
    study_id: study.ee75f7af4b82a95e6525aeb11efe51cfbf6fdf45f58e382cb030bd3f6542675c
    experiment_id: experiment.0670d0bc1c99cb6a89af74f0f56457a5d785e2991dd5eba83219ec2d58db63e5
    slug: E002
    title: STL-10 pool2 centered TLP vs MaxPool (instrumentation-corrected)
    purpose: Paired control experiment for the AdaOS Single Experiment Control and Tracking vertical.
    idempotency_key: tlp-scenario-e002-v1
    conditions:
      schema: adaos.research.tlp_experiment_conditions.v1
      dataset:
        name: STL10
        version: binary-2011
        source: https://ai.stanford.edu/~acoates/stl10/stl10_binary.tar.gz
        archive_md5: 91f7769df0f17e558f3565bffb0c7dfb
        download: true
        split_seed: '20260807'
        validation_per_class: '100'
        test_policy: sealed-until-qc
      architecture:
        name: tlp-control-cnn-v1
        layers: [conv3x3:3:32, pool1:maxpool2, conv3x3:32:64, pool2:variant,
          conv3x3:64:128, pool3:maxpool2, 'linear:18432:256:10']
      operators:
        location: pool2
        arms:
        - {id: maxpool, kind: torch.nn.MaxPool2d, kernel: '2', stride: '2'}
        - {id: tlp, kind: centered-channelwise-max-plus, kernel: '2', stride: '2',
           initialization: zero, constraint: theta-minus-channel-mean}
      execution:
        preflight: {epochs: '3', seeds: ['17'], batch_size: '32', learning_rate: 0.001,
          max_train_samples: '300', max_validation_samples: '100', cpu_threads: '2',
          memory_mb: '4096', wall_time_s: '10800', max_attempts: '3',
          max_compute_seconds: '21600', max_storage_bytes: '2147483648',
          evidence_class: workflow_validation}
        confirmatory: {epochs: '120', seeds: ['17', '29', '41', '53', '67', '79', '97', '109', '127', '149'],
          batch_size: '32', learning_rate: 0.001, max_train_samples: '0',
          max_validation_samples: '0', cpu_threads: '4', memory_mb: '6144',
          wall_time_s: '86400', max_attempts: '3', max_compute_seconds: '259200',
          max_storage_bytes: '4294967296', evidence_class: confirmatory}
      randomization:
        paired: true
        shared_initialization: true
        shared_batch_order: true
        shared_augmentation_schedule: true
        named_streams: [initialization, data_ordering, augmentation, operator_initialization, analysis]
      analysis: {paired: true, primary_metric: validation.top1_accuracy,
        primary_estimand: mean(tlp-maxpool), interval: paired-bootstrap-95,
        checkpoint_selection: best-validation-only, test_access: sealed-until-qc}
      tracker: {contract: adaos.research.tracker.v1-rc1, provider: mlflow,
        required_delivery: durable-before-finalize}
  save_as: experiment
updated_at: '2026-08-07T17:34:34+00:00'
