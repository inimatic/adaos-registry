id: media_center
name: media_center
version: 0.6.16
title: Media Center
description: Distributed Media Center application with in-place library agents, a
  bounded coordinator catalog, persistent playback, and remote-control surfaces.
type: desktop
supported_locales:
- en
- ru
depends:
- media_center_skill
- media_library_agent
- media_control_skill
- mediaserver
runtime:
  skills:
    required:
    - media_center_skill
    - media_library_agent
    - media_control_skill
    - mediaserver
    optional: []
ui:
  manifest: webui.json
trigger: manual
vars: {}
guidance:
  schema: adaos.scenario.guidance.v1
  readme: README.md
  overview:
    en: Browse and play local media through a durable catalog while keeping files
      at their original storage paths.
  presentation:
    channels:
    - web
    - text
    - voice
    modal_id: media_center_help
  workflow:
    state_source:
      kind: skill
      name: media_center_skill.status
      params: {}
    state_path: summary.available_count
    actions_path: steps
  conversational:
    help_intent: media_center.help
    next_steps_intent: media_center.next_steps
llm_hints:
  description: Media Center application for distributed in-place libraries, compact
    bounded browsing, persistent playback, and remote control.
  aliases:
  - Media Center
  - media center
  - media library
  primary_actions:
  - id: media_center.scan
    intent: media_center.scan
    tool: media_center_skill.scan_sources
    side_effect_class: local_write
  - id: media_center.import_folder
    intent: media_center.import_folder
    tool: media_center_skill.import_folder
    side_effect_class: local_write
  - id: media_center.next_steps
    intent: media_center_skill.next_steps
    tool: media_center_skill.next_steps
    side_effect_class: read_only
  examples:
  - Open Media Center
  - Refresh media catalog
  - Add media folder
  owner_hints:
  - skill:media_center_skill
  - skill:media_library_agent
  - skill:media_control_skill
nlu:
  nlu_hints:
    aliases:
    - Media Center
    - media library
    examples:
    - open media center
    - refresh media center
    slot_schemas: {}
    entities: []
steps: []
prototype: scenario_default
