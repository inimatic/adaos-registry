name: greet_on_boot_skill
version: 0.2.4
description: Greets the user at startup and checks whether local infrastructure is
  healthy.
runtime:
  python: '3.11'
dependencies: []
events: {}
data_projections:
- scope: subnet
  slot: infra.status
  targets:
  - backend: yjs
    path: data/infra/status
default_tool: collect_infra_status
tools:
- name: collect_infra_status
  description: Collect a lightweight snapshot of node and subnet status for greet_on_boot.
  entry: handlers.main:collect_infra_status
  input_schema:
    type: object
    properties: {}
  output_schema:
    type: object
    required:
    - ok
    - status
    properties:
      ok:
        type: boolean
      status:
        type: object
        description: Arbitrary infra status payload projected into data_projections
          slots.
- name: analyze_and_notify
  description: Analyze infra status and send a short summary via Telegram and voice.
  entry: handlers.main:analyze_and_notify
  input_schema:
    type: object
    properties: {}
  output_schema:
    type: object
    required:
    - ok
    - message
    properties:
      ok:
        type: boolean
      message:
        type: string
        description: Human-readable summary used for notifications.
