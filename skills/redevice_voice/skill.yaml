name: redevice_voice
version: 0.1.4
description: Debug ReDevice voice endpoint skill over EndpointAudioService with VAD
  or push-to-talk capture and member-side STT routing.
runtime:
  kind: python
  python: '3.11'
entry: handlers/main.py
activation:
  mode: lazy
  when:
    scenarios_active:
    - web_desktop
    client_presence: true
    webspace_scope: active
  startup_allowed: true
  background_refresh: true
webui:
  file: webui.json
redui:
  file: redui.json
permissions:
  events:
    publish:
    - io.out.stream.publish
    - nlp.intent.detect.rasa
    subscribe:
    - webio.stream.snapshot.requested
    - webio.stream.subscription.changed
tools:
- name: refresh_redevice_voice_state
  description: Refresh ReDevice voice endpoint state and process the latest endpoint
    audio/control event.
  entry: handlers.main:refresh_redevice_voice_state
  input_schema:
    type: object
    properties:
      code:
        type: string
        description: Optional ReDevice pair code.
      webspace_id:
        type: string
        description: Optional webspace id.
- name: start_redevice_voice
  description: Start a debug voice endpoint session on a selected ReDevice.
  entry: handlers.main:start_redevice_voice
  input_schema:
    type: object
    properties:
      code:
        type: string
        description: Optional ReDevice pair code.
      lang:
        type: string
        enum:
        - ru
        - ru-ru
        - en
        - en-us
        default: ru
      mode:
        type: string
        enum:
        - vad
        - ptt
        default: vad
        description: Capture mode. Legacy default is VAD/sound activation; PTT remains
          a fallback.
      max_duration_ms:
        type: integer
        minimum: 1000
        maximum: 12000
        default: 5000
      min_rms:
        type: integer
        minimum: 200
        maximum: 8000
        default: 1200
        description: VAD RMS threshold floor for legacy sound activation.
      silence_ms:
        type: integer
        minimum: 300
        maximum: 3000
        default: 900
        description: Silence duration that closes a VAD segment.
      pre_roll_ms:
        type: integer
        minimum: 0
        maximum: 1500
        default: 700
        description: Audio kept before speech detection starts.
      min_segment_ms:
        type: integer
        minimum: 300
        maximum: 3000
        default: 700
        description: Shorter VAD captures are rejected as noise.
      webspace_id:
        type: string
        description: Optional webspace id.
- name: select_redevice_voice_endpoint
  description: Select the ReDevice endpoint used by the voice debug surface.
  entry: handlers.main:select_redevice_voice_endpoint
  input_schema:
    type: object
    properties:
      code:
        type: string
      webspace_id:
        type: string
data_routes:
  streams:
  - receiver: redevice_voice.state
    schema: redevice-voice-state.v1
    description: Debug ReDevice voice endpoint state stream.
