name: conversation_companions
version: 0.3.0-beta.3
description: Conversational characters plus a beta Companion operator grounded in
  the AdaOS Companion Control Plane.
entry: handlers/main.py
runtime:
  python: '3.11'
default_tool: talk
dependencies: []
events:
  subscribe:
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
  publish:
  - io.out.chat.append
  - io.out.stream.publish
conversation:
  channels:
  - id: conversational
    label: Conversational
    owner: skill:conversation_companions
    route_id: voice_chat
    default_tool: talk
    history_policy: node_local
  agents:
  - id: agent:conversation_companions:sage
    label: Мудрец
    owner: skill:conversation_companions
    kind: skill_agent
    channel_id: conversational
    skill: conversation_companions
    talk_tool: talk
    switch_tool: switch_character
    character_id: sage
    gender: male
    voice: ru-male
    icon: sparkles-outline
    aliases:
    - Мудрец
    - Sage
    - Companion
    - компаньон
    - помощник
  - id: agent:conversation_companions:arseni
    label: Арсений
    owner: skill:conversation_companions
    kind: skill_agent
    channel_id: conversational
    skill: conversation_companions
    talk_tool: talk
    switch_tool: switch_character
    character_id: arseni
    gender: male
    voice: ru-male
    icon: male-outline
    aliases:
    - Арсений
    - Arseni
    - Arseniy
    - советник
    - консультант
  - id: agent:conversation_companions:nika
    label: Ника
    owner: skill:conversation_companions
    kind: skill_agent
    channel_id: conversational
    skill: conversation_companions
    talk_tool: talk
    switch_tool: switch_character
    character_id: nika
    gender: female
    voice: ru-female
    icon: female-outline
    aliases:
    - Ника
    - Nika
    - скептик
  - id: agent:conversation_companions:mira
    label: Мира
    owner: skill:conversation_companions
    kind: skill_agent
    channel_id: conversational
    skill: conversation_companions
    talk_tool: talk
    switch_tool: switch_character
    character_id: mira
    gender: female
    voice: ru-female
    icon: heart-circle-outline
    aliases:
    - Мира
    - Mira
    - собеседник
    - рассказчик
exports:
  tools:
  - start
  - list_characters
  - switch_character
  - talk
  - get_companion_context
  - get_learning_lab
  - learning_lab_action
  - list_companion_activity
  - execute_companion_action
  - capture_capability_request
  - update_profile
  - capture_feedback
  - reset_session
  - get_diagnostics
  - publish_diagnostics
  - dispose
memory_budget:
  expected_rss_mb: 64
  caches:
  - name: diagnostics_cache
    storage: process_memory
    max_items: 64
    ttl_seconds: 2
    cleanup_hook: dispose
  - name: diagnostics_stream_fingerprints
    storage: process_memory
    max_items: 64
    cleanup_hook: dispose
lifecycle:
  dispose: dispose
testing:
  consumer_test_seam:
    schema: adaos.skill.consumer_test_seam.v1
    id: companion_console
    mode: mock_exported_tool_boundary
    provider_conformance_owner: conversation_companions
    instruction: Consumer tests fake exported tool replies from the declared schemas
      and fixtures. They do not import provider source, call Root MCP, inspect real
      learning records or establish Core ingress conformance.
    call_contract:
      signature: call(target, params, permissions, reply)
      target_prefix: conversation_companions.
      validate_input_schema: true
      validate_output_schema: true
      authorization:
        rule: Every declared tool permission must be present before dispatch.
        denied_result: {ok: false, error: permission_denied}
      lifecycle:
        pending:
          rule: A started call exposes pending=true and must not update its resultStateKey.
        completed:
          rule: A successful declared reply clears pending and may update resultStateKey.
        failed:
          rule: A denied or failed reply clears pending, preserves the previous successful
            state and exposes the bounded error without fabricating success.
    synthetic_fixtures:
    - id: context_ready
      tool: get_companion_context
      phase: completed
      result:
        ok: true
        webspace_id: synthetic-webspace
        context:
          context_digest: sha256:synthetic-context
          current_scenario: companion_console
          affordances: []
    - id: activity_empty
      tool: list_companion_activity
      phase: completed
      result:
        ok: true
        webspace_id: synthetic-webspace
        receipts: []
        count: 0
        conversation_text_redacted: true
    - id: action_pending
      tool: execute_companion_action
      phase: pending
    - id: action_dispatched
      tool: execute_companion_action
      phase: completed
      result:
        ok: true
        webspace_id: synthetic-webspace
        receipt:
          action_id: companion-action:synthetic
          operation: ui.home.open
          status: dispatched
          cancellable: false
        message: Synthetic action dispatched.
    - id: action_failed
      tool: execute_companion_action
      phase: failed
      result:
        ok: false
        webspace_id: synthetic-webspace
        receipt:
          action_id: companion-action:synthetic-failure
          operation: ui.home.open
          status: failed
          error: {code: executor_error, message: Synthetic failure.}
        message: Synthetic failure.
    - id: capability_recorded
      tool: capture_capability_request
      phase: completed
      result:
        ok: true
        webspace_id: synthetic-webspace
        capability_request:
          id: capability-request:synthetic
          status: recorded
    - id: learning_empty
      tool: get_learning_lab
      phase: completed
      result:
        ok: true
        session_id: companion-session:synthetic
        state: active
        items: []
        diagnostics: []
    - id: feedback_recorded
      tool: learning_lab_action
      phase: completed
      result:
        ok: true
        result: {status: recorded}
tools:
- name: get_learning_lab
  description: Read local development learning sessions, turn evidence, timings, feedback and batch review.
  entry: handlers.main:get_learning_lab
  side_effects: read_only
  input_schema:
    type: object
    properties:
      webspace_id: {type: string}
    additionalProperties: false
  output_schema: {type: object}
  permissions:
  - workspace.read
  application_access:
    permission: workspace.read
    capability: companion.learning.read
- name: learning_lab_action
  description: Record explicit human feedback, seal a session or review a batch anomaly. Not callable by the Companion model.
  entry: handlers.main:learning_lab_action
  side_effects: local_write
  input_schema:
    type: object
    required: [action]
    properties:
      action: {enum: [seal, feedback, review]}
      session_id: {type: string}
      turn_id: {type: string}
      label: {type: string}
      correction: {type: string}
      classification: {type: string}
      decision: {enum: [accept, reject, quarantine, backlog]}
      webspace_id: {type: string}
    additionalProperties: false
  output_schema: {type: object}
  permissions:
  - workspace.write
  application_access:
    permission: workspace.write
    capability: companion.learning.review
- name: start
  description: Start or resume the first-run character onboarding flow.
  entry: handlers.main:start
  input_schema:
    type: object
    properties:
      profile_hint:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    - next_actions
- name: list_characters
  description: List available character profiles and the active character.
  entry: handlers.main:list_characters
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - characters
- name: switch_character
  description: Switch the active character or use a character temporarily.
  entry: handlers.main:switch_character
  input_schema:
    type: object
    required:
    - character_id
    properties:
      character_id:
        type: string
      temporary:
        type: boolean
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
- name: talk
  description: Reply to a user message as the active character, a chosen character,
    or a small panel.
  entry: handlers.main:talk
  input_schema:
    type: object
    properties:
      text:
        type: string
      character_id:
        type: string
      mode:
        type: string
        enum:
        - single
        - temporary
        - panel
      preview:
        type: boolean
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
- name: get_companion_context
  description: Read the current bounded Companion Context Frame from Root MCP.
  entry: handlers.main:get_companion_context
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - context
  permissions:
  - workspace.read
  - external_provider.use
  application_access:
    permission: workspace.read
    capability: companion.context.read
- name: list_companion_activity
  description: List recent redacted Companion action receipts from Root MCP.
  entry: handlers.main:list_companion_activity
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - receipts
    - count
  permissions:
  - workspace.read
  - external_provider.use
  application_access:
    permission: workspace.read
    capability: companion.activity.read
- name: execute_companion_action
  description: Execute one allowlisted semantic operation through Companion Control
    Plane and return its durable receipt.
  entry: handlers.main:execute_companion_action
  side_effects: external_io
  side_effect_class: external_io
  input_schema:
    type: object
    required:
    - operation
    properties:
      operation:
        type: string
      params:
        type: object
      context_digest:
        type: string
      utterance:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - receipt
    - message
  permissions:
  - workspace.write
  - external_provider.use
  application_access:
    permission: workspace.write
    capability: companion.action.execute
- name: capture_capability_request
  description: Record an unmet Companion request as a deduplicated AdaOS Dev Ticket.
  entry: handlers.main:capture_capability_request
  side_effects: external_io
  side_effect_class: external_io
  input_schema:
    type: object
    required:
    - summary
    properties:
      summary:
        type: string
      desired_outcome:
        type: string
      capability_id:
        type: string
      utterance:
        type: string
      severity:
        enum:
        - info
        - low
        - medium
        - high
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - capability_request
  permissions:
  - workspace.write
  - external_provider.use
  application_access:
    permission: workspace.write
    capability: companion.capability_request.capture
- name: update_profile
  description: Apply a bounded style/profile correction to a character.
  entry: handlers.main:update_profile
  input_schema:
    type: object
    required:
    - instruction
    properties:
      character_id:
        type: string
      instruction:
        type: string
      persist:
        type: boolean
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    - patch
- name: capture_feedback
  description: Capture structured control-group feedback without exposing private
    conversation content.
  entry: handlers.main:capture_feedback
  input_schema:
    type: object
    properties:
      rating:
        type: integer
        minimum: 1
        maximum: 5
      expectation:
        type: string
      observation:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
- name: reset_session
  description: Reset active character and short conversation memory for one webspace.
  entry: handlers.main:reset_session
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
- name: get_diagnostics
  description: Return compact operator diagnostics for character trial state without
    exposing conversation or feedback text.
  entry: handlers.main:get_diagnostics
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - items
    - privacy
- name: publish_diagnostics
  description: Publish compact operator diagnostics into the WebUI stream without
    exposing conversation or feedback text.
  entry: handlers.main:publish_diagnostics
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - items
    - privacy
- name: dispose
  description: Release bounded process-local diagnostics caches during runtime unload.
  entry: handlers.main:dispose
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - cleared
data_routes:
- surface: widget:companion_console.context
  route: tool/details
  tool: get_companion_context
  path: root_mcp:companion.context.get
  owner: skill:conversation_companions
  first_paint: loading until a bounded Context Frame is available
  recovery: preserve the last value and allow explicit refresh
  guard_visibility: Root MCP policy and the current webspace bound the projection
  budget:
    max_items: 400
    max_payload_bytes: 1048576
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - companion.context
- surface: widget:companion_console.activity
  route: tool
  tool: list_companion_activity
  path: root_mcp:companion.activity.list
  owner: skill:conversation_companions
  first_paint: empty bounded receipt ledger
  recovery: preserve the last value and allow explicit refresh
  guard_visibility: conversation text is excluded from the activity projection
  budget:
    max_items: 100
    max_payload_bytes: 1048576
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - companion.activity
- surface: conversation trial feedback
  route: skill-local
  path: skill_memory:conversation_companions.feedback
  owner: skill:conversation_companions
  first_paint: deterministic onboarding, no LLM dependency
  recovery: reset_session clears local session state only
  guard_visibility: character state is local; Мудрец control is allowlisted and
    receipt-backed through Root MCP
  budget:
    max_items: 200
    max_payload_bytes: 524288
llm_hints:
  description: Conversational character skill with a Companion operator. Мудрец reads
    a bounded context and executes only published semantic operations through Root MCP.
  aliases:
  - разговорные персонажи
  - персонаж для разговора
  - советник
  - собеседник
  - поговорим
  - мудрец
  - companion
  side_effect_class: local_write
  primary_actions:
  - id: conversation.start
    intent: conversation.start
    tool: start
    side_effect_class: local_write
    examples:
    - поговорим
    - создай разговорного персонажа
    - хочу выбрать собеседника
  - id: conversation.talk
    intent: conversation.talk
    tool: talk
    side_effect_class: local_write
    examples:
    - дай совет
    - что думаешь об этом
    - развлеки меня
    - Мудрец, сколько токенов потратил Codex
    - Мудрец, закрой окно
  - id: conversation.switch_character
    intent: conversation.switch_character
    tool: switch_character
    side_effect_class: local_write
    examples:
    - позови Нику
    - переключись на советника
    - ответь как рассказчик
  - id: conversation.update_profile
    intent: conversation.update_profile
    tool: update_profile
    side_effect_class: local_write
    examples:
    - говори короче
    - будь теплее
    - не задавай вопрос в конце
nlu_hints:
  aliases:
  - разговор
  - персонажи
  - собеседник
  - советник
  - мудрец
  - companion
  examples:
  - text: поговорим
    locale: ru
    intent: conversation.start
  - text: создай персонажа для разговора
    locale: ru
    intent: conversation.start
  - text: дай совет по ситуации
    locale: ru
    intent: conversation.talk
  - text: Мудрец, сколько токенов потратил Codex
    locale: ru
    intent: conversation.talk
  - text: переключись на Нику
    locale: ru
    intent: conversation.switch_character
    slots:
      character_id: nika
  - text: говори короче и теплее
    locale: ru
    intent: conversation.update_profile
nlu:
  regex_rules:
  - id: conversation.start.ru
    intent: conversation.start
    pattern: ^\s*(?:поговорим|давай\s+поговорим|хочу\s+поговорить|хочу\s+выбрать\s+собеседника|выбери\s+собеседника|создай(?:\s+\S+){0,4}\s+персонаж[а]?|запусти\s+(?:собеседника|советника)|собеседник)\s*[.!?]*\s*$
  - id: conversation.switch_character.ru
    intent: conversation.switch_character
    pattern: \b(?:позови|зови|переключись\s+на|пусть\s+ответит|ответь\s+как)\s+(?P<character_id>Мудрец|Sage|Companion|компаньон|помощник|Арсени[йя]|Ник[ауи]?|Мир[ау]?|советник|скептик|рассказчик|собеседник)\b
  - id: conversation.update_profile.ru
    intent: conversation.update_profile
    pattern: \b(?:говори\s+короче|будь\s+(?:теплее|мягче|строже|скептичнее)|не\s+задавай\s+вопросы|без\s+вопросов|не\s+спорь|спорь\s+меньше|без\s+сюсю)\b
  - id: conversation.talk.ru
    intent: conversation.talk
    pattern: \b(?:дай\s+совет|посоветуй|что\s+думаешь|помоги\s+разобраться|развлеки\s+меня|обсудим|поговори\s+со\s+мной)\b
  intents:
    conversation.start:
      examples:
      - поговорим
      - создай персонажа
      - хочу разговорного помощника
      - выбери собеседника
      actions:
      - type: skillTool
        skill: conversation_companions
        tool: start
        params:
          profile_hint: $text
    conversation.talk:
      examples:
      - дай совет
      - что думаешь
      - помоги разобраться
      - развлеки меня
      actions:
      - type: skillTool
        skill: conversation_companions
        tool: talk
        params:
          text: $text
    conversation.switch_character:
      examples:
      - позови Нику
      - позови Мудреца
      - переключись на Арсения
      - пусть ответит рассказчик
      - ответь как скептик
      actions:
      - type: skillTool
        skill: conversation_companions
        tool: switch_character
        params:
          character_id: $slot.character_id
    conversation.update_profile:
      examples:
      - говори короче
      - будь теплее
      - не задавай вопросы в конце
      - не спорь так резко
      actions:
      - type: skillTool
        skill: conversation_companions
        tool: update_profile
        params:
          instruction: $text
