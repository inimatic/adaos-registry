name: research_manager_skill
version: 0.5.0
description: Provider-neutral governed research manager, local tracker, evidence exporter,
  and deterministic fixture runner.
entry: handlers/main.py
runtime:
  kind: service
  in_process_events: false
  env:
    mode: shared
    python: '3.11'
    allow_heavy_dependencies: true
  activation:
    mode: lazy
    startup_allowed: true
    background_refresh: false
    when:
      scenarios_active:
      - tlp_research
service:
  host: 127.0.0.1
  port: 18120
  command:
  - -m
  - handlers.service
  healthcheck:
    path: /health
    timeout_ms: 1000
capabilities:
- storage.relational
- execution.jobs
dependencies: []
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
default_tool: get_study
tools:
- name: ensure_schema
  description: Apply checksum-pinned research repository migrations and report the
    redacted binding.
  entry: handlers.main:ensure_schema
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: rehydrate
  description: Re-open the durable repository after activation or restart.
  entry: handlers.main:rehydrate
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: create_study
  description: Create an immutable study, hypothesis, protocol, plan, and isolated
    split bindings.
  entry: handlers.main:create_study
  input_schema:
    type: object
    required:
    - title
    - hypothesis
    - protocol
    - analysis_plan
    - splits
    - idempotency_key
    properties:
      title:
        type: string
      hypothesis:
        type: string
      protocol:
        type: object
      analysis_plan:
        type: object
      splits:
        type: object
      mode:
        enum:
        - exploratory
        - confirmatory
      study_id:
        type:
        - string
        - 'null'
      idempotency_key:
        type: string
  output_schema:
    type: object
- name: advance_workflow
  description: Apply one generation-checked governed research lifecycle command.
  entry: handlers.main:advance_workflow
  input_schema:
    type: object
    required:
    - study_id
    - command
    - expected_generation
    - idempotency_key
    properties:
      study_id:
        type: string
      command:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
      evidence_refs:
        type: array
        items:
          type: string
  output_schema:
    type: object
- name: amend_protocol
  description: Create a lineage-linked protocol version and explicitly retain or invalidate
    prior trials.
  entry: handlers.main:amend_protocol
  input_schema:
    type: object
    required:
    - study_id
    - content
    - reason
    - prior_trials
    - expected_generation
    - idempotency_key
    properties:
      study_id:
        type: string
      content:
        type: object
      reason:
        type: string
      prior_trials:
        enum:
        - retain
        - invalidate
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: materialize_trials
  description: Materialize paired immutable trial groups from a locked protocol and
    analysis plan.
  entry: handlers.main:materialize_trials
  input_schema:
    type: object
    required:
    - study_id
    - matrix
    - idempotency_key
    properties:
      study_id:
        type: string
      matrix:
        type: array
        items:
          type: object
      idempotency_key:
        type: string
  output_schema:
    type: object
- name: run_fixture
  description: Run the deterministic no-training fixture while preserving run and
    physical attempt identities.
  entry: handlers.main:run_fixture
  timeout_seconds: 30
  input_schema:
    type: object
    required:
    - study_id
    - trial_id
    - split_role
    - seed
    - idempotency_key
    properties:
      study_id:
        type: string
      trial_id:
        type: string
      split_role:
        enum:
        - validation
        - robustness
        - test
      seed:
        type: integer
      idempotency_key:
        type: string
  output_schema:
    type: object
- name: create_experiment
  description: Create an experiment aggregate and its first immutable condition revision.
  entry: handlers.main:create_experiment
  side_effects: local_write
  input_schema:
    type: object
    required:
    - study_id
    - slug
    - title
    - purpose
    - conditions
    - idempotency_key
    properties:
      study_id:
        type: string
      slug:
        type: string
      title:
        type: string
      purpose:
        type: string
      conditions:
        type: object
      experiment_id:
        type:
        - string
        - 'null'
      idempotency_key:
        type: string
  output_schema:
    type: object
- name: revise_experiment
  description: Append an optimistic, immutable experiment condition revision.
  entry: handlers.main:revise_experiment
  side_effects: local_write
  input_schema:
    type: object
    required:
    - experiment_id
    - expected_revision
    - conditions
    - rationale
    - idempotency_key
    properties:
      experiment_id:
        type: string
      expected_revision:
        type: integer
      conditions:
        type: object
      rationale:
        type: string
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: revise_experiment_json
  description: Validate an edited JSON condition document and append a new immutable
    revision.
  entry: handlers.main:revise_experiment_json
  side_effects: local_write
  input_schema:
    type: object
    required:
    - experiment_id
    - expected_revision
    - conditions_json
    - rationale
    properties:
      experiment_id:
        type: string
      expected_revision:
        type: integer
      conditions_json:
        type: string
      rationale:
        type: string
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: submit_experiment_review
  description: Move a draft experiment revision into review.
  entry: handlers.main:submit_experiment_review
  side_effects: local_write
  input_schema:
    type: object
    required:
    - experiment_id
    - expected_generation
    properties:
      experiment_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: lock_experiment
  description: Lock the reviewed revision and its study protocol against mutation.
  entry: handlers.main:lock_experiment
  side_effects: local_write
  input_schema:
    type: object
    required:
    - experiment_id
    - expected_generation
    properties:
      experiment_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: start_experiment
  description: Materialize paired trials and submit non-blocking CPU attempts for
    a locked profile.
  entry: handlers.main:start_experiment
  timeout_seconds: 60
  side_effects: runtime_write
  input_schema:
    type: object
    required:
    - experiment_id
    - profile
    - expected_generation
    properties:
      experiment_id:
        type: string
      profile:
        enum:
        - preflight
        - confirmatory
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: reconcile_experiment
  description: Reconcile attempts, ingest tracker events and artifacts, and derive
    terminal state.
  entry: handlers.main:reconcile_experiment
  timeout_seconds: 60
  side_effects: runtime_write
  input_schema:
    type: object
    required:
    - experiment_id
    properties:
      experiment_id:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: cancel_experiment
  description: Request cancellation for every current physical attempt without changing
    run identity.
  entry: handlers.main:cancel_experiment
  side_effects: runtime_write
  input_schema:
    type: object
    required:
    - experiment_id
    - expected_generation
    properties:
      experiment_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: retry_run
  description: Submit a new physical attempt for one unsuccessful logical run.
  entry: handlers.main:retry_run
  side_effects: runtime_write
  input_schema:
    type: object
    required:
    - experiment_id
    - run_id
    - expected_generation
    properties:
      experiment_id:
        type: string
      run_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: finalize_experiment
  description: Fix a paired result and its normalized tracker export as immutable
    evidence.
  entry: handlers.main:finalize_experiment
  side_effects: local_write
  input_schema:
    type: object
    required:
    - experiment_id
    - expected_generation
    properties:
      experiment_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: verify_experiment_result
  description: Verify a fixed result, tracker export, and every content-addressed
    artifact.
  entry: handlers.main:verify_experiment_result
  side_effects: read_only
  input_schema:
    type: object
    required:
    - result_id
    properties:
      result_id:
        type: string
  output_schema:
    type: object
- name: get_experiment
  description: Return the complete Single Experiment Workbench projection.
  entry: handlers.main:get_experiment
  side_effects: read_only
  input_schema:
    type: object
    required:
    - experiment_id
    properties:
      experiment_id:
        type: string
  output_schema:
    type: object
- name: list_experiment_attempts
  description: List the current physical attempt projection for the workbench.
  entry: handlers.main:list_experiment_attempts
  side_effects: read_only
  input_schema:
    type: object
    required:
    - experiment_id
    properties:
      experiment_id:
        type: string
  output_schema:
    type: object
- name: list_experiment_pairs
  description: List paired arm results by seed.
  entry: handlers.main:list_experiment_pairs
  side_effects: read_only
  input_schema:
    type: object
    required:
    - experiment_id
    properties:
      experiment_id:
        type: string
  output_schema:
    type: object
- name: list_experiment_artifacts
  description: List content-addressed experiment artifacts.
  entry: handlers.main:list_experiment_artifacts
  side_effects: read_only
  input_schema:
    type: object
    required:
    - experiment_id
    properties:
      experiment_id:
        type: string
  output_schema:
    type: object
- name: unblind_test
  description: Auditably unblind the sealed test binding after the QC gate.
  entry: handlers.main:unblind_test
  input_schema:
    type: object
    required:
    - study_id
    - expected_generation
    - idempotency_key
    - reason
    - evidence_refs
    properties:
      study_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      reason:
        type: string
      evidence_refs:
        type: array
        minItems: 1
        items:
          type: string
      actor:
        type: string
  output_schema:
    type: object
- name: export_evidence
  description: Finalize one portable content-addressed evidence manifest.
  entry: handlers.main:export_evidence
  input_schema:
    type: object
    required:
    - study_id
    properties:
      study_id:
        type: string
  output_schema:
    type: object
- name: verify_evidence
  description: Deterministically verify an evidence manifest and every research-record
    reference.
  entry: handlers.main:verify_evidence
  input_schema:
    type: object
    required:
    - bundle_id
    properties:
      bundle_id:
        type: string
  output_schema:
    type: object
- name: decide_claim
  description: Record a claim review decision over a verified evidence bundle.
  entry: handlers.main:decide_claim
  input_schema:
    type: object
    required:
    - study_id
    - verdict
    - rationale
    - bundle_id
    - expected_generation
    - idempotency_key
    properties:
      study_id:
        type: string
      verdict:
        enum:
        - accepted
        - rejected
        - inconclusive
      rationale:
        type: string
      bundle_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: get_study
  description: Return the event-derived workflow state, entity counts, and audit history.
  entry: handlers.main:get_study
  side_effects: read_only
  input_schema:
    type: object
    required:
    - study_id
    properties:
      study_id:
        type: string
  output_schema:
    type: object
data_routes:
- surface: widget:tlp-study-status
  route: tool/details
  tool: get_study
  owner: skill:research_manager_skill
  first_paint: TLP study identity and protocol-review context from the scenario package
  recovery: repeat get_study for the immutable TLP study identity
  guard_visibility: read-only study metadata and audit history; sealed dataset locators
    remain governed by the skill
  budget:
    max_payload_bytes: 262144
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - tlp-research
- surface: page:tlp-experiment-workbench
  route: tool/details
  tool: get_experiment
  owner: skill:research_manager_skill
  first_paint: control-experiment condition revision, lifecycle, attempts, results,
    and evidence state
  recovery: reconcile the experiment and repeat get_experiment
  guard_visibility: sealed test locators and provider secrets are never projected
  budget:
    max_payload_bytes: 2097152
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - tlp-experiment
    - tlp-tracking
    - tlp-evidence
