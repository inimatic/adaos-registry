name: research_manager_skill
version: 0.4.0
description: Provider-neutral governed research manager, local tracker, evidence exporter,
  and deterministic fixture runner.
entry: handlers/main.py
runtime:
  kind: service
  in_process_events: false
  env:
    mode: shared
    python: '3.11'
  activation:
    mode: lazy
    startup_allowed: true
    background_refresh: false
    when:
      scenarios_active:
      - tlp_research
service:
  host: 127.0.0.1
  port: 18120
  command:
  - -m
  - handlers.service
  healthcheck:
    path: /health
    timeout_ms: 1000
capabilities:
- storage.relational
- execution.jobs
dependencies: []
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
default_tool: get_study
tools:
- name: ensure_schema
  description: Apply checksum-pinned research repository migrations and report the
    redacted binding.
  entry: handlers.main:ensure_schema
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: rehydrate
  description: Re-open the durable repository after activation or restart.
  entry: handlers.main:rehydrate
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: create_study
  description: Create an immutable study, hypothesis, protocol, plan, and isolated
    split bindings.
  entry: handlers.main:create_study
  input_schema:
    type: object
    required:
    - title
    - hypothesis
    - protocol
    - analysis_plan
    - splits
    - idempotency_key
    properties:
      title:
        type: string
      hypothesis:
        type: string
      protocol:
        type: object
      analysis_plan:
        type: object
      splits:
        type: object
      mode:
        enum:
        - exploratory
        - confirmatory
      study_id:
        type:
        - string
        - 'null'
      idempotency_key:
        type: string
  output_schema:
    type: object
- name: advance_workflow
  description: Apply one generation-checked governed research lifecycle command.
  entry: handlers.main:advance_workflow
  input_schema:
    type: object
    required:
    - study_id
    - command
    - expected_generation
    - idempotency_key
    properties:
      study_id:
        type: string
      command:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
      evidence_refs:
        type: array
        items:
          type: string
  output_schema:
    type: object
- name: amend_protocol
  description: Create a lineage-linked protocol version and explicitly retain or invalidate
    prior trials.
  entry: handlers.main:amend_protocol
  input_schema:
    type: object
    required:
    - study_id
    - content
    - reason
    - prior_trials
    - expected_generation
    - idempotency_key
    properties:
      study_id:
        type: string
      content:
        type: object
      reason:
        type: string
      prior_trials:
        enum:
        - retain
        - invalidate
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: materialize_trials
  description: Materialize paired immutable trial groups from a locked protocol and
    analysis plan.
  entry: handlers.main:materialize_trials
  input_schema:
    type: object
    required:
    - study_id
    - matrix
    - idempotency_key
    properties:
      study_id:
        type: string
      matrix:
        type: array
        items:
          type: object
      idempotency_key:
        type: string
  output_schema:
    type: object
- name: run_fixture
  description: Run the deterministic no-training fixture while preserving run and
    physical attempt identities.
  entry: handlers.main:run_fixture
  timeout_seconds: 30
  input_schema:
    type: object
    required:
    - study_id
    - trial_id
    - split_role
    - seed
    - idempotency_key
    properties:
      study_id:
        type: string
      trial_id:
        type: string
      split_role:
        enum:
        - validation
        - robustness
        - test
      seed:
        type: integer
      idempotency_key:
        type: string
  output_schema:
    type: object
- name: unblind_test
  description: Auditably unblind the sealed test binding after the QC gate.
  entry: handlers.main:unblind_test
  input_schema:
    type: object
    required:
    - study_id
    - expected_generation
    - idempotency_key
    - reason
    - evidence_refs
    properties:
      study_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      reason:
        type: string
      evidence_refs:
        type: array
        minItems: 1
        items:
          type: string
      actor:
        type: string
  output_schema:
    type: object
- name: export_evidence
  description: Finalize one portable content-addressed evidence manifest.
  entry: handlers.main:export_evidence
  input_schema:
    type: object
    required:
    - study_id
    properties:
      study_id:
        type: string
  output_schema:
    type: object
- name: verify_evidence
  description: Deterministically verify an evidence manifest and every research-record
    reference.
  entry: handlers.main:verify_evidence
  input_schema:
    type: object
    required:
    - bundle_id
    properties:
      bundle_id:
        type: string
  output_schema:
    type: object
- name: decide_claim
  description: Record a claim review decision over a verified evidence bundle.
  entry: handlers.main:decide_claim
  input_schema:
    type: object
    required:
    - study_id
    - verdict
    - rationale
    - bundle_id
    - expected_generation
    - idempotency_key
    properties:
      study_id:
        type: string
      verdict:
        enum:
        - accepted
        - rejected
        - inconclusive
      rationale:
        type: string
      bundle_id:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
  output_schema:
    type: object
- name: get_study
  description: Return the event-derived workflow state, entity counts, and audit history.
  entry: handlers.main:get_study
  side_effects: read_only
  input_schema:
    type: object
    required:
    - study_id
    properties:
      study_id:
        type: string
  output_schema:
    type: object
data_routes:
- surface: widget:tlp-study-status
  route: tool/details
  tool: get_study
  owner: skill:research_manager_skill
  first_paint: TLP study identity and protocol-review context from the scenario package
  recovery: repeat get_study for the immutable TLP study identity
  guard_visibility: read-only study metadata and audit history; sealed dataset locators
    remain governed by the skill
  budget:
    max_payload_bytes: 262144
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - tlp-research
