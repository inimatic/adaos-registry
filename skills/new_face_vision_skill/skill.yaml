name: new_face_vision_skill
version: 0.2.21
description: Анализ дефектов камней на видео с помощью нейросети (сегментация DeepLabV3)
entry: handlers/main.py
runtime:
  python: '3.11'
  env:
    allow_heavy_dependencies: true
dependencies:
- pillow>=10.0.0
- numpy>=1.24.0
- torch>=2.2.0
- torchvision>=0.17.0
models:
  private: true
lifecycle:
  persist_before_switch: new_face_vision_persist_state
  rehydrate: new_face_vision_rehydrate
tools:
- name: new_face_vision_persist_state
  description: Persist the active uploaded file manifest for runtime handoff.
  entry: handlers.main:new_face_vision_persist_state
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_rehydrate
  description: Restore active files and counters from durable skill state.
  entry: handlers.main:new_face_vision_rehydrate
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_status
  description: Получить текущий статус скилла и статистику
  entry: handlers.main:new_face_vision_status
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      current:
        type: object
- name: new_face_vision_configure
  description: Настроить параметры скилла (пороги, пути к файлам)
  entry: handlers.main:new_face_vision_configure
  input_schema:
    type: object
    properties:
      model_path:
        type: string
      frames_path:
        type: string
      masks_path:
        type: string
      metadata_path:
        type: string
      threshold:
        type: number
      warning_threshold:
        type: number
      alarm_threshold:
        type: number
      webspace_id:
        type: string
- name: new_face_vision_load_model
  description: Загрузить веса модели PyTorch
  entry: handlers.main:new_face_vision_load_model
  timeout_seconds: 300
  input_schema:
    type: object
    properties:
      path:
        type: string
      artifact_ref:
        type: object
      file:
        type: object
      webspace_id:
        type: string
- name: new_face_vision_model_storage_status
  description: Get Root-hosted current and previous model artifact metadata.
  entry: handlers.main:new_face_vision_model_storage_status
  input_schema:
    type: object
    properties:
      label:
        type: string
      webspace_id:
        type: string
- name: new_face_vision_restore_previous_model
  description: Download the previous Root-hosted model artifact and load it.
  entry: handlers.main:new_face_vision_restore_previous_model
  timeout_seconds: 300
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_load_frames
  description: Загрузить кадры (ZIP с изображениями)
  entry: handlers.main:new_face_vision_load_frames
  timeout_seconds: 300
  input_schema:
    type: object
    properties:
      path:
        type: string
      artifact_ref:
        type: object
      file:
        type: object
      webspace_id:
        type: string
- name: new_face_vision_load_masks
  description: Загрузить маски (ZIP с изображениями)
  entry: handlers.main:new_face_vision_load_masks
  timeout_seconds: 300
  input_schema:
    type: object
    properties:
      path:
        type: string
      artifact_ref:
        type: object
      file:
        type: object
      webspace_id:
        type: string
- name: new_face_vision_load_metadata
  description: Загрузить метаданные (JSONL)
  entry: handlers.main:new_face_vision_load_metadata
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      path:
        type: string
      artifact_ref:
        type: object
      file:
        type: object
      webspace_id:
        type: string
- name: new_face_vision_process_frame
  description: Обработать кадр и получить предсказание
  entry: handlers.main:new_face_vision_process_frame
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      frame_idx:
        type: integer
      webspace_id:
        type: string
- name: new_face_vision_play_step
  description: Обработать следующий кадр (play)
  entry: handlers.main:new_face_vision_play_step
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_step_forward
  description: Show the next frame result.
  entry: handlers.main:new_face_vision_step_forward
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_step_back
  description: Show the previous frame result without changing aggregate metrics.
  entry: handlers.main:new_face_vision_step_back
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_seek_frame
  description: Seek to a frame by index without changing aggregate metrics.
  entry: handlers.main:new_face_vision_seek_frame
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      frame_idx:
        type: integer
        minimum: 0
      webspace_id:
        type: string
- name: new_face_vision_play
  description: Start stream-backed playback for the loaded frame set.
  entry: handlers.main:new_face_vision_play
  timeout_seconds: 90
  input_schema:
    type: object
    properties:
      fps:
        type: number
      webspace_id:
        type: string
- name: new_face_vision_pause
  description: Pause stream-backed playback without clearing the current frame.
  entry: handlers.main:new_face_vision_pause
  timeout_seconds: 90
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_stop
  description: Stop playback and reset the frame cursor.
  entry: handlers.main:new_face_vision_stop
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_replay
  description: Reset the run and start playback from the first frame.
  entry: handlers.main:new_face_vision_replay
  timeout_seconds: 90
  input_schema:
    type: object
    properties:
      fps:
        type: number
      webspace_id:
        type: string
- name: new_face_vision_reset
  description: Сбросить текущий кадр на первый
  entry: handlers.main:new_face_vision_reset
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_clear
  description: Очистить все данные (модель, кадры, маски)
  entry: handlers.main:new_face_vision_clear
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
- name: new_face_vision_action
  description: Выполнить действие (play, reset, clear, load_*)
  entry: handlers.main:new_face_vision_action
  input_schema:
    type: object
    properties:
      id:
        type: string
      value:
        type: string
      webspace_id:
        type: string
events:
  subscribe:
  - new_face_vision.action
  - new_face_vision.status.refresh
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
  - sys.ready
  publish:
  - new_face_vision.ready
  - new_face_vision.frame
  - new_face_vision.error
  - io.out.stream.publish
data_routes:
- surface: scenario:new_face_vision.status
  route: yjs
  owner: skill:new_face_vision_skill
  projection_slot: new_face_vision.current
  path: data/new_face_vision/current
  first_paint: compact status, file refs, counters, thresholds, playback mode, and
    latest summary
  recovery: Yjs replay restores the latest compact control state; status refresh can
    rebuild it.
  update_source:
  - new_face_vision_status
  - new_face_vision_configure
  - new_face_vision_load_*
  - new_face_vision_* playback tools
  budget:
    max_payload_bytes: 12288
    max_publish_hz: 2
    coalesce_ms: 250
    snapshot_policy: none
  guard_visibility:
    degraded_state: UI keeps the last compact state; frame preview and chart details
      remain stream-only.
    log: service.new_face_vision_skill.runtime.log
    quarantine: true
    metric: yjs_owner_guard.new_face_vision.current
- surface: scenario:new_face_vision.frame_preview
  route: stream
  owner: skill:new_face_vision_skill
  receiver: newface_vision_frame
  first_paint: empty frame viewer until a frame is processed or a stream snapshot
    is replayed
  recovery: Stream snapshot request republishes the last in-memory preview when available.
  update_source:
  - new_face_vision_process_frame
  - new_face_vision_play
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 30
    coalesce_ms: 33
    max_items: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Preview can go stale independently while Yjs status and controls
      remain usable.
    log: service.new_face_vision_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.new_face_vision.frame
- surface: scenario:new_face_vision.metrics
  route: stream
  owner: skill:new_face_vision_skill
  receiver: newface_vision_metrics
  first_paint: empty bounded chart history
  recovery: Stream snapshot request replays the last 120 in-memory metric points.
  update_source:
  - new_face_vision_process_frame
  - new_face_vision_play
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 8192
    max_publish_hz: 30
    coalesce_ms: 33
    max_items: 120
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Charts can lose older samples without touching compact Yjs state.
    log: service.new_face_vision_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.new_face_vision.metrics
- surface: scenario:new_face_vision.progress
  route: stream
  owner: skill:new_face_vision_skill
  receiver: newface_vision_progress
  first_paint: empty progress state
  recovery: Stream snapshot request republishes the last compact operation/error payload.
  update_source:
  - new_face_vision_load_*
  - new_face_vision_process_frame
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 4096
    max_publish_hz: 4
    coalesce_ms: 250
    max_items: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Last progress message can be stale; errors are also mirrored in
      compact Yjs.
    log: service.new_face_vision_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.new_face_vision.progress
data_projections:
- scope: subnet
  slot: new_face_vision.current
  targets:
  - backend: yjs
    path: data/new_face_vision/current
- scope: subnet
  slot: new_face_vision.history
  targets:
  - backend: yjs
    path: data/new_face_vision/history
