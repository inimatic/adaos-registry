name: subscription_status_skill
version: 0.1.8
description: User-facing AdaOS subscription status widget and modal backed by the
  local economic entitlement snapshot with explicit Root refresh.
webui_owner: shared
runtime:
  python: '3.11'
  activation:
    mode: lazy
    startup_allowed: true
    background_refresh: false
    when:
      client_presence: true
      webspace_scope: active
data_projections:
- scope: current_user
  slot: subscription_status.snapshot
  targets:
  - backend: yjs
    path: data/subscription_status
memory_budget:
  expected_rss_mb: 48
lifecycle: {}
events:
  subscribe:
  - sys.ready
  - desktop.webspace.refresh
  - desktop.webspace.reload
  - root.mgmnt.snapshot.changed
  - subnet.member.snapshot.changed
  - subnet.member.status.changed
default_tool: get_status
tools:
- name: get_status
  description: Return and project the current local AdaOS subscription status.
  entry: handlers.main:get_status
  side_effects: local_write
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
      refresh_root_if_missing:
        type:
        - boolean
        - 'null'
  output_schema:
    type: object
    properties: {}
- name: refresh_status
  description: Pull the current root entitlement snapshot and refresh the AdaOS subscription
    status widget projection.
  entry: handlers.main:refresh_status
  side_effects: local_write
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
    properties: {}
- name: list_resources
  description: Return current AdaOS subscription resources and quota status rows.
  entry: handlers.main:list_resources
  side_effects: local_write
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
    properties: {}
- name: list_usage_history
  description: Return current AdaOS subscription usage window rows.
  entry: handlers.main:list_usage_history
  side_effects: local_write
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
    properties: {}
- name: request_plan_change
  description: Record a local user request to change the AdaOS subscription plan.
  entry: handlers.main:request_plan_change
  side_effects: local_write
  input_schema:
    type: object
    properties:
      desired_plan_id:
        type: string
      note:
        type:
        - string
        - 'null'
      webspace_id:
        type:
        - string
        - 'null'
    required:
    - desired_plan_id
  output_schema:
    type: object
    properties: {}
nlu:
  intents:
  - id: subscription.status.show
    examples:
    - show my subscription
    - show AdaOS subscription status
    - показать подписку AdaOS
    tool: get_status
updated_at: '2026-08-28T12:03:48+00:00'
compatibility:
