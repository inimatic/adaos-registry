name: research_orchestrator_skill
version: 0.51.1
description: Durable pre-Codex orchestration for reusable AdaOS research directions,
  bounded tasks, compilations, and implementation tracks.
supported_locales:
- en
- ru
entry: handlers/main.py
default_tool: chat
runtime:
  python: '3.11'
data_migration:
  file: migrations/data_migration.py
  source_policy: previous_runtime_bucket
  retention: retain_until_previous_runtime_retired
capabilities:
- storage.relational
- builder.project_sources
- skills.invoke
dependencies: []
events:
  subscribe: []
  publish:
  - io.out.chat.append
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
exports:
  tools:
  - ensure_schema
  - project_execution_contracts
  - rehydrate
  - list_directions
  - resolve_focus
  - create_direction
  - initialize_direction
  - create_task
  - select_active_task
  - attach_source
  - set_source_visibility
  - sync_source_bundle
  - get_direction
  - get_outline
  - adopt_calibration_lineage
  - get_lineage
  - get_studies
  - list_artifacts
  - preview_artifact
  - get_consensus
  - record_prototype
  - chat
  - accept_prototype
  - get_automation_brief
  - open_builder_session
  - refresh_development_contract
  - branch_implementation_track
  - get_activity
  - get_formulation_run
  - get_compilation
  - next_steps
tools:
- name: project_execution_contracts
  description: Project full audit contracts into compact digest-bound scientific and
    engineering inputs for an isolated developer.
  entry: handlers.main:project_execution_contracts
  side_effects: none
  input_schema:
    type: object
    required:
    - compilation
    - automation_brief
    properties:
      compilation:
        type: object
      automation_brief:
        type: object
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - research_compilation
    - automation_brief
    - audit_compilation_digest
    - audit_automation_brief_digest
    - runtime_identity
- name: ensure_schema
  description: Apply checksum-pinned orchestrator migrations.
  entry: handlers.main:ensure_schema
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: rehydrate
  description: Re-open durable orchestration state after activation.
  entry: handlers.main:rehydrate
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: list_directions
  description: List the authoritative local adaos.research.direction.v1 index and
    aggregate formulation status.
  entry: handlers.main:list_directions
  side_effects: none
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 5000
    additionalProperties: true
  output_schema:
    type: object
- name: resolve_focus
  description: Resolve a research direction from the selection of a paired Builder
    host.
  entry: handlers.main:resolve_focus
  side_effects: none
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: create_direction
  description: Atomically create a logical research direction and its physical artifact-custodian
    skill.
  entry: handlers.main:create_direction
  side_effects: local_write
  input_schema:
    type: object
    required:
    - project_id
    - title
    properties:
      project_id:
        type: string
      title:
        type: string
      description:
        type: string
      skill_id:
        type:
        - string
        - 'null'
      tags:
        type: array
        items:
          type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: initialize_direction
  description: Adopt one legacy artifact-custodian skill into the research-domain
    index.
  entry: handlers.main:initialize_direction
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - title
    properties:
      direction_id:
        type: string
      title:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: create_task
  description: Create a bounded task with optional parent, branch, and dependency
    relations inside one research direction.
  entry: handlers.main:create_task
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - title
    properties:
      direction_id:
        type: string
      title:
        type: string
      task_id:
        type:
        - string
        - 'null'
      research_question:
        type: string
      parent_task_id:
        type:
        - string
        - 'null'
      branch_of_task_id:
        type:
        - string
        - 'null'
      dependency_refs:
        type: array
        items:
          type: string
      activate:
        type: boolean
        default: false
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: select_active_task
  description: Select the exact task that subsequent formulation writes may update.
  entry: handlers.main:select_active_task
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - task_id
    properties:
      direction_id:
        type: string
      task_id:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: attach_source
  description: Copy a local upload into a manifested artifact group owned by the direction
    skill.
  entry: handlers.main:attach_source
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - path
    properties:
      direction_id:
        type: string
      path:
        type: string
      group_id:
        type: string
        default: part0
      name:
        type:
        - string
        - 'null'
      role:
        type: string
      visibility_profile:
        type: string
        enum:
        - shared
        - evaluation_only
        - formulation_only
        - implementation_input
        default: shared
      cleanup_staging:
        type: boolean
        default: false
      replace_existing:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: set_source_visibility
  description: Apply a research-stage visibility profile to one manifested artifact.
  entry: handlers.main:set_source_visibility
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - group_id
    - artifact_id
    - visibility_profile
    properties:
      direction_id:
        type: string
      group_id:
        type: string
      artifact_id:
        type: string
      visibility_profile:
        type: string
        enum:
        - shared
        - evaluation_only
        - formulation_only
        - implementation_input
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_direction
  description: Return the canonical pre-Codex state and current SourceBundle.
  entry: handlers.main:get_direction
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: get_outline
  description: Project a research direction, its tasks, compilations, and implementation
    tracks as a generic navigation outline.
  entry: handlers.main:get_outline
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: adopt_calibration_lineage
  description: Import path-free immutable calibration identities through the evaluator
    public tool and attach them to one canonical task and implementation tracks.
  entry: handlers.main:adopt_calibration_lineage
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - evaluator_task_id
    properties:
      direction_id:
        type: string
      evaluator_task_id:
        type: string
      budget_view:
        enum:
        - fixed_downstream
        - fixed_total_system
        default: fixed_downstream
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_lineage
  description: Read one joined source, task, compilation, implementation packet, candidate,
    result, cost, and failure projection.
  entry: handlers.main:get_lineage
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: get_studies
  description: Read Study references connected to one exact ResearchTask.
  entry: handlers.main:get_studies
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: sync_source_bundle
  description: Reconcile direct Builder project uploads into durable orchestration
    state.
  entry: handlers.main:sync_source_bundle
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: list_artifacts
  description: List exact manifested artifact items owned by a direction skill.
  entry: handlers.main:list_artifacts
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: preview_artifact
  description: Preview one exact manifested Markdown, text, or PDF source artifact.
  entry: handlers.main:preview_artifact
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    - group_id
    - artifact_id
    properties:
      direction_id:
        type: string
      group_id:
        type: string
      artifact_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_consensus
  description: Read a compact human-readable projection of the evolving ResearchPrototype
    or accepted AutomationBrief.
  entry: handlers.main:get_consensus
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: record_prototype
  description: Record one typed ResearchPrototype draft with core-owned source coverage
    and deterministic admission review.
  entry: handlers.main:record_prototype
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - prototype
    properties:
      direction_id:
        type: string
      prototype:
        type: object
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: chat
  description: Discuss a research direction with the configured Root LLM and materialize
    a provenance-grounded ResearchPrototype revision through bounded schema and semantic
    repair.
  entry: handlers.main:chat
  side_effects: local_write
  timeout_seconds: 1800
  input_schema:
    type: object
    required:
    - direction_id
    - text
    properties:
      direction_id:
        type: string
      text:
        type: string
      task_id:
        type:
        - string
        - 'null'
      model:
        type:
        - string
        - 'null'
      actor:
        description: Stable caller identity recorded in the durable directive trace.
        type:
        - string
        - 'null'
      invocation_origin:
        description: Conversation, API, CLI, Codex, or another caller channel used
          to decide whether the directive must also be projected into chat.
        type:
        - string
        - 'null'
      webspace_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: resume_compilation
  description: Resume deterministic compilation from three digest-verified durable
    LLM stage outputs without rerunning the model.
  entry: handlers.main:resume_compilation
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - run_id
    properties:
      direction_id:
        type: string
      run_id:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - resumed
    - prototype
    - compilation
    - formulation_run
- name: accept_prototype
  description: Accept an exact candidate digest and emit a digest-bound pre-Codex
    AutomationBrief.
  entry: handlers.main:accept_prototype
  side_effects: external_write
  input_schema:
    type: object
    required:
    - direction_id
    - prototype_digest
    - expected_generation
    - idempotency_key
    properties:
      direction_id:
        type: string
      prototype_digest:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_automation_brief
  description: Read the accepted immutable AutomationBrief.
  entry: handlers.main:get_automation_brief
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: open_builder_session
  description: Bind the exact Development Session and return a canonical Builder link.
  entry: handlers.main:open_builder_session
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      builder_webspace_id:
        type: string
        default: desktop-dev
      base_url:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: refresh_development_contract
  description: Supersede the exact Development Session when its admitted consumer
    ABI has changed, preserving the accepted scientific and engineering instructions.
  entry: handlers.main:refresh_development_contract
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: branch_implementation_track
  description: Create an idempotent successor ImplementationTrack for a repaired
    realization while preserving predecessor release, Study, and Experiment identity.
  entry: handlers.main:branch_implementation_track
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      reason:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: start_implementation
  description: Start one-shot Builder Automation using only the exact digest-bound
    Development Session inputs.
  entry: handlers.main:start_implementation
  side_effects: external_write
  timeout_seconds: 240
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      builder_webspace_id:
        type:
        - string
        - 'null'
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: sync_implementation
  description: Import a durable idempotent Builder Automation status snapshot into
    research activity.
  entry: handlers.main:sync_implementation
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      builder_webspace_id:
        type:
        - string
        - 'null'
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: prepare_project_release
  description: Prepare a Builder candidate trial and bind its immutable release digest
    to the implementation track.
  entry: handlers.main:prepare_project_release
  side_effects: external_write
  timeout_seconds: 300
  input_schema:
    type: object
    required:
    - direction_id
    - confirmed
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      builder_webspace_id:
        type:
        - string
        - 'null'
      bump:
        enum:
        - major
        - minor
        - patch
        default: patch
      confirmed:
        const: true
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: publish_project_release
  description: Promote the exact reviewed Builder candidate and bind its ProjectRelease
    identity.
  entry: handlers.main:publish_project_release
  side_effects: external_write
  timeout_seconds: 360
  input_schema:
    type: object
    required:
    - direction_id
    - confirmed
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      builder_webspace_id:
        type:
        - string
        - 'null'
      bump:
        enum:
        - major
        - minor
        - patch
        default: patch
      confirmed:
        const: true
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: instantiate_study
  description: Create an exact ResearchManager StudyRealization and draft Experiment
    from the accepted ExperimentPlan.
  entry: handlers.main:instantiate_study
  side_effects: external_write
  timeout_seconds: 300
  input_schema:
    type: object
    required:
    - direction_id
    - idempotency_key
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      idempotency_key:
        type: string
        minLength: 1
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: start_study_smoke
  description: Explicitly lock the compiled protocol and submit its non-inferential
    CPU preflight through ResearchManager.
  entry: handlers.main:start_study_smoke
  side_effects: external_write
  timeout_seconds: 300
  input_schema:
    type: object
    required:
    - direction_id
    - idempotency_key
    - confirmed
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      idempotency_key:
        type: string
        minLength: 1
      confirmed:
        const: true
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: sync_study
  description: Reconcile ResearchManager execution and import an idempotent Study
    activity snapshot.
  entry: handlers.main:sync_study
  side_effects: local_write
  timeout_seconds: 240
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_activity
  description: Read durable stage activity for chat and widget projections.
  entry: handlers.main:get_activity
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      implementation_track_id:
        type:
        - string
        - 'null'
      limit:
        type: integer
        minimum: 1
        maximum: 500
    additionalProperties: true
  output_schema:
    type: object
- name: get_formulation_run
  description: Read exact persisted stage payloads and provider telemetry for one
    formulation run, defaulting to the latest run.
  entry: handlers.main:get_formulation_run
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      run_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: get_compilation
  description: Read the latest digest-bound research compilation facets and traceability.
  entry: handlers.main:get_compilation
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      task_id:
        type:
        - string
        - 'null'
      run_id:
        type:
        - string
        - 'null'
      facet:
        type: string
        enum:
        - source_analysis
        - research_problem
        - experimental_protocol
        - engineering_contract
        - traceability
        default: traceability
    additionalProperties: true
  output_schema:
    type: object
- name: next_steps
  description: Explain workflow-aware next steps in text or voice-compatible form.
  entry: handlers.main:next_steps
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
conversation:
  dialog_channel:
    id: research_orchestrator
    label: Исследователь
    owner: skill:research_orchestrator_skill
    default_tool: research_orchestrator_skill.chat
    route_id: voice_chat
    history:
      store: node
      visible_tail_messages: 80
    retrieval:
      max_messages: 16
      max_segments: 4
      max_memory_items: 2
      max_tokens: 2400
    response:
      default_targets:
      - text_tail
      - speech_text
      renderer: dialog.visible_tail
  history:
    store: node
    owner: skill:research_orchestrator_skill
    retention_class: normal
  retrieval:
    strategy: recent_plus_segments
    cross_owner_memory: deny_by_default
  memory:
    scopes:
    - conversation
    - skill_user
    consent: required_for_reusable_memory
    default_visibility: owner
  response:
    default_targets:
    - text_tail
    - speech_text
    structured_envelope: true
  agents:
  - id: agent:research_orchestrator_skill:researcher
    label: Исследователь
    owner: skill:research_orchestrator_skill
    kind: skill_agent
    channel_id: research_orchestrator
    skill: research_orchestrator_skill
    talk_tool: chat
    gender: neutral
    voice: default
    icon: flask-outline
    aliases:
    - Исследователь
    - aResearcher
    - research orchestrator
data_routes:
- surface: widget:research-focus
  route: tool/details
  tool: resolve_focus
  owner: skill:research_orchestrator_skill
  first_paint: portfolio focus or paired Builder selection
  recovery: choose a direction from the portfolio
  guard_visibility: Project identity only
  budget:
    max_payload_bytes: 65536
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
