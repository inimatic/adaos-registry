name: research_orchestrator_skill
version: 0.0.1
description: Durable pre-Codex orchestration for reusable AdaOS research-direction
  skill projects.
supported_locales:
- en
- ru
entry: handlers/main.py
default_tool: chat
runtime:
  python: '3.11'
capabilities:
- storage.relational
- builder.project_sources
dependencies: []
events:
  subscribe: []
  publish:
  - io.out.chat.append
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
exports:
  tools:
  - ensure_schema
  - rehydrate
  - initialize_direction
  - attach_source
  - sync_source_bundle
  - get_direction
  - record_prototype
  - chat
  - accept_prototype
  - get_automation_brief
  - get_activity
  - next_steps
tools:
- name: ensure_schema
  description: Apply checksum-pinned orchestrator migrations.
  entry: handlers.main:ensure_schema
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: rehydrate
  description: Re-open durable orchestration state after activation.
  entry: handlers.main:rehydrate
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: initialize_direction
  description: Bind a research-direction session to one Builder skill project.
  entry: handlers.main:initialize_direction
  input_schema:
    type: object
    required:
    - direction_id
    - title
    properties:
      direction_id:
        type: string
      title:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: attach_source
  description: Adopt a local upload or file into the immutable Builder SourceBundle.
  entry: handlers.main:attach_source
  input_schema:
    type: object
    required:
    - direction_id
    - path
    properties:
      direction_id:
        type: string
      path:
        type: string
      name:
        type:
        - string
        - 'null'
      role:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_direction
  description: Return the canonical pre-Codex state and current SourceBundle.
  entry: handlers.main:get_direction
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: sync_source_bundle
  description: Reconcile direct Builder project uploads into durable orchestration
    state.
  entry: handlers.main:sync_source_bundle
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: record_prototype
  description: Record one schema-valid ResearchPrototype candidate revision.
  entry: handlers.main:record_prototype
  input_schema:
    type: object
    required:
    - direction_id
    - prototype
    properties:
      direction_id:
        type: string
      prototype:
        type: object
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: chat
  description: Discuss a research direction with the configured Root LLM and materialize
    a ResearchPrototype revision.
  entry: handlers.main:chat
  timeout_seconds: 300
  input_schema:
    type: object
    required:
    - direction_id
    - text
    properties:
      direction_id:
        type: string
      text:
        type: string
      model:
        type:
        - string
        - 'null'
      webspace_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: accept_prototype
  description: Accept an exact candidate digest and emit a digest-bound pre-Codex
    AutomationBrief.
  entry: handlers.main:accept_prototype
  input_schema:
    type: object
    required:
    - direction_id
    - prototype_digest
    - expected_generation
    - idempotency_key
    properties:
      direction_id:
        type: string
      prototype_digest:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_automation_brief
  description: Read the accepted immutable AutomationBrief.
  entry: handlers.main:get_automation_brief
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_activity
  description: Read durable stage activity for chat and widget projections.
  entry: handlers.main:get_activity
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 500
    additionalProperties: true
  output_schema:
    type: object
- name: next_steps
  description: Explain workflow-aware next steps in text or voice-compatible form.
  entry: handlers.main:next_steps
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
conversation:
  dialog_channel:
    id: research_orchestrator
    label: Исследователь
    owner: skill:research_orchestrator_skill
    default_tool: research_orchestrator_skill.chat
    route_id: voice_chat
    history:
      store: node
      visible_tail_messages: 80
    retrieval:
      max_messages: 16
      max_segments: 4
      max_memory_items: 2
      max_tokens: 2400
    response:
      default_targets:
      - text_tail
      - speech_text
      renderer: dialog.visible_tail
  history:
    store: node
    owner: skill:research_orchestrator_skill
    retention_class: normal
  retrieval:
    strategy: recent_plus_segments
    cross_owner_memory: deny_by_default
  memory:
    scopes:
    - conversation
    - skill_user
    consent: required_for_reusable_memory
    default_visibility: owner
  response:
    default_targets:
    - text_tail
    - speech_text
    structured_envelope: true
  agents:
  - id: agent:research_orchestrator_skill:researcher
    label: Исследователь
    owner: skill:research_orchestrator_skill
    kind: skill_agent
    channel_id: research_orchestrator
    skill: research_orchestrator_skill
    talk_tool: chat
    gender: neutral
    voice: default
    icon: flask-outline
    aliases:
    - Исследователь
    - aResearcher
    - research orchestrator
data_routes:
- surface: widget:research-state
  route: tool/details
  tool: get_direction
  owner: skill:research_orchestrator_skill
  first_paint: not initialized
  recovery: repeat get_direction after targeted invalidation
  guard_visibility: typed direction projection; SourceBundle payload bytes are excluded
  budget:
    max_payload_bytes: 1048576
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - research.formulation
- surface: widget:research-activity
  route: tool/details
  tool: get_activity
  owner: skill:research_orchestrator_skill
  first_paint: empty durable activity journal
  recovery: repeat get_activity after targeted invalidation
  guard_visibility: bounded direction activity; no raw prompts or source bytes
  budget:
    max_payload_bytes: 262144
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - research.activity
    - research.formulation
- surface: widget:research-automation-brief
  route: tool/details
  tool: get_automation_brief
  owner: skill:research_orchestrator_skill
  first_paint: Automation Brief not created
  recovery: repeat get_automation_brief after acceptance invalidation
  guard_visibility: accepted digest-bound brief without source payload bytes
  budget:
    max_payload_bytes: 1048576
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - research.automation_brief
- surface: research formulation ledger
  route: skill-local
  path: data/db/research_orchestrator.sqlite3
  owner: skill:research_orchestrator_skill
  first_paint: empty direction list
  recovery: rehydrate from relational migrations and immutable Builder SourceBundle
    refs
  guard_visibility: other skills receive typed projections only
  budget:
    max_payload_bytes: 1048576
llm_hints:
  description: Formulates one skill-owned research direction before Builder Automation/Codex.
  aliases:
  - aResearcher
  - research orchestrator
  - исследователь
  primary_actions:
  - id: research_orchestrator_skill.chat
    intent: research_orchestrator_skill.chat
    tool: chat
    side_effect_class: local_write
    examples:
    - Обсуди постановку исследования
    - Уточни гипотезы и план эксперимента
  - id: research_orchestrator_skill.next_steps
    intent: research_orchestrator_skill.next_steps
    tool: next_steps
    side_effect_class: read_only
    examples:
    - Что делать дальше?
  examples: []
  owner_hints:
  - skill:research_orchestrator_skill
nlu_hints:
  aliases:
  - Исследователь
  - aResearcher
  examples: []
  slot_schemas: {}
  entities: []
updated_at: '2026-08-10T14:43:09+00:00'
