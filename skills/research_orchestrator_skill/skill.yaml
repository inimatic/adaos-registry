name: research_orchestrator_skill
version: 0.16.0
description: Durable pre-Codex orchestration for reusable AdaOS research-direction
  skill projects.
supported_locales:
- en
- ru
entry: handlers/main.py
default_tool: chat
runtime:
  python: '3.11'
data_migration:
  file: migrations/data_migration.py
  source_policy: previous_runtime_bucket
  retention: retain_until_previous_runtime_retired
capabilities:
- storage.relational
- builder.project_sources
dependencies: []
events:
  subscribe: []
  publish:
  - io.out.chat.append
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
exports:
  tools:
  - ensure_schema
  - rehydrate
  - list_directions
  - resolve_focus
  - create_direction
  - initialize_direction
  - attach_source
  - set_source_visibility
  - sync_source_bundle
  - get_direction
  - list_artifacts
  - preview_artifact
  - get_consensus
  - record_prototype
  - chat
  - accept_prototype
  - get_automation_brief
  - open_builder_session
  - get_activity
  - get_formulation_run
  - get_compilation
  - next_steps
tools:
- name: ensure_schema
  description: Apply checksum-pinned orchestrator migrations.
  entry: handlers.main:ensure_schema
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: rehydrate
  description: Re-open durable orchestration state after activation.
  entry: handlers.main:rehydrate
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
- name: list_directions
  description: List local adaos.research.direction.v1 Projects and formulation status.
  entry: handlers.main:list_directions
  side_effects: none
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 5000
    additionalProperties: true
  output_schema:
    type: object
- name: resolve_focus
  description: Resolve a research direction from the selection of a paired Builder
    host.
  entry: handlers.main:resolve_focus
  side_effects: none
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: create_direction
  description: Atomically create a research Project and its primary direction skill.
  entry: handlers.main:create_direction
  side_effects: local_write
  input_schema:
    type: object
    required:
    - project_id
    - title
    properties:
      project_id:
        type: string
      title:
        type: string
      description:
        type: string
      skill_id:
        type:
        - string
        - 'null'
      tags:
        type: array
        items:
          type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: initialize_direction
  description: Bind a research-direction session to one Builder skill project.
  entry: handlers.main:initialize_direction
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - title
    properties:
      direction_id:
        type: string
      title:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: attach_source
  description: Copy a local upload into a manifested artifact group owned by the direction
    skill.
  entry: handlers.main:attach_source
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - path
    properties:
      direction_id:
        type: string
      path:
        type: string
      group_id:
        type: string
        default: part0
      name:
        type:
        - string
        - 'null'
      role:
        type: string
      visibility_profile:
        type: string
        enum:
        - shared
        - evaluation_only
        - formulation_only
        - implementation_input
        default: shared
      cleanup_staging:
        type: boolean
        default: false
      replace_existing:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: set_source_visibility
  description: Apply a research-stage visibility profile to one manifested artifact.
  entry: handlers.main:set_source_visibility
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - group_id
    - artifact_id
    - visibility_profile
    properties:
      direction_id:
        type: string
      group_id:
        type: string
      artifact_id:
        type: string
      visibility_profile:
        type: string
        enum:
        - shared
        - evaluation_only
        - formulation_only
        - implementation_input
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_direction
  description: Return the canonical pre-Codex state and current SourceBundle.
  entry: handlers.main:get_direction
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: sync_source_bundle
  description: Reconcile direct Builder project uploads into durable orchestration
    state.
  entry: handlers.main:sync_source_bundle
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: list_artifacts
  description: List exact manifested artifact items owned by a direction skill.
  entry: handlers.main:list_artifacts
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: preview_artifact
  description: Preview one exact manifested Markdown, text, or PDF source artifact.
  entry: handlers.main:preview_artifact
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    - group_id
    - artifact_id
    properties:
      direction_id:
        type: string
      group_id:
        type: string
      artifact_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_consensus
  description: Read a compact human-readable projection of the evolving ResearchPrototype
    or accepted AutomationBrief.
  entry: handlers.main:get_consensus
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: record_prototype
  description: Record one typed ResearchPrototype draft with core-owned source coverage
    and deterministic admission review.
  entry: handlers.main:record_prototype
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    - prototype
    properties:
      direction_id:
        type: string
      prototype:
        type: object
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: chat
  description: Discuss a research direction with the configured Root LLM and materialize
    a provenance-grounded ResearchPrototype revision through bounded schema and semantic
    repair.
  entry: handlers.main:chat
  side_effects: local_write
  timeout_seconds: 1800
  input_schema:
    type: object
    required:
    - direction_id
    - text
    properties:
      direction_id:
        type: string
      text:
        type: string
      model:
        type:
        - string
        - 'null'
      actor:
        description: Stable caller identity recorded in the durable directive trace.
        type:
        - string
        - 'null'
      invocation_origin:
        description: Conversation, API, CLI, Codex, or another caller channel used
          to decide whether the directive must also be projected into chat.
        type:
        - string
        - 'null'
      webspace_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: accept_prototype
  description: Accept an exact candidate digest and emit a digest-bound pre-Codex
    AutomationBrief.
  entry: handlers.main:accept_prototype
  side_effects: external_write
  input_schema:
    type: object
    required:
    - direction_id
    - prototype_digest
    - expected_generation
    - idempotency_key
    properties:
      direction_id:
        type: string
      prototype_digest:
        type: string
      expected_generation:
        type: integer
      idempotency_key:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: get_automation_brief
  description: Read the accepted immutable AutomationBrief.
  entry: handlers.main:get_automation_brief
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: open_builder_session
  description: Bind the exact Development Session and return a canonical Builder link.
  entry: handlers.main:open_builder_session
  side_effects: local_write
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      builder_webspace_id:
        type: string
        default: desktop-dev
      base_url:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: get_activity
  description: Read durable stage activity for chat and widget projections.
  entry: handlers.main:get_activity
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 500
    additionalProperties: true
  output_schema:
    type: object
- name: get_formulation_run
  description: Read exact persisted stage payloads and provider telemetry for one
    formulation run, defaulting to the latest run.
  entry: handlers.main:get_formulation_run
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      run_id:
        type:
        - string
        - 'null'
    additionalProperties: true
  output_schema:
    type: object
- name: get_compilation
  description: Read the latest digest-bound research compilation facets and traceability.
  entry: handlers.main:get_compilation
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
      run_id:
        type:
        - string
        - 'null'
      facet:
        type: string
        enum:
        - source_analysis
        - research_problem
        - experimental_protocol
        - engineering_contract
        - traceability
        default: traceability
    additionalProperties: true
  output_schema:
    type: object
- name: next_steps
  description: Explain workflow-aware next steps in text or voice-compatible form.
  entry: handlers.main:next_steps
  side_effects: none
  input_schema:
    type: object
    required:
    - direction_id
    properties:
      direction_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
conversation:
  dialog_channel:
    id: research_orchestrator
    label: Исследователь
    owner: skill:research_orchestrator_skill
    default_tool: research_orchestrator_skill.chat
    route_id: voice_chat
    history:
      store: node
      visible_tail_messages: 80
    retrieval:
      max_messages: 16
      max_segments: 4
      max_memory_items: 2
      max_tokens: 2400
    response:
      default_targets:
      - text_tail
      - speech_text
      renderer: dialog.visible_tail
  history:
    store: node
    owner: skill:research_orchestrator_skill
    retention_class: normal
  retrieval:
    strategy: recent_plus_segments
    cross_owner_memory: deny_by_default
  memory:
    scopes:
    - conversation
    - skill_user
    consent: required_for_reusable_memory
    default_visibility: owner
  response:
    default_targets:
    - text_tail
    - speech_text
    structured_envelope: true
  agents:
  - id: agent:research_orchestrator_skill:researcher
    label: Исследователь
    owner: skill:research_orchestrator_skill
    kind: skill_agent
    channel_id: research_orchestrator
    skill: research_orchestrator_skill
    talk_tool: chat
    gender: neutral
    voice: default
    icon: flask-outline
    aliases:
    - Исследователь
    - aResearcher
    - research orchestrator
data_routes:
- surface: widget:research-focus
  route: tool/details
  tool: resolve_focus
  owner: skill:research_orchestrator_skill
  first_paint: portfolio focus or paired Builder selection
  recovery: choose a direction from the portfolio
  guard_visibility: Project identity only
  budget:
    max_payload_bytes: 65536
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - research.portfolio
    - builder.project.preview
- surface: widget:directions
  route: tool/details
  tool: list_directions
  owner: skill:research_orchestrator_skill
  first_paint: empty local research Project portfolio
  recovery: repeat list_directions after targeted invalidation
  guard_visibility: Project catalog metadata and formulation status only
  budget:
    max_payload_bytes: 1048576
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - research.portfolio
    - research.formulation
- surface: widget:artifact-list
  route: tool/details
  tool: list_artifacts
  owner: skill:research_orchestrator_skill
  first_paint: empty manifested artifact group
  recovery: repeat list_artifacts after targeted invalidation
  guard_visibility: artifact metadata and digests; payload bytes excluded
  budget:
    max_payload_bytes: 1048576
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - research.artifacts
    - research.formulation
- surface: modal:research-artifact-preview
  route: tool/details
  tool: preview_artifact
  owner: skill:research_orchestrator_skill
  first_paint: artifact preview not selected
  recovery: select a manifested artifact again
  guard_visibility: one bounded text payload or an authenticated manifest-admitted
    PDF content path
  budget:
    max_payload_bytes: 1048576
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: false
    invalidation_tags:
    - research.artifacts
- surface: widget:research-state
  route: tool/details
  tool: get_direction
  owner: skill:research_orchestrator_skill
  first_paint: not initialized
  recovery: repeat get_direction after targeted invalidation
  guard_visibility: typed direction projection; SourceBundle payload bytes are excluded
  budget:
    max_payload_bytes: 1048576
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - research.formulation
    - research.activity
    - research.automation_brief
- surface: widget:research-consensus
  route: tool/details
  tool: get_consensus
  owner: skill:research_orchestrator_skill
  first_paint: research consensus not formulated
  recovery: continue the discussion or refresh after a ResearchPrototype revision
  guard_visibility: compact structured formulation; source bytes excluded
  budget:
    max_payload_bytes: 262144
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - research.formulation
    - research.automation_brief
- surface: widget:research-activity
  route: tool/details
  tool: get_activity
  owner: skill:research_orchestrator_skill
  first_paint: empty durable activity journal
  recovery: repeat get_activity after targeted invalidation
  guard_visibility: bounded direction activity; no raw prompts or source bytes
  budget:
    max_payload_bytes: 262144
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - research.activity
    - research.formulation
- surface: widget:research-automation-brief
  route: tool/details
  tool: get_automation_brief
  owner: skill:research_orchestrator_skill
  first_paint: Automation Brief not created
  recovery: repeat get_automation_brief after acceptance invalidation
  guard_visibility: accepted digest-bound brief without source payload bytes
  budget:
    max_payload_bytes: 1048576
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - research.automation_brief
- surface: widget:research-compilation
  route: tool/details
  tool: get_compilation
  owner: skill:research_orchestrator_skill
  first_paint: research compilation not produced
  recovery: continue formulation or refresh after a compilation invalidation
  guard_visibility: digest-bound facets and traceability; extracted source payload
    bytes excluded
  budget:
    max_payload_bytes: 2097152
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - research.formulation
    - research.compilation
- surface: research formulation ledger
  route: skill-local
  path: data/db/research_orchestrator.sqlite3
  owner: skill:research_orchestrator_skill
  first_paint: empty direction list
  recovery: rehydrate from relational migrations and immutable Builder SourceBundle
    refs
  guard_visibility: other skills receive typed projections only
  budget:
    max_payload_bytes: 1048576
llm_hints:
  description: Formulates one skill-owned research direction before Builder Automation/Codex.
  aliases:
  - aResearcher
  - research orchestrator
  - исследователь
  primary_actions:
  - id: research_orchestrator_skill.chat
    intent: research_orchestrator_skill.chat
    tool: chat
    side_effect_class: local_write
    examples:
    - Обсуди постановку исследования
    - Уточни гипотезы и план эксперимента
  - id: research_orchestrator_skill.next_steps
    intent: research_orchestrator_skill.next_steps
    tool: next_steps
    side_effect_class: read_only
    examples:
    - Что делать дальше?
  examples: []
  owner_hints:
  - skill:research_orchestrator_skill
nlu_hints:
  aliases:
  - Исследователь
  - aResearcher
  examples: []
  slot_schemas: {}
  entities: []
updated_at: '2026-08-17T22:33:26+00:00'
compatibility:
  adaos_core:
    min_version: 0.1.854+5184.e047d821
    recorded_at: '2026-08-17T22:33:26+00:00'
    source: skill_push
    min_commit: e047d821636b576bc6be2ae047abd3607a8cf8e7
