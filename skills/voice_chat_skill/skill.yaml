name: voice_chat_skill
version: 0.6.17
description: Voice chat bridge for web_desktop (text in -> materialize replies through
  the node conversation ledger; shared chat history is exposed as a bounded compatibility
  stream, with YJS kept as a compact status projection).
runtime:
  python: '3.11'
events:
  subscribe:
  - desktop.modal.open
  - voice.chat.time_now
  - voice.chat.timer_start
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
  publish:
  - desktop.modal.open
  - io.out.chat.append
  - io.out.say
  - io.out.stream.publish
data_routes:
- surface: scenario:web_desktop.voice_chat.status
  route: yjs
  owner: skill:voice_chat_skill
  projection_slot: voice_chat.state
  path: data/voice_chat
  first_paint: compact voice chat status from the last YJS projection
  recovery: YJS replay restores only status/count/last-message metadata; stream receiver
    owns the visible chat tail.
  update_source:
  - voice_chat_skill.handle_text
  budget:
    max_payload_bytes: 4096
    max_publish_hz: 2
    coalesce_ms: 250
    snapshot_policy: none
  guard_visibility:
    degraded_state: Chat input stays available and the UI keeps the last compact status.
    log: service.voice_chat_skill.runtime.log
    quarantine: true
    metric: yjs_owner_guard.voice_chat.state
- surface: scenario:web_desktop.voice_chat.messages
  route: stream
  owner: skill:voice_chat_skill
  receiver: voice_chat.messages
  first_paint: empty chat list until a stream snapshot is requested
  recovery: Stream snapshot request republishes a small bounded ledger tail, with
    skill-local memory used only as a compatibility fallback.
  update_source:
  - webio.stream.snapshot.requested
  - voice_chat_skill.handle_text
  budget:
    max_payload_bytes: 16384
    max_fanout: 3
    max_publish_hz: 8
    coalesce_ms: 100
    max_items: 8
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Chat list keeps the last local stream state; YJS only shows compact
      status.
    log: service.voice_chat_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.voice_chat.messages
data_projections:
- scope: subnet
  slot: voice_chat.state
  targets:
  - backend: yjs
    path: data/voice_chat
memory_budget:
  expected_rss_mb: 64
  caches:
  - name: voice_chat.state_by_key
    route: skill-local
    max_items: 32
    ttl_seconds: 3600
    cleanup_hook: voice_chat_runtime_dispose
  - name: voice_chat.projection_fingerprints
    route: process-memory
    max_items: 32
    cleanup_hook: voice_chat_runtime_dispose
  - name: voice_chat.quarantine_incidents
    route: skill-local
    max_items: 16
    cleanup_hook: voice_chat_runtime_dispose
  background_workers:
  - name: voice_chat.timer
    max_threads: 8
    cleanup_hook: voice_chat_runtime_dispose
lifecycle:
  drain: voice_chat_runtime_drain
  dispose: voice_chat_runtime_dispose
  before_deactivate: voice_chat_runtime_before_deactivate
conversation:
  dialog_channel:
    id: general
    label: General
    owner: core:general_assistant
    default_tool: voice_chat_skill.handle_text
    route_id: voice_chat
    history:
      store: node
      visible_tail_messages: 8
    retrieval:
      max_messages: 12
      max_segments: 2
      max_memory_items: 4
      max_tokens: 1200
    response:
      default_targets:
      - text_tail
      - speech_text
      renderer: dialog.visible_tail
  history:
    store: node
    owner: core:general_assistant
    retention_class: normal
  retrieval:
    strategy: recent_plus_segments_plus_memory
    cross_owner_memory: deny_by_default
  response:
    default_targets:
    - text_tail
    - speech_text
    structured_envelope: true
default_tool: handle_text
tools:
- name: handle_text
  description: Convert voice text into supported desktop/time/timer/weather actions
    and materialize chat through the conversation ledger plus TTS outputs (no direct
    Yjs writes).
  entry: handlers.main:handle_text
  input_schema:
    type: object
    properties:
      text:
        type: string
        minLength: 1
      _meta:
        type: object
- name: get_snapshot
  description: Publish the bounded voice chat stream snapshot for the selected node/webspace
    and return a compact acknowledgement.
  entry: handlers.main:get_snapshot
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: voice_chat_healthcheck
  description: Return compact Voice runtime counters without publishing state.
  entry: handlers.main:voice_chat_healthcheck
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: voice_chat_runtime_drain
  description: Stop Voice background timers before runtime drain.
  entry: handlers.main:voice_chat_runtime_drain
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: voice_chat_runtime_dispose
  description: Release Voice timers and bounded in-memory caches.
  entry: handlers.main:voice_chat_runtime_dispose
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: voice_chat_runtime_before_deactivate
  description: Release Voice timers and bounded in-memory caches before deactivation.
  entry: handlers.main:voice_chat_runtime_before_deactivate
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: on_quarantine
  description: Record compact Voice quarantine evidence and stop background timers.
  entry: handlers.main:on_quarantine
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
