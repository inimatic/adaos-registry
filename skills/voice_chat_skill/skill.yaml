name: voice_chat_skill
version: 0.6.9
description: Voice chat bridge for web_desktop (text in -> publish chat + TTS via
  io.out.*; shared chat history goes through YJS, with stream receiver kept as a recovery/compatibility
  path).
runtime:
  python: '3.11'
events:
  subscribe:
  - desktop.modal.open
  - voice.chat.time_now
  - voice.chat.timer_start
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
  publish:
  - desktop.modal.open
  - io.out.chat.append
  - io.out.say
  - io.out.stream.publish
data_routes:
- surface: scenario:web_desktop.voice_chat.status
  route: yjs
  owner: skill:voice_chat_skill
  projection_slot: voice_chat.state
  path: data/voice_chat
  first_paint: shared voice chat history from the last YJS projection
  recovery: YJS replay restores the bounded chat tail; stream receiver remains a compatibility
    snapshot path.
  update_source:
  - voice_chat_skill.handle_text
  budget:
    max_payload_bytes: 4096
    max_publish_hz: 2
    coalesce_ms: 250
    snapshot_policy: none
  guard_visibility:
    degraded_state: Chat input stays available and the UI keeps the last compact status.
    log: service.voice_chat_skill.runtime.log
    quarantine: true
    metric: yjs_owner_guard.voice_chat.state
- surface: scenario:web_desktop.voice_chat.messages
  route: stream
  owner: skill:voice_chat_skill
  receiver: voice_chat.messages
  first_paint: empty chat list until a stream snapshot is requested
  recovery: Stream snapshot request republishes the bounded in-memory tail or migrates
    the old YJS tail.
  update_source:
  - webio.stream.snapshot.requested
  - voice_chat_skill.handle_text
  budget:
    max_payload_bytes: 32768
    max_publish_hz: 8
    coalesce_ms: 100
    max_items: 80
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Chat list keeps the last local stream state; YJS only shows compact
      status.
    log: service.voice_chat_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.voice_chat.messages
data_projections:
- scope: subnet
  slot: voice_chat.state
  targets:
  - backend: yjs
    path: data/voice_chat
default_tool: handle_text
tools:
- name: handle_text
  description: Convert voice text into supported desktop/time/timer/weather actions
    and publish chat + tts outputs (no direct Yjs writes).
  entry: handlers.main:handle_text
  input_schema:
    type: object
    properties:
      text:
        type: string
        minLength: 1
      _meta:
        type: object
- name: get_snapshot
  description: Return the current voice chat history snapshot for the selected node/webspace.
  entry: handlers.main:get_snapshot
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
updated_at: '2026-06-03T15:49:16+00:00'

