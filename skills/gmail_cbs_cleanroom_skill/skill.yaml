name: gmail_cbs_cleanroom_skill
version: 0.1.7
supported_locales:
- en
- ru
entry:
  script: handlers/main.py
runtime:
  python: '3.11'
  activation:
    mode: on_demand
    startup_allowed: false
    background_refresh: false
    assessment:
      schema: adaos.skill.activation_assessment.v1
      assessor: builder.compiler
      classification: tool_only
      handler_digest: sha256:94266adc9331d217cd82a598acceec9ec7d8596d51ee176000beef5664f96074
      observed_subscriptions: []
      declared_subscriptions: []
      dynamic_subscription_count: 0
      tool_count: 18
      reasons:
      - tool_invocation_can_import_handler_on_demand
description: Reusable governed Gmail binding tools. Mail content is transient.
default_tool: connection_status
dependencies: []
capabilities:
- providers.google.gmail
- workspace.read
- workspace.write
- storage.relational
exports:
  tools:
  - connection_status
  - begin_connection
  - reusable_connections
  - attach_reusable_connection
  - list_labels
  - list_messages
  - get_message
  - mutate_message
  - prepare_send
  - send_message
  - portable_connection_status
  - portable_begin_connection
  - portable_list_messages
  - portable_get_message
  - portable_list_labels
  - portable_mutate_message
  - portable_prepare_send
  - portable_send_message
