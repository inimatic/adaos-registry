- surface: gmail.connection_status
  route: tool
  tool: connection_status
  first_paint: empty until the authorized read completes
  recovery: explicit retry; preserve the last successful value
  guard_visibility: show the read error without reporting success
  budget:
    max_payload_bytes: 262144
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    - state_dependency_changed
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - gmail.account
