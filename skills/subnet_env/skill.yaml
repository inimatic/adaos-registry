name: subnet_env
version: 0.8.12
description: Local subnet environment operator skill for safe SDK-first web_desktop
  workflows.
runtime:
  python: '3.11'
  activation:
    mode: lazy
    startup_allowed: false
    background_refresh: false
    when:
      client_presence: true
      webspace_scope: active
entry: handlers/main.py
dependencies: []
events:
  subscribe:
  - webio.yjs.snapshot.requested
  - webio.yjs.subscription.changed
data_projections:
- scope: subnet
  slot: subnet_env.snapshot
  targets:
  - backend: yjs
    path: data/subnet_env
data_routes:
- surface: app:subnet_env
  route: yjs
  owner: skill:subnet_env
  path: data/subnet_env
  projection_slot: subnet_env.snapshot
  first_paint: Last reconnect-stable environment snapshot or an explicit loading state.
  recovery: Browser Yjs demand rebuilds and projects one coalesced bounded snapshot.
  update_source:
  - webio.yjs.snapshot.requested
  - webio.yjs.subscription.changed
  - refresh_snapshot
  - set_env_value
  - apply_action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1.0
    coalesce_ms: 1000
    max_fanout: 16
    max_items: 256
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Subnet Environment shows stale or unavailable projection state.
    log: service.subnet_env.runtime.log
    quarantine: true
default_tool: get_snapshot
tools:
- name: get_snapshot
  description: Return the current local subnet environment snapshot.
  entry: handlers.main:get_snapshot
  side_effects: read
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
- name: refresh_snapshot
  description: Refresh and project the subnet environment snapshot.
  entry: handlers.main:refresh_snapshot
  side_effects: runtime_write
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
- name: set_env_value
  description: Update one allowlisted environment key and refresh the projection.
  entry: handlers.main:set_env_value
  side_effects: local_write
  input_schema:
    type: object
    properties:
      key:
        type: string
      value:
        type:
        - string
        - number
        - boolean
        - 'null'
      webspace_id:
        type: string
    required:
    - key
  output_schema:
    type: object
- name: apply_action
  description: Apply a predefined subnet_env UI action and refresh the projection.
  entry: handlers.main:apply_action
  side_effects: local_write
  input_schema:
    type: object
    properties:
      action_id:
        type: string
      webspace_id:
        type: string
    required:
    - action_id
  output_schema:
    type: object
exports: {}
updated_at: '2026-08-18T09:00:00+00:00'
compatibility:
