name: media_indexer_skill
version: 0.1.20
description: Semantic indexing and multimodal search for local media files (video,
  audio, images) using NER, FAISS and CLIP.
runtime:
  kind: service
  in_process_events: true
  python: '3.11'
  env:
    mode: venv
    python: '3.11'
dependencies:
- shazamio
events:
  subscribe:
  - media_indexer.action
  - webio.stream.snapshot.requested
  publish: []
data_projections:
- scope: subnet
  slot: media_indexer.snapshot
  targets:
  - backend: yjs
    path: data/media_indexer
data_routes:
- surface: modal:media_indexer.summary
  route: yjs
  projection_slot: media_indexer.snapshot
  path: data/media_indexer/status
  first_paint: compact ready state from webui defaults or last projected snapshot
  recovery: Yjs replay restores latest compact status and form values
  update_source:
  - media_indexer.action
  budget:
    max_payload_bytes: 8192
    max_publish_hz: 0.5
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: status tile shows stale or error state
    log: skill:media_indexer_skill.runtime
    quarantine: true
- surface: modal:media_indexer.results
  route: yjs
  projection_slot: media_indexer.snapshot
  path: data/media_indexer/results
  first_paint: empty bounded result list
  recovery: latest bounded search result list is restored from Yjs
  update_source:
  - media_indexer.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 0.2
    max_items: 20
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: result list remains at last successful search
    log: skill:media_indexer_skill.runtime
    quarantine: true
- surface: modal:media_indexer.operation_stream
  route: stream
  receiver: media_indexer.operations
  first_paint: browser initial state until first operation event arrives
  recovery: skill republishes latest bounded operation snapshot on stream subscribe
  update_source:
  - media_indexer.action
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 4096
    max_publish_hz: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: live operation tile falls back to Yjs status
    log: skill:media_indexer_skill.runtime
    quarantine: false
memory_budget:
  expected_rss_mb: 4096
  caches:
  - name: vector_index
    route: skill-local
    max_items: 50000
    cleanup_hook: dispose
  - name: model_cache
    route: disk
    max_items: 4
    cleanup_hook: dispose
  background_workers:
    max_threads: 1
    cleanup_hook: dispose
lifecycle:
  rehydrate: rehydrate
  dispose: dispose
service:
  host: 127.0.0.1
  port: 18105
  command:
  - -m
  - handlers.main
  healthcheck:
    path: /health
    timeout_ms: 1000
default_tool: search_media
tools:
- name: scan_and_index
  entry: handlers.main:scan_and_index
  description: Scan a directory and build a search index
  input_schema:
    type: object
    required:
    - directory
    properties:
      directory:
        type: string
        description: Path to a directory with media files.
  output_schema:
    type: object
    required:
    - status
    - indexed_count
    properties:
      status:
        type: string
        enum:
        - ok
        - error
      indexed_count:
        type: integer
      errors:
        type: array
        items:
          type: string
- name: search_media
  entry: handlers.main:search_media
  description: Search indexed media by natural language query
  input_schema:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        description: Natural language search query.
      k:
        type: integer
        default: 5
        description: Number of results to return.
  output_schema:
    type: object
    required:
    - status
    - results
    properties:
      status:
        type: string
      results:
        type: array
        items:
          type: object
          properties:
            score:
              type: number
            path:
              type: string
            payload:
              type: object
- name: play_media
  entry: handlers.main:play_media
  description: Prepare an indexed media item for browser preview
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
        description: Indexed media file path.
  output_schema:
    type: object
    required:
    - status
    properties:
      status:
        type: string
      playback:
        type: object
- name: get_settings
  entry: handlers.main:get_settings
  description: Return persisted media indexer settings and index metadata
  input_schema:
    type: object
    properties: {}
  output_schema:
    type: object
    required:
    - status
    - settings
    properties:
      status:
        type: string
      settings:
        type: object
- name: rehydrate
  entry: handlers.main:rehydrate
  description: Rehydrate lightweight persisted state without loading ML models
  input_schema:
    type: object
    properties: {}
  output_schema:
    type: object
    properties:
      status:
        type: string
- name: dispose
  entry: handlers.main:dispose
  description: Release in-memory ML models and indexes
  input_schema:
    type: object
    properties: {}
  output_schema:
    type: object
    properties:
      status:
        type: string
