name: notebook_skill
version: 0.1.29
description: Shared plain-text notebook with one active editable note, a live note
  list stream, and Telegram export.
runtime:
  python: '3.11'
webui_owner: shared
events:
  subscribe:
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
data_projections:
- scope: subnet
  slot: notebook.snapshot
  targets:
  - backend: yjs
    webspace_id: desktop
    path: data/desktop/notebook
data_routes:
- surface: modal:notebook_modal
  route: stream
  receiver: notebook_skill.notes
  path: editor
  first_paint: selected note from stream snapshot
  recovery: skill republishes durable state on stream subscribe
  update_source:
  - notebook_skill.action
  budget:
    max_payload_bytes: 32768
    max_publish_hz: 2
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: editor keeps the last stream snapshot
    log: skill:notebook_skill.runtime
    quarantine: false
- surface: modal:notebook_modal
  route: stream
  receiver: notebook_skill.notes
  first_paint: initial note list from receiver initial state
  recovery: skill republishes the in-memory note list on stream subscribe
  update_source:
  - notebook_skill.action
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 32768
    max_publish_hz: 2
    max_items: 64
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: note list keeps the last stream snapshot
    log: skill:notebook_skill.runtime
    quarantine: false
- surface: desktop.widget:notebook_skill_last_note
  route: stream
  receiver: notebook_skill.notes
  path: widget
  first_paint: last note from stream snapshot
  recovery: skill republishes durable state on stream subscribe
  update_source:
  - notebook_skill.action
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 32768
    max_publish_hz: 2
    max_items: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: last note widget keeps the last stream snapshot
    log: skill:notebook_skill.runtime
    quarantine: false
memory_budget:
  expected_rss_mb: 64
  caches:
  - name: notebook.notes
    storage: skill_memory
    max_items: 64
    cleanup_hook: reset_notebook
lifecycle:
  persist_before_switch: notebook_persist_state
  rehydrate: notebook_rehydrate
tools:
- name: get_notebook_snapshot
  entry: handlers.main:get_notebook_snapshot
  description: Return the current in-memory notebook snapshot and publish it to Yjs
    and stream outputs.
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - snapshot
    properties:
      ok:
        type: boolean
      snapshot:
        type: object
- name: create_note
  entry: handlers.main:create_note
  description: Create a plain-text note and select it for editing.
  input_schema:
    type: object
    properties:
      content:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - note
    properties:
      ok:
        type: boolean
      note:
        type: object
- name: select_note
  entry: handlers.main:select_note
  description: Select one note as the active editor note.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      id:
        type: string
      edit:
        type: boolean
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      note:
        type: object
- name: save_note
  entry: handlers.main:save_note
  description: Save the active note content and publish updated Yjs/stream state.
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      content:
        type: string
      source:
        type: string
      webspace_id:
        type: string
      side_effect_class:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      note:
        type: object
- name: attach_note_file
  entry: handlers.main:attach_note_file
  description: Attach an uploaded photo or file to the selected note.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      kind:
        type: string
      artifact_ref:
        type: object
      file:
        type: object
      path:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      attachment:
        type: object
      note:
        type: object
- name: attach_note_upload
  entry: handlers.main:attach_note_upload
  description: Attach uploaded media metadata to the selected note.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      kind:
        type: string
      upload:
        type: object
      webspace_id:
        type: string
      side_effect_class:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      attachment:
        type: object
      note:
        type: object
- name: delete_note
  entry: handlers.main:delete_note
  description: Delete a note from the notebook.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      id:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: send_note_to_telegram
  entry: handlers.main:send_note_to_telegram
  description: Send the selected note text to the configured Telegram outbox.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      chat_id:
        type: string
      bot_id:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      telegram:
        type: object
- name: reset_notebook
  entry: handlers.main:reset_notebook
  description: Reset the notebook state to the default note.
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: notebook_persist_state
  entry: handlers.main:notebook_persist_state
  description: Persist the current notebook state for runtime handoff.
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: notebook_rehydrate
  entry: handlers.main:notebook_rehydrate
  description: Restore notebook state from durable skill memory and republish it.
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
updated_at: '2026-07-02T13:46:16+00:00'
compatibility:
