    min_version: 0.1.0+3430.b48ab7fc
    recorded_at: '2026-07-02T13:46:17+00:00'
    source: skill_push
    min_commit: b48ab7fc16c723b525ae875cbc06b3edaf41ef94
    min_short_commit: b48ab7fc
    build_date: '2026-07-02T14:32:39+03:00'
nlu:
  intents:
    notebook.create_note:
      examples:
      - Напишем заметку
      - Создать заметку
      - Добавить заметку
      actions:
      - type: skillTool
        skill: notebook_skill
        tool: create_note
        target: notebook_skill.create_note
        params: {}

