name: media_center_skill
version: 0.2.0
description: Distributed Media Center coordinator with bounded catalog, collection, personalization, and playback projections.
supported_locales:
- en
- ru
entry: handlers/main.py
default_tool: chat
webui:
  file: webui.json
runtime:
  python: '3.11'
capabilities:
- storage.relational
- media.catalog
- media.playback_planning
- skills.invoke
dependencies: []
events:
  subscribe: []
  publish: []
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
exports:
  tools:
  - ensure_schema
  - rehydrate
  - scan_sources
  - list_roots
  - add_root
  - remove_root
  - delete_root
  - scan_roots
  - import_folder
  - library
  - list_items
  - get_item
  - playback_queue
  - playback_plan
  - set_favorite
  - sync_agent
  - home
  - list_collections
  - duplicate_candidates
  - save_checkpoint
  - queue_background_job
  - operations
  - status
  - next_steps
  - chat
tools:
- name: ensure_schema
  description: Apply the durable media-center catalog schema.
  entry: handlers.main:ensure_schema
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: rehydrate
  description: Re-open durable catalog state after activation.
  entry: handlers.main:rehydrate
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: scan_sources
  description: Reconcile SDK media resources from Media Server and legacy media_indexer into the durable catalog.
  entry: handlers.main:scan_sources
  side_effects: local_write
  input_schema:
    type: object
    properties:
      source:
        type: string
        enum:
        - all
        - media_server
        - media_indexer
        default: all
      limit:
        type: integer
        minimum: 1
        maximum: 5000
        default: 5000
    additionalProperties: true
  output_schema:
    type: object
- name: list_roots
  description: List configured media-center library folders.
  entry: handlers.main:list_roots
  side_effects: none
  input_schema:
    type: object
    properties:
      include_disabled:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: add_root
  description: Add a local folder to the media-center import set.
  entry: handlers.main:add_root
  side_effects: local_write
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      label:
        type: string
      include_images:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: remove_root
  description: Disable a configured media-center library folder.
  entry: handlers.main:remove_root
  side_effects: local_write
  input_schema:
    type: object
    properties:
      root_id:
        type: string
      path:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: delete_root
  description: Delete a configured folder, its catalog rows, and exact core media resource links without deleting source files.
  entry: handlers.main:delete_root
  side_effects: local_write
  input_schema:
    type: object
    properties:
      root_id:
        type: string
      path:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: scan_roots
  description: Register playable files from configured folders without copying media bytes.
  entry: handlers.main:scan_roots
  side_effects: local_write
  timeout_seconds: 600
  input_schema:
    type: object
    properties:
      root_id:
        type: string
      path:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
    additionalProperties: true
  output_schema:
    type: object
- name: import_folder
  description: Add a folder and register its playable files in place.
  entry: handlers.main:import_folder
  side_effects: local_write
  timeout_seconds: 600
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      label:
        type: string
      include_images:
        type: boolean
        default: false
      limit:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
    additionalProperties: true
  output_schema:
    type: object
- name: library
  description: Return a widget-ready catalog projection with items, summary, facets, and playback descriptors.
  entry: handlers.main:library
  side_effects: none
  input_schema:
    type: object
    properties:
      query:
        type: string
      media_kind:
        type: string
        enum:
        - ''
        - playable
        - video
        - audio
        - image
        - other
      source:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
      offset:
        type: integer
        minimum: 0
        default: 0
      cursor:
        type: string
      profile_id:
        type: string
        default: default
      collection_id:
        type: string
      include_missing:
        type: boolean
        default: false
      favorites_only:
        type: boolean
        default: false
      sort:
        type: string
        enum:
        - recent
        - title
        - size
        - source
        - favorite
        default: recent
      auto_scan:
        type: boolean
        default: true
    additionalProperties: true
  output_schema:
    type: object
- name: list_items
  description: Alias for library for generic catalog widgets.
  entry: handlers.main:list_items
  side_effects: none
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: get_item
  description: Read one media-center catalog item.
  entry: handlers.main:get_item
  side_effects: none
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: playback_queue
  description: Return the selected item first and at most ten playable queue entries.
  entry: handlers.main:playback_queue
  side_effects: none
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
      query:
        type: string
      media_kind:
        type: string
        default: playable
      source:
        type: string
      favorites_only:
        type: boolean
        default: false
      sort:
        type: string
        default: recent
      limit:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
    additionalProperties: true
  output_schema:
    type: object
- name: playback_plan
  description: Return a playback plan based on the item's core MediaResource descriptor.
  entry: handlers.main:playback_plan
  side_effects: local_write
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: set_favorite
  description: Mark or unmark one catalog item as favorite.
  entry: handlers.main:set_favorite
  side_effects: local_write
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
      favorite:
        type: boolean
        default: true
      profile_id:
        type: string
        default: default
    additionalProperties: true
  output_schema:
    type: object
- name: sync_agent
  description: Pull bounded idempotent source deltas from the local media library agent.
  entry: handlers.main:sync_agent
  side_effects: local_write
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      max_pages: {type: integer, minimum: 1, maximum: 16, default: 4}
      limit: {type: integer, minimum: 1, maximum: 1000, default: 500}
    additionalProperties: true
  output_schema: {type: object}
- name: home
  description: Return bounded home shelves for one media profile.
  entry: handlers.main:home
  side_effects: none
  input_schema:
    type: object
    properties:
      profile_id: {type: string, default: default}
      limit: {type: integer, minimum: 1, maximum: 20, default: 12}
    additionalProperties: true
  output_schema: {type: object}
- name: list_collections
  description: List typed media collections through an opaque cursor.
  entry: handlers.main:list_collections
  side_effects: none
  input_schema:
    type: object
    properties:
      kind: {type: string}
      limit: {type: integer, minimum: 1, maximum: 30, default: 30}
      cursor: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: duplicate_candidates
  description: Return non-destructive duplicate and variant candidates.
  entry: handlers.main:duplicate_candidates
  side_effects: none
  input_schema:
    type: object
    properties:
      limit: {type: integer, minimum: 1, maximum: 100, default: 30}
    additionalProperties: true
  output_schema: {type: object}
- name: save_checkpoint
  description: Persist a profile-scoped resume checkpoint.
  entry: handlers.main:save_checkpoint
  side_effects: local_write
  input_schema:
    type: object
    required: [item_id, position_ms]
    properties:
      item_id: {type: string}
      profile_id: {type: string, default: default}
      position_ms: {type: integer, minimum: 0}
      duration_ms: {type: integer, minimum: 0}
      completed: {type: boolean, default: false}
    additionalProperties: true
  output_schema: {type: object}
- name: queue_background_job
  description: Queue background enrichment or technical analysis.
  entry: handlers.main:queue_background_job
  side_effects: local_write
  input_schema:
    type: object
    required: [kind, subject_ref]
    properties:
      kind: {type: string, enum: [technical_probe, metadata_enrichment, thumbnail, fingerprint, embedding]}
      subject_ref: {type: string}
      priority: {type: integer, minimum: 1, maximum: 1000, default: 100}
    additionalProperties: true
  output_schema: {type: object}
- name: operations
  description: List bounded observable background media operations.
  entry: handlers.main:operations
  side_effects: none
  input_schema:
    type: object
    properties:
      limit: {type: integer, minimum: 1, maximum: 100, default: 30}
    additionalProperties: true
  output_schema: {type: object}
- name: status
  description: Return compact media-center catalog status.
  entry: handlers.main:status
  side_effects: none
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: next_steps
  description: Return admitted MVP workflow steps and production roadmap boundary.
  entry: handlers.main:next_steps
  side_effects: none
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: chat
  description: Small conversational control entrypoint for scan/search/help commands.
  entry: handlers.main:chat
  side_effects: local_write
  input_schema:
    type: object
    properties:
      text:
        type: string
      source:
        type: string
      limit:
        type: integer
    additionalProperties: true
  output_schema:
    type: object
data_routes:
- surface: widget:media-center-summary
  route: tool/details
  tool: status
  owner: skill:media_center_skill
  first_paint: compact catalog status
  recovery: repeat status after scan invalidation
  guard_visibility: aggregate media counts and source facets only
  budget:
    max_payload_bytes: 65536
    snapshot_policy: manual
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    cache_ttl_ms: 1000
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - media_center.catalog
- surface: widget:media-center-catalog
  route: tool
  tool: library
  owner: skill:media_center_skill
  first_paint: one bounded thirty-row catalog page
  recovery: repeat library after scan invalidation or filter changes
  guard_visibility: catalog metadata and safe content paths only
  budget:
    max_payload_bytes: 524288
    max_items: 30
    snapshot_policy: manual
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - state_dependency_changed
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - media_center.catalog
- surface: widget:media-center-player
  route: tool
  tool: playback_queue
  owner: skill:media_center_skill
  first_paint: selected item plus a bounded ten-item playback queue
  recovery: select a catalog item again or repeat playback_queue after invalidation
  guard_visibility: catalog metadata and safe content paths only
  budget:
    max_payload_bytes: 1048576
    max_items: 10
    snapshot_policy: manual
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - state_dependency_changed
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - media_center.catalog
- surface: widget:media-center-details
  route: tool/details
  tool: get_item
  owner: skill:media_center_skill
  first_paint: no selected media item
  recovery: select a catalog item again
  guard_visibility: one catalog row and its MediaResource descriptor
  budget:
    max_payload_bytes: 262144
    snapshot_policy: manual
  read_policy:
    mode: explicit
    triggers:
    - explicit_refresh
    - state_dependency_changed
    cache_ttl_ms: 0
    max_request_hz: 5
    preserve_last_value: false
    invalidation_tags:
    - media_center.catalog
- surface: widget:media-center-roots
  route: tool
  tool: list_roots
  owner: skill:media_center_skill
  first_paint: configured media folders
  recovery: repeat list_roots after folder import
  guard_visibility: local folder paths visible to the local user
  budget:
    max_payload_bytes: 262144
    max_items: 100
    snapshot_policy: manual
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - media_center.roots
- surface: widget:media-center-next-steps
  route: tool/details
  tool: next_steps
  owner: skill:media_center_skill
  first_paint: compact MVP workflow steps
  recovery: repeat next_steps on explicit help
  guard_visibility: workflow guidance only
  budget:
    max_payload_bytes: 65536
    snapshot_policy: manual
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    cache_ttl_ms: 60000
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - media_center.catalog
- surface: media-center catalog store
  route: skill-local
  path: data/db/media_center.sqlite3
  owner: skill:media_center_skill
  first_paint: empty catalog
  recovery: rehydrate schema and scan SDK media resources
  guard_visibility: other skills receive tool projections only
  budget:
    max_payload_bytes: 1048576
llm_hints:
  description: Durable MVP media center catalog for local playback and future media-center workflows.
  aliases:
  - Media Center
  - media center
  - media library
  primary_actions:
  - id: media_center_skill.scan_sources
    intent: media_center.scan
    tool: scan_sources
    side_effect_class: local_write
    examples:
    - Refresh media center catalog
    - Scan media resources
  - id: media_center_skill.import_folder
    intent: media_center.import_folder
    tool: import_folder
    side_effect_class: local_write
    examples:
    - Add media folder
    - Import videos from a folder
  - id: media_center_skill.library
    intent: media_center.browse
    tool: library
    side_effect_class: read_only
    examples:
    - Show media center
    - Browse videos
  owner_hints:
  - skill:media_center_skill
nlu_hints:
  aliases:
  - Media Center
  - media center
  - media library
  examples:
  - refresh media center
  - show media library
  slot_schemas: {}
  entities: []
updated_at: '2026-08-14T12:00:00+00:00'
