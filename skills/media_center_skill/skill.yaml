name: media_center_skill
version: 0.8.47
description: Distributed Media Center coordinator with federated discovery, bounded
  catalog, personalization, and rendition-aware playback.
supported_locales:
- en
- ru
entry: handlers/main.py
default_tool: chat
webui:
  file: webui.json
runtime:
  python: '3.11'
capabilities:
- storage.relational
- media.catalog
- media.playback_planning
- skills.invoke
- project.deployment.manage
- project.deployment.inspect
- project.deployment.apply
- project.component.install.remote
- project.component.drain
- project.component.remove
- distributed.service.manage
- distributed.service.register
- distributed.service.renew
- distributed.service.drain
- distributed.topology.manage
- distributed.topology.inspect
- distributed.topology.plan
- distributed.topology.apply
- distributed.authority.handoff
- distributed.replica.remove
- distributed.service.invoke
- distributed.replica.observe
dependencies:
- requests>=2.31.0
events:
  subscribe:
  - sys.ready
  - webio.stream.snapshot.requested
  - media_library_agent.catalog.changed
  publish:
  - io.out.stream.publish
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
  dispose: dispose
memory_budget:
  expected_rss_mb: 192
  background_workers:
    max_threads: 2
    cleanup_hook: dispose
exports:
  tools:
  - ensure_schema
  - rehydrate
  - scan_sources
  - list_roots
  - add_root
  - remove_root
  - delete_root
  - scan_roots
  - import_folder
  - library
  - list_items
  - deep_search
  - get_item
  - playback_queue
  - playback_plan
  - ensure_rendition
  - build_playback_queue
  - set_favorite
  - sync_agent
  - home
  - list_profiles
  - get_profile
  - set_profile_policy
  - set_personal_state
  - recommendations
  - voice_request
  - list_collections
  - browse_folders
  - create_playlist
  - list_playlists
  - playlist_items
  - update_playlist
  - delete_playlist
  - apply_correction
  - reverse_correction
  - metadata_claims
  - duplicate_candidates
  - save_checkpoint
  - queue_background_job
  - operations
  - dispose
  - status
  - diagnostic_export
  - deployment_status
  - configure_deployment
  - apply_deployment
  - deployment_operation_status
  - drain_activation
  - remove_activation
  - define_topology
  - register_agent
  - renew_agent
  - drain_agent
  - observe_agent_topology
  - plan_topology_change
  - apply_topology_change
  - topology_operation_status
  - handoff_authority
  - topology_status
  - explain_route
  - next_steps
  - chat
tools:
- name: ensure_schema
  description: Apply the durable media-center catalog schema.
  entry: handlers.main:ensure_schema
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: rehydrate
  description: Re-open durable catalog state after activation.
  entry: handlers.main:rehydrate
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: scan_sources
  description: Reconcile SDK media resources from Media Server and legacy media_indexer
    into the durable catalog.
  entry: handlers.main:scan_sources
  side_effects: local_write
  input_schema:
    type: object
    properties:
      source:
        type: string
        enum:
        - all
        - media_server
        - media_indexer
        default: all
      limit:
        type: integer
        minimum: 1
        maximum: 5000
        default: 5000
    additionalProperties: true
  output_schema:
    type: object
- name: list_roots
  description: List configured media-center library folders.
  entry: handlers.main:list_roots
  side_effects: none
  input_schema:
    type: object
    properties:
      include_disabled:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: add_root
  description: Add a local folder to the media-center import set.
  entry: handlers.main:add_root
  side_effects: local_write
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      label:
        type: string
      include_images:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: remove_root
  description: Disable a configured media-center library folder.
  entry: handlers.main:remove_root
  side_effects: local_write
  input_schema:
    type: object
    properties:
      root_id:
        type: string
      path:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: delete_root
  description: Delete a configured folder, its catalog rows, and exact core media
    resource links without deleting source files.
  entry: handlers.main:delete_root
  side_effects: local_write
  input_schema:
    type: object
    properties:
      root_id:
        type: string
      path:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: scan_roots
  description: Register playable files from configured folders without copying media
    bytes.
  entry: handlers.main:scan_roots
  side_effects: local_write
  timeout_seconds: 600
  input_schema:
    type: object
    properties:
      root_id:
        type: string
      path:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
    additionalProperties: true
  output_schema:
    type: object
- name: import_folder
  description: Add a folder and register its playable files in place.
  entry: handlers.main:import_folder
  side_effects: local_write
  timeout_seconds: 600
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
      label:
        type: string
      include_images:
        type: boolean
        default: false
      limit:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
    additionalProperties: true
  output_schema:
    type: object
- name: library
  description: Return a widget-ready catalog projection with items, summary, facets,
    and playback descriptors.
  entry: handlers.main:library
  side_effects: none
  input_schema:
    type: object
    properties:
      query:
        type: string
      media_kind:
        type: string
        enum:
        - ''
        - playable
        - video
        - audio
        - image
        - other
      source:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
      offset:
        type: integer
        minimum: 0
        default: 0
      cursor:
        type: string
      profile_id:
        type: string
        default: default
      collection_id:
        type: string
      include_missing:
        type: boolean
        default: false
      favorites_only:
        type: boolean
        default: false
      sort:
        type: string
        enum:
        - recent
        - title
        - size
        - source
        - favorite
        default: recent
      auto_scan:
        type: boolean
        default: true
    additionalProperties: true
  output_schema:
    type: object
- name: list_items
  description: Alias for library for generic catalog widgets.
  entry: handlers.main:list_items
  side_effects: none
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: get_item
  description: Read one media-center catalog item.
  entry: handlers.main:get_item
  side_effects: none
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: deep_search
  description: Run bounded coordinator and source-agent full-text search stages.
  entry: handlers.main:deep_search
  side_effects: none
  input_schema:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 500
      profile_id:
        type: string
        default: default
      media_kind:
        type: string
        default: playable
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
      max_agents:
        type: integer
        minimum: 1
        maximum: 16
        default: 4
    additionalProperties: true
  output_schema:
    type: object
- name: playback_queue
  description: Return the selected item first and at most ten playable queue entries.
  entry: handlers.main:playback_queue
  side_effects: none
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
      query:
        type: string
      media_kind:
        type: string
        default: playable
      source:
        type: string
      favorites_only:
        type: boolean
        default: false
      sort:
        type: string
        default: recent
      limit:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
    additionalProperties: true
  output_schema:
    type: object
- name: playback_plan
  description: Select a deterministic media variant and direct or routed delivery
    plan for one endpoint.
  entry: handlers.main:playback_plan
  side_effects: none
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
      endpoint_id:
        type: string
      endpoint_node_id:
        type: string
      endpoint_capabilities:
        type: object
        additionalProperties: true
      preferred_quality:
        type: string
        default: auto
      preferred_language:
        type: string
      variant_id:
        type: string
      profile_id:
        type: string
        default: default
    additionalProperties: true
  output_schema:
    type: object
- name: ensure_rendition
  description: Plan and queue one browser-compatible rendition on the source-owning
    agent.
  entry: handlers.main:ensure_rendition
  side_effects: local_write
  timeout_seconds: 30
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
        minLength: 1
      endpoint_capabilities:
        type: object
        additionalProperties: true
      profile_id:
        type: string
        default: default
      rendition_profile:
        type: string
        default: browser-mp4-v1
      priority:
        type: integer
        minimum: 0
        maximum: 1000
        default: 50
      force:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: build_playback_queue
  description: Build up to 500 ordered playback plans from an item, work, collection,
    folder, or playlist.
  entry: handlers.main:build_playback_queue
  side_effects: none
  input_schema:
    type: object
    required:
    - source_type
    - source_id
    properties:
      source_type:
        type: string
        enum:
        - item
        - work
        - collection
        - folder
        - playlist
      source_id:
        type: string
      profile_id:
        type: string
        default: default
      limit:
        type: integer
        minimum: 1
        maximum: 500
        default: 500
      endpoint_id:
        type: string
      endpoint_node_id:
        type: string
      endpoint_capabilities:
        type: object
        additionalProperties: true
      preferred_quality:
        type: string
        default: auto
      preferred_language:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: set_favorite
  description: Mark or unmark one catalog item as favorite.
  entry: handlers.main:set_favorite
  side_effects: local_write
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
      favorite:
        type: boolean
        default: true
      profile_id:
        type: string
        default: default
    additionalProperties: true
  output_schema:
    type: object
- name: sync_agent
  description: Pull bounded idempotent source deltas from the local media library
    agent.
  entry: handlers.main:sync_agent
  side_effects: local_write
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      max_pages:
        type: integer
        minimum: 1
        maximum: 16
        default: 4
      limit:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    additionalProperties: true
  output_schema:
    type: object
- name: home
  description: Return bounded home shelves for one media profile.
  entry: handlers.main:home
  side_effects: none
  input_schema:
    type: object
    properties:
      profile_id:
        type: string
        default: default
      limit:
        type: integer
        minimum: 1
        maximum: 20
        default: 12
      shared_surface:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: list_profiles
  description: List bounded Media Center profiles and their library policies.
  entry: handlers.main:list_profiles
  side_effects: none
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    additionalProperties: true
  output_schema:
    type: object
- name: get_profile
  description: Read one Media Center profile and its library policy.
  entry: handlers.main:get_profile
  side_effects: none
  input_schema:
    type: object
    properties:
      profile_id:
        type: string
        default: default
    additionalProperties: true
  output_schema:
    type: object
- name: set_profile_policy
  description: Revision-safely update media-kind, maturity, explicit-content, and
    shared-surface policy.
  entry: handlers.main:set_profile_policy
  side_effects: local_write
  input_schema:
    type: object
    required:
    - profile_id
    - expected_revision
    - values
    properties:
      profile_id:
        type: string
        minLength: 1
      expected_revision:
        type: integer
        minimum: 1
      values:
        type: object
        properties:
          allowed_media_kinds:
            type: array
            minItems: 1
            maxItems: 2
            items:
              type: string
              enum:
              - audio
              - video
          maximum_maturity_rating:
            type: integer
            minimum: 0
            maximum: 21
          allow_explicit:
            type: boolean
          show_history_on_shared_surface:
            type: boolean
          recommendations_enabled:
            type: boolean
        additionalProperties: false
    additionalProperties: true
  output_schema:
    type: object
- name: set_personal_state
  description: Set a profile-scoped rating or hidden flag for one catalog item.
  entry: handlers.main:set_personal_state
  side_effects: local_write
  input_schema:
    type: object
    required:
    - item_id
    properties:
      item_id:
        type: string
        minLength: 1
      profile_id:
        type: string
        default: default
      rating:
        type: integer
        minimum: 0
        maximum: 5
      hidden:
        type: boolean
    additionalProperties: true
  output_schema:
    type: object
- name: recommendations
  description: Return bounded profile-scoped recommendations with explainable local
    signals and opt-out.
  entry: handlers.main:recommendations
  side_effects: none
  input_schema:
    type: object
    properties:
      profile_id:
        type: string
        default: default
      limit:
        type: integer
        minimum: 1
        maximum: 20
        default: 12
    additionalProperties: true
  output_schema:
    type: object
- name: voice_request
  description: Resolve structured voice discovery, collection, favorite, target, status,
    playback, and transport intents.
  entry: handlers.main:voice_request
  side_effects: local_write
  input_schema:
    type: object
    properties:
      intent:
        type: string
        enum:
        - ''
        - search
        - browse
        - play
        - favorite
        - unfavorite
        - collections
        - status
        - targets
        - control
        - compound
      text:
        type: string
      query:
        type: string
      profile_id:
        type: string
        default: default
      room_id:
        type: string
      target_id:
        type: string
      item_id:
        type: string
      focused_item_id:
        type: string
      collection_kind:
        type: string
      media_kind:
        type: string
        enum:
        - playable
        - audio
        - video
        default: playable
      action:
        type: string
        enum:
        - ''
        - play
        - pause
        - seek
        - volume
        - mute
        - next
        - previous
        - stop
        - handoff
        - tracks
        - rate
        - sleep_timer
      arguments:
        type: object
      dialog_context:
        type: object
      actor_ref:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 10
        default: 5
    additionalProperties: true
  output_schema:
    type: object
- name: list_collections
  description: List typed media collections through an opaque cursor.
  entry: handlers.main:list_collections
  side_effects: none
  input_schema:
    type: object
    properties:
      kind:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
      cursor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: browse_folders
  description: Browse lazy folder children through an opaque cursor.
  entry: handlers.main:browse_folders
  side_effects: none
  input_schema:
    type: object
    properties:
      agent_id:
        type: string
      root_id:
        type: string
      parent:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
      cursor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: create_playlist
  description: Create a profile-owned personal, household, or shared playlist.
  entry: handlers.main:create_playlist
  side_effects: local_write
  input_schema:
    type: object
    required:
    - title
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      profile_id:
        type: string
        default: default
      visibility:
        type: string
        enum:
        - private
        - household
        - shared
        default: private
      item_ids:
        type: array
        maxItems: 500
        items:
          type: string
    additionalProperties: true
  output_schema:
    type: object
- name: list_playlists
  description: List playlists visible to one profile.
  entry: handlers.main:list_playlists
  side_effects: none
  input_schema:
    type: object
    properties:
      profile_id:
        type: string
        default: default
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
      cursor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: playlist_items
  description: Read one bounded playlist page.
  entry: handlers.main:playlist_items
  side_effects: none
  input_schema:
    type: object
    required:
    - playlist_id
    properties:
      playlist_id:
        type: string
      profile_id:
        type: string
        default: default
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
      cursor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
- name: update_playlist
  description: Revision-safely replace playlist metadata and order.
  entry: handlers.main:update_playlist
  side_effects: local_write
  input_schema:
    type: object
    required:
    - playlist_id
    - expected_revision
    properties:
      playlist_id:
        type: string
      profile_id:
        type: string
        default: default
      expected_revision:
        type: integer
        minimum: 1
      title:
        type: string
        minLength: 1
        maxLength: 200
      visibility:
        type: string
        enum:
        - private
        - household
        - shared
      item_ids:
        type: array
        maxItems: 500
        items:
          type: string
    additionalProperties: true
  output_schema:
    type: object
- name: delete_playlist
  description: Revision-safely remove a playlist without deleting media.
  entry: handlers.main:delete_playlist
  side_effects: local_write
  input_schema:
    type: object
    required:
    - playlist_id
    - expected_revision
    properties:
      playlist_id:
        type: string
      profile_id:
        type: string
        default: default
      expected_revision:
        type: integer
        minimum: 1
    additionalProperties: true
  output_schema:
    type: object
- name: apply_correction
  description: Apply an audited reversible metadata, merge, split, or regroup correction.
  entry: handlers.main:apply_correction
  side_effects: local_write
  input_schema:
    type: object
    required:
    - operation
    - subject_ref
    - values
    properties:
      operation:
        type: string
        enum:
        - metadata
        - merge
        - split
        - regroup
      subject_ref:
        type: string
      values:
        type: object
      actor_ref:
        type: string
        default: profile:default
    additionalProperties: true
  output_schema:
    type: object
- name: reverse_correction
  description: Reverse one audited catalog correction.
  entry: handlers.main:reverse_correction
  side_effects: local_write
  input_schema:
    type: object
    required:
    - correction_id
    properties:
      correction_id:
        type: string
      actor_ref:
        type: string
        default: profile:default
    additionalProperties: true
  output_schema:
    type: object
- name: metadata_claims
  description: List bounded metadata claims with provenance.
  entry: handlers.main:metadata_claims
  side_effects: none
  input_schema:
    type: object
    required:
    - subject_ref
    properties:
      subject_ref:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    additionalProperties: true
  output_schema:
    type: object
- name: duplicate_candidates
  description: Return non-destructive duplicate and variant candidates.
  entry: handlers.main:duplicate_candidates
  side_effects: none
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    additionalProperties: true
  output_schema:
    type: object
- name: save_checkpoint
  description: Persist a profile-scoped resume checkpoint.
  entry: handlers.main:save_checkpoint
  side_effects: local_write
  input_schema:
    type: object
    required:
    - item_id
    - position_ms
    properties:
      item_id:
        type: string
      profile_id:
        type: string
        default: default
      position_ms:
        type: integer
        minimum: 0
      duration_ms:
        type: integer
        minimum: 0
      completed:
        type: boolean
        default: false
    additionalProperties: true
  output_schema:
    type: object
- name: queue_background_job
  description: Queue background enrichment or technical analysis.
  entry: handlers.main:queue_background_job
  side_effects: local_write
  input_schema:
    type: object
    required:
    - kind
    - subject_ref
    properties:
      kind:
        type: string
        enum:
        - technical_probe
        - metadata_enrichment
        - thumbnail
        - fingerprint
        - embedding
      subject_ref:
        type: string
      priority:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    additionalProperties: true
  output_schema:
    type: object
- name: operations
  description: List bounded observable background media operations.
  entry: handlers.main:operations
  side_effects: none
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    additionalProperties: true
  output_schema:
    type: object
- name: dispose
  description: Stop the process-local enrichment worker.
  entry: handlers.main:dispose
  side_effects: local_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: status
  description: Return compact media-center catalog status.
  entry: handlers.main:status
  side_effects: none
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: diagnostic_export
  description: Export bounded path- and secret-redacted operations diagnostics and
    reviewed repair proposals.
  entry: handlers.main:diagnostic_export
  side_effects: none
  input_schema:
    type: object
    properties:
      deployment_id:
        type: string
        default: media-center-home
      browser_diagnostics:
        type: object
        additionalProperties: true
    additionalProperties: true
  output_schema:
    type: object
- name: deployment_status
  description: Return bounded Project deployment and per-node activation state.
  entry: handlers.main:deployment_status
  side_effects: none
  input_schema:
    type: object
    properties:
      deployment_id:
