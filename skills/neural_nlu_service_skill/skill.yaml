name: neural_nlu_service_skill
version: 0.2.15
description: Local neural intent detector service for AdaOS NLU pipeline
runtime:
  kind: service
  env:
    mode: venv
    python: '3.11'
    allow_heavy_dependencies: true
dependencies:
- --extra-index-url
- https://download.pytorch.org/whl/cpu
- torch==2.12.0+cpu
- numpy
- faiss-cpu
models:
  private: true
service:
  host: 127.0.0.1
  port: 18091
  command:
  - -m
  - handlers.main
  healthcheck:
    path: /health
    timeout_ms: 1000
permissions:
- network
events:
  publish:
  - nlp.intent.detected
  - nlp.intent.detect.rasa
