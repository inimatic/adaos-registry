name: rasa_nlu_service_skill
version: 0.1.15
description: Local Rasa NLU-only service for AdaOS intent detection
runtime:
  kind: service
  activation:
    mode: lazy
    startup_allowed: true
    background_refresh: true
  env:
    mode: venv
    python: '3.11'
service:
  host: 127.0.0.1
  port: 18092
  command:
  - -m
  - handlers.main
  healthcheck:
    path: /health
    timeout_ms: 1000
permissions:
- network
events:
  subscribe:
  - nlp.intent.detect.rasa
  - nlp.rasa.train
  publish:
  - nlp.intent.detected
updated_at: '2026-08-29T05:55:37+00:00'
dependencies:
- --no-deps
- adaos-rasa-nlu @ git+https://github.com/inimatic/rasa-port.git@main
compatibility:
  adaos_core:
    min_version: 0.1.950+5767.4e1aaf98b
    recorded_at: '2026-08-29T05:55:37+00:00'
    source: skill_push
