name: demo_metrics_skill
version: 0.13.5
description: Neutral demo skill for semantic Web UI migration with a metrics table,
  chart payload, Taiga tree, and live event stream.
runtime:
  python: '3.11'
webui_owner: shared
data_projections:
- scope: webspace
  slot: demo.metrics.summary
  targets:
  - backend: yjs
    path: data/demo_metrics/summary
- scope: webspace
  slot: demo.metrics.table
  targets:
  - backend: yjs
    path: data/demo_metrics/table
- scope: webspace
  slot: demo.metrics.tree
  targets:
  - backend: yjs
    path: data/demo_metrics/tree
- scope: webspace
  slot: demo.metrics.chart
  targets:
  - backend: yjs
    path: data/demo_metrics/chart
- scope: webspace
  slot: demo.metrics.selection
  targets:
  - backend: yjs
    path: data/demo_metrics/selection
- scope: webspace
  slot: demo.metrics.resource_workbench
  targets:
  - backend: yjs
    path: data/demo_metrics/resource_workbench
events:
  subscribe:
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
  - demo_metrics.host_action
tools:
- name: get_demo_snapshot
  description: Return the static demo metrics snapshot used by the browser demo surfaces.
  entry: handlers.main:get_demo_snapshot
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      snapshot:
        type: object
    required:
    - ok
    - snapshot
- name: list_demo_series
  description: Return the chart-oriented series payload for the current demo metrics
    selection.
  entry: handlers.main:list_demo_series
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      metric_id:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      series:
        type: object
    required:
    - ok
    - series
- name: emit_demo_event
  description: Publish one live demo event into the browser event stream.
  entry: handlers.main:emit_demo_event
  side_effects: runtime_write
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      action_id:
        type: string
      metric_id:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      event:
        type: object
    required:
    - ok
    - event
- name: get_resource_workbench_snapshot
  description: Return the Declarative Resource Workbench demo snapshot with definitions,
    synthetic records, role fixtures, events, and traces.
  entry: handlers.main:get_resource_workbench_snapshot
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      role:
        type: string
      fixture:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      snapshot:
        type: object
      items:
        type: array
    required:
    - ok
    - snapshot
- name: list_resource_role_matrix
  description: Return role-policy rows for the Declarative Resource Workbench demo.
  entry: handlers.main:list_resource_role_matrix
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      role:
        type: string
      fixture:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      resource_type:
        type: string
      items:
        type: array
      count:
        type: integer
    required:
    - ok
    - items
- name: query_resource_workbench
  description: Run a typed resource query for Dev Tickets or demo workbench resources.
  entry: handlers.main:query_resource_workbench
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      resource_type:
        type: string
      filters:
        type: object
      search:
        type: string
      limit:
        type: integer
      actor:
        type: object
      role:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      resource_type:
        type: string
      items:
        type: array
      count:
        type: integer
    required:
    - ok
    - resource_type
    - items
- name: operate_metric_note
  description: Execute a typed create, update, or delete operation against the demo.metric_note
    prototype store.
  entry: handlers.main:operate_metric_note
  side_effects: local_write
  input_schema:
    type: object
    properties:
      operation_id:
        type: string
      record_id:
        type: string
      payload:
        type: object
      actor:
        type: object
      role:
        type: string
      expected_revision:
        oneOf:
        - type: integer
        - type: string
        - type: 'null'
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      resource_type:
        type: string
      operation_id:
        type: string
      snapshot:
        type: object
    required:
    - ok
    - resource_type
    - operation_id
updated_at: '2026-08-30T08:07:13+00:00'
