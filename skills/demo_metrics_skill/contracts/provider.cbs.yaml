schema: adaos.cbs.provider_authoring.v1
authorship:
  origin: human_authored
capability:
  ref: capability:demo.metrics.workbench
  version: 1.0.0
  title: Inspect metrics and exercise a typed resource workbench
  operations:
  - operation_id: snapshot
    tool: get_demo_snapshot
    errors:
    - demo_projection_unavailable
  - operation_id: series
    tool: list_demo_series
    errors:
    - metric_not_found
  - operation_id: query_resource
    tool: query_resource_workbench
    errors:
    - unsupported_resource_type
    - provider_unavailable
  - operation_id: operate_note
    tool: operate_metric_note
    errors:
    - permission_denied
    - conflict
  invariants:
  - synthetic metric fixtures never become operational monitoring authority
  - typed resource operations retain revision and access checks
  effects:
  - reads synthetic metrics and governed development-ticket projections
  - creates, updates, or deletes demo metric notes on explicit request
  conformance_refs:
  - scenario:demo.metrics.workbench.v1
binding:
  ref: binding-definition:demo.metrics.workbench.local
  version: 1.0.0
  entry_protocol: adaos.skill.tools.v1
  logical_entrypoint: demo.metrics.workbench.local
  physical_member: handlers/main.py
  modes:
  - production
  profile_classes:
  - local
  provider_features:
  - typed_resource_workbench
  - synthetic_metrics
  conformance_obligations:
  - capability_conformance
