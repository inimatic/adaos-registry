- name: preview_in_other_panel
  entry: handlers.main:preview_in_other_panel
  description: Preview the selected file in the opposite panel preview area when supported.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      preview_panel:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: upload_to_panel
  entry: handlers.main:upload_to_panel
  description: Copy an uploaded browser artifact into the current panel folder.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      artifact_ref:
        type: object
      file:
        type: object
      filename:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: make_folder
  entry: handlers.main:make_folder
  description: Create a folder in the current panel folder.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      name:
        type: string
      folder_name:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: refresh
  entry: handlers.main:refresh
  description: Refresh and publish the requested bounded Drive read models.
  side_effects: runtime_write
  side_effect_class: runtime_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: persist_state
  entry: handlers.main:persist_state
