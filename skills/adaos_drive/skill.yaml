name: adaos_drive
version: 0.1.2
description: Two-panel browser file manager for explicitly connected local folders.
supported_locales:
- en
- ru
runtime:
  python: '3.11'
webui_owner: shared
default_tool: get_snapshot
events:
  subscribe:
  - webio.stream.snapshot.requested
data_routes:
- surface: modal:adaos_drive_modal
  route: stream
  receiver: adaos_drive.left
  first_paint: bounded left file panel state
  recovery: skill republishes the left read model on snapshot request
  update_source:
  - webio.stream.snapshot.requested
  - adaos_drive.action
  budget:
    max_payload_bytes: 196608
    max_publish_hz: 2
    max_items: 64
    max_fanout: 3
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: browser keeps the last left panel snapshot
    log: skill:adaos_drive.runtime
    quarantine: false
- surface: modal:adaos_drive_modal
  route: stream
  receiver: adaos_drive.right
  first_paint: bounded right file panel state
  recovery: skill republishes the right read model on snapshot request
  update_source:
  - webio.stream.snapshot.requested
  - adaos_drive.action
  budget:
    max_payload_bytes: 196608
    max_publish_hz: 2
    max_items: 64
    max_fanout: 3
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: browser keeps the last right panel snapshot
    log: skill:adaos_drive.runtime
    quarantine: false
- surface: modal:adaos_drive_modal
  route: stream
  receiver: adaos_drive.preview
  first_paint: empty bounded preview
  recovery: skill republishes only the preview read model on snapshot request
  update_source:
  - webio.stream.snapshot.requested
  - adaos_drive.action
  budget:
    max_payload_bytes: 49152
    max_publish_hz: 2
    max_items: 1
    max_fanout: 3
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: browser keeps the last bounded preview
    log: skill:adaos_drive.runtime
    quarantine: false
- surface: modal:adaos_drive_modal
  route: stream
  receiver: adaos_drive.sharing
  first_paint: bounded public sharing summary
  recovery: skill republishes only the sharing read model on snapshot request
  update_source:
  - webio.stream.snapshot.requested
  - adaos_drive.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 16
    max_fanout: 3
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: browser keeps the last sharing summary
    log: skill:adaos_drive.runtime
    quarantine: false
memory_budget:
  expected_rss_mb: 96
  caches:
  - name: adaos_drive.state
    storage: skill_memory
    max_items: 8
    cleanup_hook: reset_drive
  - name: STATE_BY_WEBSPACE
    storage: process_memory
    max_items: 8
    cleanup_hook: reset_drive
lifecycle:
  persist_before_switch: persist_state
  rehydrate: rehydrate
tools:
- name: get_snapshot
  entry: handlers.main:get_snapshot
  description: Return the current bounded AdaOS Drive snapshot without publishing it.
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - snapshot
    properties:
      ok:
        type: boolean
      snapshot:
        type: object
- name: add_source
  entry: handlers.main:add_source
  description: Connect an existing local folder as a file source.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - path
    properties:
      label:
        type: string
      path:
        type: string
      panel:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      source:
        type: object
- name: select_source
  entry: handlers.main:select_source
  description: Switch one panel to a connected source.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - source_id
    properties:
      source_id:
        type: string
      panel:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: set_active_panel
  entry: handlers.main:set_active_panel
  description: Mark one file panel as active.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      active_panel:
        type: string
- name: select_item
  entry: handlers.main:select_item
  description: Select an item in one panel.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      id:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: open_folder
  entry: handlers.main:open_folder
  description: Navigate a panel into a folder.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: activate_item
  entry: handlers.main:activate_item
  description: Select files and open folders, including parent folder rows.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      id:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: navigate_up
  entry: handlers.main:navigate_up
  description: Navigate one panel to the parent folder.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: expand_tree
  entry: handlers.main:expand_tree
  description: Lazily load one tree branch for a panel.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - children_count
    properties:
      ok:
        type: boolean
      children_count:
        type: integer
- name: open_selected
  entry: handlers.main:open_selected
  description: Open a selected folder or preview a selected file.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: rename_selected
  entry: handlers.main:rename_selected
  description: Rename the active selected file or folder within its source root.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - new_name
    properties:
      panel:
        type: string
      path:
        type: string
      new_name:
        type: string
      name:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: copy_to_other_panel
  entry: handlers.main:copy_to_other_panel
  description: Copy the selected file or folder from one panel to the other panel
    folder.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      from_panel:
        type: string
      to_panel:
        type: string
      path:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: create_guest_link
  entry: handlers.main:create_guest_link
  description: Register a Root-mediated readonly public link for the selected file
    or folder.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      download:
        type: boolean
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - link
    properties:
      ok:
        type: boolean
      link:
        type: object
- name: download_selected
  entry: handlers.main:download_selected
  description: Create and open a direct download link for the selected file, or the
    public face for folders.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    properties:
      panel:
        type: string
      path:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - link
    properties:
      ok:
        type: boolean
      link:
        type: object
- name: list_public_links
  entry: handlers.main:list_public_links
  description: List readonly public Drive links registered on this hub for owner risk
    review.
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      limit:
        type: integer
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - links
    properties:
      ok:
        type: boolean
      links:
        type: array
- name: list_public_downloads
  entry: handlers.main:list_public_downloads
  description: List recent download and preview journal events for readonly public
    Drive links.
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      public_token:
        type: string
      limit:
        type: integer
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - events
    properties:
      ok:
        type: boolean
      downloads:
        type: object
      events:
        type: array
      summary:
        type: object
- name: revoke_public_link
  entry: handlers.main:revoke_public_link
  description: Revoke a readonly public Drive link on the hub and Root registry.
  side_effects: local_write
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - public_token
    properties:
      public_token:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - link
    properties:
      ok:
        type: boolean
      link:
        type: object
      root_revoke:
