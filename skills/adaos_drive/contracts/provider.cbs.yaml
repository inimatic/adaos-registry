schema: adaos.cbs.provider_authoring.v1
authorship:
  origin: human_authored
capability:
  ref: capability:workspace.files.manage
  version: 1.1.0
  title: Browse and manage explicitly connected workspace folders
  operations:
  - operation_id: snapshot
    tool: get_snapshot
    errors:
    - source_unavailable
  - operation_id: add_source
    tool: add_source
    errors:
    - source_invalid
    - access_denied
  - operation_id: rename_source
    tool: rename_source
    errors:
    - source_invalid
    - source_unavailable
  - operation_id: remove_source
    tool: remove_source
    errors:
    - source_unavailable
    - last_source_protected
  - operation_id: open_folder
    tool: open_folder
    errors:
    - folder_not_found
    - access_denied
  - operation_id: rename
    tool: rename_selected
    errors:
    - item_not_found
    - access_denied
  - operation_id: copy
    tool: copy_to_other_panel
    errors:
    - item_not_found
    - destination_unavailable
  - operation_id: upload
    tool: upload_to_panel
    errors:
    - destination_unavailable
    - access_denied
  invariants:
  - file access remains bounded to folders explicitly connected by the owner
  - navigation state never grants filesystem authority on its own
  effects:
  - reads file metadata and bounded previews from connected folders
  - performs only explicitly requested writes within connected folders
  authority_requirements:
  - workspace.read
  - workspace.write
  conformance_refs:
  - scenario:workspace.files.manage.v1
binding:
  ref: binding-definition:workspace.files.manage.adaos-drive-local
  version: 1.1.0
  entry_protocol: adaos.skill.tools.v1
  logical_entrypoint: workspace.files.adaos-drive-local
  physical_member: handlers/main.py
  modes:
  - production
  profile_classes:
  - local
  provider_features:
  - connected_local_folders
  - bounded_file_preview
  authority_requirements:
  - workspace.read
  - workspace.write
  conformance_obligations:
  - capability_conformance
