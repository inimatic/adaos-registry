        - scenario
      object_id:
        type: string
        minLength: 1
      text:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - state
    properties:
      ok:
        type: boolean
      state:
        type: object
- name: prompt_append_tz_addendum
  description: Append a new TZ addendum block (append-only)
  entry: handlers.main:prompt_append_tz_addendum
  input_schema:
