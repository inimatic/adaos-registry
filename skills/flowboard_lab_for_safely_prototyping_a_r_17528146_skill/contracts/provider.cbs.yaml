schema: adaos.cbs.provider_authoring.v1
authorship:
  origin: human_authored
capability:
  ref: capability:workboard.items.manage
  version: 1.0.0
  title: Query and manage typed workboard items
  operations:
  - operation_id: list
    tool: list_work_items
    errors:
    - workboard_unavailable
  - operation_id: operate
    tool: operate_work_item
    errors:
    - permission_denied
    - revision_conflict
    - validation_error
  invariants:
  - item status is one of planned, in_progress, or done
  - mutations preserve optimistic revision checks
  effects:
  - reads and mutates skill-owned workboard records
  conformance_refs:
  - resource:workboard.items.v1
binding:
  ref: binding-definition:workboard.items.manage.local-resource
  version: 1.0.0
  entry_protocol: adaos.skill.tools.v1
  logical_entrypoint: workboard.items.local-resource
  physical_member: handlers/main.py
  modes:
  - production
  profile_classes:
  - local
  provider_features:
  - typed_resource_workbench
  - optimistic_revisions
  conformance_obligations:
  - capability_conformance
