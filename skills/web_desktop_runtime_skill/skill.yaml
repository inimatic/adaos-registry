data_routes:
- surface: widget:web_desktop.development-current-application
  route: tool
  tool: get_current_builder_application
  first_paint: Unavailable until the authorized current selection arrives.
  recovery: Explicit refresh after unavailable or ambiguous selection.
  guard_visibility: Clear navigation availability on read failure; never retain destinations.
  budget:
    max_payload_bytes: 8192
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    max_request_hz: 1
    preserve_last_value: false
    invalidation_tags:
    - web_desktop.current_builder
- surface: widget:web_desktop.development-subscription-spend
  route: tool
  tool: get_subscription_usage
  first_paint: Usage is unknown until the authorized snapshot arrives.
  recovery: Explicit refresh; preserve timestamped stale usage on provider failure.
  guard_visibility: Show unavailable on denied or unavailable reads, never fabricated
    zero usage.
  budget:
    max_payload_bytes: 4096
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - web_desktop.subscription_usage
- surface: widget:web_desktop.applications
  route: tool
  tool: list_applications
  first_paint: Empty application collection until the authorized registry projection
    arrives.
  recovery: Explicit retry preserves the last successful application projection.
  guard_visibility: Show an authorization or read error without reporting an empty
    registry as success.
  budget:
    max_payload_bytes: 32768
    max_items: 40
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - web_desktop.applications
- surface: widget:web_desktop.home_widgets
  route: tool
  tool: list_home_widgets
  first_paint: Empty widget collection until the authorized Home projection arrives.
  recovery: Explicit retry preserves the last successful Home widget projection.
  guard_visibility: Show an authorization or read error without reporting widget state
    as current.
  budget:
    max_payload_bytes: 32768
    max_items: 40
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - web_desktop.home_widgets
- surface: widget:web_desktop.devices
