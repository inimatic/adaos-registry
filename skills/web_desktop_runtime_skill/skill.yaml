  first_paint: Empty device collection until the authorized control-plane projection
    arrives.
  recovery: Explicit retry preserves the last successful device projection.
  guard_visibility: Show an authorization or read error without reporting stale device
    state as current.
  budget:
    max_payload_bytes: 32768
    max_items: 40
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    - reconnect
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags:
    - web_desktop.devices
- surface: widget:web_desktop.system
  route: tool
  tool: get_system_overview
  first_paint: Unknown system state until the requested authorized projection arrives.
  recovery: Explicit retry preserves the last successful section and never treats
    an unqueried section as healthy.
  guard_visibility: Show unavailable diagnostics without turning missing observations
    into a healthy status.
  budget:
    max_payload_bytes: 65536
    max_items: 40
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    - reconnect
    max_request_hz: 0.2
    preserve_last_value: true
    invalidation_tags:
    - web_desktop.system
- surface: widget:web_desktop.runtime-controls
  route: tool
  tool: get_runtime_controls
  first_paint: Unknown runtime-control state until the authorized local projection
    arrives.
  recovery: Explicit retry preserves the last successful operator-control projection.
  guard_visibility: Keep controls unavailable when the governed workspace read is
