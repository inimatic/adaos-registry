      message:
        type: string
- name: prepare_connection
  description: Prepare browser, Telegram, or node connection data for a Desktop device
    action without relying on the legacy AdaOS Connect skill.
  entry: handlers.main:prepare_connection
  side_effects: external_write
  permissions:
  - workspace.write
  application_access:
    permission: workspace.write
    capability: desktop.settings.write
  input_schema:
    type: object
    properties:
      mode:
        type: string
        enum:
        - browser
        - telegram
        - node
      webspace_id:
        type:
        - string
        - 'null'
      refresh:
        type: boolean
        default: true
      force_new:
        type: boolean
        default: false
      renew:
        type: boolean
        default: false
  output_schema:
    type: object
    required:
    - ok
    - current
    properties:
      ok:
        type: boolean
      cached:
        type: boolean
      current:
        type: object
- name: unlink_node
  description: Detach a paired member node from the current subnet. The node can be
    paired again later.
  entry: handlers.main:unlink_node
  side_effects: external_write
  permissions:
  - workspace.write
  application_access:
    permission: workspace.write
    capability: desktop.settings.write
  input_schema:
    type: object
    properties:
      device_ref:
        type:
        - string
        - 'null'
      node_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      device_ref:
        type: string
      status:
        type: string
      message:
        type: string
      error:
        type: string
- name: rename_subnet
  description: Persist current subnet display metadata through the public SDK.
  entry: handlers.main:rename_subnet
  side_effects: local_write
  permissions:
  - workspace.write
  application_access:
    permission: workspace.write
    capability: desktop.settings.write
  input_schema:
    type: object
    additionalProperties: false
    properties:
      display_name:
        type: string
        minLength: 1
        maxLength: 120
    required:
    - display_name
  output_schema:
    type: object
    additionalProperties: true
    required:
    - ok
    - target
    - node_id
    - display_name
    - current
    - desired
    - applied
    properties:
      ok:
        type: boolean
      target:
        type: string
      node_id:
        type:
        - string
        - 'null'
      display_name:
        type: string
      current:
        type: string
      desired:
        type: string
      applied:
        type: boolean
