name: web_desktop_runtime_skill
version: 0.1.58
entry: handlers/main.py
runtime:
  python: '3.11'
  activation:
    mode: lazy
    startup_allowed: false
    background_refresh: true
    assessment:
      schema: adaos.skill.activation_assessment.v1
      assessor: builder.compiler
      classification: event_subscriber
      handler_digest: sha256:cb2bd23dc2e5b6691349bc6693d61fd745947ccaa1c30815f8fca679cc6885d9
      observed_subscriptions:
      - economic.subscription.changed
      - root.subscription.changed
      - subscription.usage.changed
      - webio.stream.snapshot.requested
      - webio.stream.subscription.changed
      declared_subscriptions:
      - economic.subscription.changed
      - root.subscription.changed
      - subscription.usage.changed
      - webio.stream.snapshot.requested
      - webio.stream.subscription.changed
      dynamic_subscription_count: 0
      tool_count: 26
      reasons:
      - event_subscriptions_require_early_handler_registration
description: Project-owned runtime actions for opening Web Desktop applications, managing
  Home, and preparing browser, Telegram, and node connection flows.
dependencies:
- httpx>=0.27
memory_budget:
  caches:
  - name: application_cache
    ttl_seconds: 15
    cleanup_hook: handlers.main:_invalidate_application_cache
  - name: prepare_cache
    max_items: 128
    ttl_seconds: 900
    cleanup_hook: handlers.connect:_prune_prepare_cache
data_lifecycle:
  schema: adaos.skill.data_lifecycle.v1
  execution: native_tools
  databases: []
lifecycle:
  drain: web_desktop_runtime_drain
  rehydrate: web_desktop_runtime_rehydrate
  dispose: web_desktop_runtime_dispose
capabilities:
- storage.blob
- workspace.read
- workspace.write
events:
  subscribe:
  - economic.subscription.changed
  - root.subscription.changed
  - subscription.usage.changed
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
  publish:
  - io.out.stream.publish
tools:
- name: web_desktop_runtime_drain
  description: Stop and join System projection workers before runtime replacement.
  entry: handlers.main:web_desktop_runtime_drain
  side_effects: runtime_write
  input_schema:
    type: object
    properties:
      reason:
        type: string
  output_schema:
    type: object
- name: web_desktop_runtime_dispose
  description: Dispose System projection workers and clear transient stream state.
  entry: handlers.main:web_desktop_runtime_dispose
  side_effects: runtime_write
  input_schema:
    type: object
    properties:
      reason:
        type: string
  output_schema:
    type: object
- name: web_desktop_runtime_rehydrate
  description: Re-enable System projection workers after a verified runtime cutover.
  entry: handlers.main:web_desktop_runtime_rehydrate
  side_effects: runtime_write
  input_schema:
    type: object
    properties:
      reason:
        type: string
  output_schema:
    type: object
- name: get_current_builder_application
  description: Read the authorized current Builder selection and related Preview.
  entry: handlers.main:get_current_builder_application
  side_effects: read_only
  permissions:
  - workspace.read
  application_access:
    permission: workspace.read
    capability: desktop.open
  input_schema:
    type: object
    additionalProperties: false
    properties: {}
  output_schema:
    type: object
    additionalProperties: false
    required:
    - status
    - reason
    - title
    - stage
    - revision
    - observed_at
    - freshness
    - builder
    - preview
    properties:
      status:
        enum:
        - ready
        - ambiguous
        - unavailable
      reason:
        type: string
      title:
        type: string
      title_i18n:
        type: object
        additionalProperties: false
        required:
        - key
        properties:
          key:
            type: string
      stage:
        type: string
      revision:
        type: string
      observed_at:
        type:
        - string
        - 'null'
      freshness:
        enum:
        - current
        - unavailable
      builder:
        type: object
        additionalProperties: false
        required:
        - available
        - webspace_id
        properties:
          available:
            type: boolean
          webspace_id:
            type: string
            maxLength: 512
      preview:
        type: object
        additionalProperties: false
        required:
        - available
        - webspace_id
        properties:
          available:
            type: boolean
          webspace_id:
            type: string
            maxLength: 512
