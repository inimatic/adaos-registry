  entry: handlers.main:push_project
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      message:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
- name: publish_project
  description: Validate or publish a DEV project release.
  entry: handlers.main:publish_project
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      bump:
        type: string
        enum:
        - major
        - minor
        - patch
      dry_run:
        type: boolean
      force:
        type: boolean
      webspace_id:
        type: string
  output_schema:
    type: object
- name: update_project
  description: Update one DEV project from Forge through the governed SDK lifecycle.
  entry: handlers.main:update_project
  side_effects: local_write
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: delete_project
  description: Plan or execute governed DEV project deletion with explicit confirmation.
  entry: handlers.main:delete_project
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      confirm:
        type: boolean
      remove_local:
        type: boolean
  output_schema:
    type: object
- name: get_state
  description: Verify the complete Builder SDK capability set.
  entry: handlers.main:get_state
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - schema
    - project
    - checks
data_routes:
- surface: widget:builder.overview.project_state
  route: tool/details
  owner: skill:builder_sdk_control_skill
  tool: get_project
  first_paint: last successful project state remains visible while the selected project
    is revalidated
  recovery: preserve the last value and expose an explicit retry for a failed read
  update_source:
  - update_project_metadata
  - set_workflow_state
  - archive_project
  - create_project
  - update_project
  - delete_project
  - publish_project
  budget:
    max_payload_bytes: 32768
    max_items: 100
  read_policy:
    mode: stale_while_revalidate
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    - state_dependency_changed
    cache_ttl_ms: 60000
    max_request_hz: 0.1
    preserve_last_value: true
    invalidation_tags:
    - builder.project.metadata
    - builder.project.lifecycle
  guard_visibility:
    degraded_state: project state is stale; the last successful value and retry remain
      visible
    log: service.builder_sdk_control_skill.runtime.log
    quarantine: false
    metric: data_route.builder_project_read
- surface: modal:builder.publication.project_status
  route: tool/details
  owner: skill:builder_sdk_control_skill
  tool: get_project
  first_paint: last successful publication project status or a stable skeleton
  recovery: preserve the last value and expose an explicit retry for a failed read
  update_source:
  - set_workflow_state
  - archive_project
  - update_project
  - push_project
  - publish_project
  budget:
    max_payload_bytes: 32768
    max_items: 100
  read_policy:
    mode: cache_first
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    - state_dependency_changed
    cache_ttl_ms: 60000
    max_request_hz: 0.1
    preserve_last_value: true
    invalidation_tags:
    - builder.project.metadata
    - builder.project.lifecycle
    - builder.project.publication
  guard_visibility:
    degraded_state: publication project status is stale; retry is available
    log: service.builder_sdk_control_skill.runtime.log
    quarantine: false
    metric: data_route.builder_publication_project_read
- surface: widgets:builder.project_file_editors
  route: tool/details
  owner: skill:builder_sdk_control_skill
  tool: read_project_file
