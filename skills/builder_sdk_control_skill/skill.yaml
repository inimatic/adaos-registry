  input_schema:
    type: object
    required:
    - text
    properties:
      text:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      iteration_ref:
        type: string
      webspace_id:
        type: string
  output_schema:
