name: builder_sdk_control_skill
version: 0.1.61
description: SDK-only backend for the functional Builder DEV scenario.
entry: handlers/main.py
runtime:
  python: '3.11'
  sdk_only: true
default_tool: get_state
supported_locales:
- en
- ru
dependencies: []
events:
  subscribe: []
  publish:
  - builder.preview.selected
conversation:
  history_policy: node_local
  evidence:
    read: builder_changes
tools:
- name: list_projects
  description: List bounded DEV projects available to Builder.
  entry: handlers.main:list_projects
  side_effects: none
  input_schema:
    type: object
    properties:
      kind:
        type: string
        enum:
        - scenario
        - skill
      query:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 500
      selected_object_type:
        type: string
        enum:
        - scenario
        - skill
      selected_object_id:
        type: string
      webspace_id:
        type: string
      conversation_id:
        type: string
      include_archived:
        type: boolean
        default: false
  output_schema:
    type: array
    items:
      type: object
- name: get_project
  description: Describe one selected DEV project.
  entry: handlers.main:get_project
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: list_project_files
  description: List bounded files belonging to one selected DEV project.
  entry: handlers.main:list_project_files
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      limit:
        type: integer
        minimum: 1
        maximum: 5000
  output_schema:
    type: array
    items:
      type: object
- name: list_project_objects
  description: List a project and its declared skill dependencies.
  entry: handlers.main:list_project_objects
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: array
    items:
      type: object
- name: list_project_file_tree
  description: List bounded files as a nested project tree.
  entry: handlers.main:list_project_file_tree
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      limit:
        type: integer
        minimum: 1
        maximum: 5000
  output_schema:
    type: array
    items:
      type: object
- name: list_templates
  description: List templates available for a DEV project kind.
  entry: handlers.main:list_templates
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
  output_schema:
    type: array
    items:
      type: object
- name: read_project_file
  description: Read one bounded text file from the selected DEV project.
  entry: handlers.main:read_project_file
  side_effects: none
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      max_bytes:
        type: integer
        minimum: 1
        maximum: 1048576
  output_schema:
    type: object
- name: save_project_file
  description: Atomically save one allowlisted DEV project text file.
  entry: handlers.main:save_project_file
  side_effects: local_write
  input_schema:
    type: object
    required:
    - path
    - text
    properties:
      path:
        type: string
        minLength: 1
      text:
        type: string
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      max_bytes:
        type: integer
        minimum: 1
        maximum: 1048576
      webspace_id:
        type: string
  output_schema:
    type: object
- name: get_prompt_context
  description: Read the bounded technical specification and project preferences.
  entry: handlers.main:get_prompt_context
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: save_prompt_context
  description: Atomically save the base technical specification.
  entry: handlers.main:save_prompt_context
  side_effects: local_write
  input_schema:
    type: object
    required:
    - text
    properties:
      text:
        type: string
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: append_prompt_addendum
  description: Append one immutable technical-specification addendum.
  entry: handlers.main:append_prompt_addendum
  side_effects: local_write
  input_schema:
    type: object
    required:
    - text
    properties:
      text:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      iteration_ref:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
- name: get_llm_options
  description: List development LLM options and the selected model.
  entry: handlers.main:get_llm_options
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: set_llm_profile
  description: Persist the selected Builder development LLM.
  entry: handlers.main:set_llm_profile
  side_effects: local_write
  input_schema:
    type: object
    required:
    - model
    properties:
      model:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: update_project_metadata
  description: Update bounded project title and description; project type remains
    immutable.
  entry: handlers.main:update_project_metadata
  side_effects: local_write
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      title:
        type: string
      description:
        type: string
      project_type:
        type: string
  output_schema:
    type: object
- name: set_workflow_state
  description: Compatibility adapter for explicit Builder workflow transitions.
  entry: handlers.main:set_workflow_state
  side_effects: local_write
  input_schema:
    type: object
    required:
    - state
    properties:
      state:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: get_workflow
  description: Read the authoritative Builder workflow state and capabilities.
  entry: handlers.main:get_workflow
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: transition_workflow
  description: Apply one validated Builder workflow transition.
  entry: handlers.main:transition_workflow
  side_effects: local_write
  input_schema:
    type: object
    required:
    - action
    properties:
      action:
        type: string
        enum:
        - stabilize_prototype
        - prototype_revision_recorded
        - handoff_to_automation
        - automation_started
        - automation_iteration_started
        - automation_completed
        - automation_failed
        - request_return_to_prototype
        - return_to_prototype
        - return_to_prototype_failed
        - candidate_prepared
        - candidate_accepted
        - candidate_rejected
        - candidate_stale
        - reconcile_automation
        - reconcile_verification
        - reconcile_publication
        - publish
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      expected_generation:
        type: integer
        minimum: 0
      metadata:
        type: object
  output_schema:
    type: object
- name: get_interaction_frame
  description: Read deterministic context actions with risk and workflow generation.
  entry: handlers.main:get_interaction_frame
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: inspect_process_ref
  description: Inspect a Process item without materializing it in Preview.
  entry: handlers.main:inspect_process_ref
  side_effects: local_write
  input_schema:
    type: object
    required:
    - expected_generation
    properties:
      inspected_ref:
        type:
        - string
        - 'null'
      expected_generation:
        type: integer
        minimum: 0
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: plan_change_set
  description: Project one user request into a bounded executable Builder change set.
  entry: handlers.main:plan_change_set
  side_effects: local_write
  input_schema:
    type: object
    required:
    - request
    - issues
    properties:
      request:
        type: string
        minLength: 1
        maxLength: 4000
      issues:
        type: array
        minItems: 1
        maxItems: 50
        items:
          type: object
          required:
          - title
          - lane
          - acceptance_criteria
          properties:
            issue_id:
              type: string
              minLength: 1
              maxLength: 80
            title:
              type: string
              minLength: 1
              maxLength: 240
            lane:
              type: string
              enum:
              - prototype
              - automation
            acceptance_criteria:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                minLength: 1
                maxLength: 500
      change_set_id:
        type: string
      supersedes_change_set_id:
        type: string
      source_message_ids:
        type: array
        maxItems: 100
        items:
          type: string
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
      expected_generation:
        type: integer
        minimum: 0
  output_schema:
    type: object
- name: add_change_issues
  description: Add follow-up issues to the active Builder change set without replacing
    its history.
  entry: handlers.main:add_change_issues
  side_effects: local_write
  input_schema:
    type: object
    required:
    - request
    - issues
    properties:
      request:
        type: string
        minLength: 1
        maxLength: 4000
      issues:
        type: array
        minItems: 1
        maxItems: 50
        items:
          type: object
          required:
          - title
          - lane
          - acceptance_criteria
          properties:
            issue_id:
              type: string
              minLength: 1
              maxLength: 80
            title:
              type: string
              minLength: 1
              maxLength: 240
            lane:
              type: string
              enum:
              - prototype
              - automation
            acceptance_criteria:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                minLength: 1
                maxLength: 500
      change_set_id:
        type: string
      change_id:
        type: string
      source_message_ids:
        type: array
        maxItems: 100
        items:
          type: string
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
      expected_generation:
        type: integer
        minimum: 0
  output_schema:
    type: object
- name: split_change_issue
  description: Split one ambiguous active Issue into explicit replacement Issues.
  entry: handlers.main:split_change_issue
  side_effects: local_write
  input_schema:
    type: object
    required:
    - issue_id
    - replacement_issues
    properties:
      issue_id:
        type: string
        minLength: 1
      replacement_issues:
        type: array
        minItems: 2
        maxItems: 50
        items:
          type: object
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
      change_id:
        type: string
      expected_generation:
        type: integer
        minimum: 0
  output_schema:
    type: object
- name: merge_change_issues
  description: Merge active Issues into one explicit replacement Issue.
  entry: handlers.main:merge_change_issues
  side_effects: local_write
  input_schema:
    type: object
    required:
    - issue_ids
    - replacement_issue
    properties:
      issue_ids:
        type: array
        minItems: 2
        maxItems: 50
        items:
          type: string
      replacement_issue:
        type: object
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
      change_id:
        type: string
      expected_generation:
        type: integer
        minimum: 0
  output_schema:
    type: object
- name: get_change_set
  description: Read the active Builder change set and its durable evidence.
  entry: handlers.main:get_change_set
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: get_change_context
  description: Inspect bounded Change execution context without raw transcripts or
    secrets.
  entry: handlers.main:get_change_context
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: apply_semantic_ui_change
  description: Apply one source-revision-guarded reversible semantic UI operation.
  entry: handlers.main:apply_semantic_ui_change
  side_effects: local_write
  input_schema:
    type: object
    required:
    - operation_id
    - change_id
    - target_ref
    - source_revision
    - value
    properties:
      operation_id:
        type: string
        minLength: 1
      change_id:
        type: string
        minLength: 1
      target_ref:
        type: string
        pattern: '^(widget|field):'
      source_revision:
        type: string
        minLength: 1
      value: {}
      operation:
        type: string
        enum:
        - rename
        default: rename
      object_type:
        type: string
        enum:
        - scenario
      object_id:
        type: string
        minLength: 1
      review_id:
        type: string
      acceptance:
        type: object
  output_schema:
    type: object
- name: link_dependency_checkpoint
  description: Link one declared immutable dependency checkpoint into the active project
    change set without delivery operations.
  entry: handlers.main:link_dependency_checkpoint
  side_effects: local_write
  input_schema:
    type: object
    required:
    - object_type
    - object_id
    - dependency_type
    - dependency_id
    - checkpoint_change_id
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      dependency_type:
        type: string
        enum:
        - skill
      dependency_id:
        type: string
        minLength: 1
      checkpoint_change_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: register_review_constraint
  description: Compile one structured Review note into a durable acceptance constraint.
  entry: handlers.main:register_review_constraint
  side_effects: local_write
  input_schema:
    type: object
    required:
    - review_id
    - change_id
    - target_ref
    - comment
    - kind
    - expected
    - source_revision
    - object_id
    properties:
      review_id:
        type: string
        minLength: 1
      change_id:
        type: string
        minLength: 1
      target_ref:
        type: string
        pattern: '^(widget|field):'
      comment:
        type: string
        minLength: 1
      kind:
        type: string
        enum:
        - present
        - label_equals
        - property_equals
        - visible
        - order_before
        - data_mode
      expected: {}
      source_revision:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
      object_id:
        type: string
        minLength: 1
      author_ref:
        type: string
      expected_generation:
        type: integer
        minimum: 0
  output_schema:
    type: object
- name: evaluate_review_constraints
  description: Verify active Review constraints against the current declarative UI
    revision.
  entry: handlers.main:evaluate_review_constraints
  side_effects: local_write
  input_schema:
    type: object
    required:
    - object_id
    properties:
      object_type:
        type: string
        enum:
        - scenario
      object_id:
        type: string
        minLength: 1
      revision:
        type: string
      expected_generation:
        type: integer
        minimum: 0
  output_schema:
    type: object
- name: update_change_issue
  description: Update one local issue item in the active Builder change set.
  entry: handlers.main:update_change_issue
  side_effects: local_write
  input_schema:
    type: object
    required:
    - issue_id
    - status
    properties:
      issue_id:
        type: string
        minLength: 1
      status:
        type: string
        enum:
        - open
        - in_progress
        - resolved
        - deferred
      change_set_id:
        type: string
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: archive_project
  description: Archive or restore a DEV project in Builder.
  entry: handlers.main:archive_project
  side_effects: local_write
  input_schema:
    type: object
    properties:
      archived:
        type: boolean
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: select_preview
  description: Select a DEV scenario in its paired preview webspace.
  entry: handlers.main:select_preview
  side_effects: ui_navigation
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: get_preview
  description: Read the current Builder preview binding.
  entry: handlers.main:get_preview
  side_effects: none
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
- name: select_preview_target
  description: Show one explicit Prototype, Automation, or Publication snapshot in
    Preview.
  entry: handlers.main:select_preview_target
  side_effects: ui_navigation
  timeout_seconds: 120
  input_schema:
    type: object
    required:
    - stage
    properties:
      stage:
        type: string
        enum:
        - prototype
        - automation
        - publication
      revision:
        type: string
      follow_active:
        type: boolean
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: list_changes
  description: List Builder Change evidence for a DEV project.
  entry: handlers.main:list_changes
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      limit:
        type: integer
        minimum: 1
        maximum: 200
  output_schema:
    type: array
    items:
      type: object
- name: get_automation
  description: Read Builder Automation state for a DEV project.
  entry: handlers.main:get_automation
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
      conversation_id:
        type: string
  output_schema:
    type: object
- name: get_process
  description: Project dependent Change to Prototype to Implementation to Trial to
    Publication provenance.
  entry: handlers.main:get_process
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: get_process_tree
  description: List dependent Process nodes for collection-tree renderers.
  entry: handlers.main:get_process_tree
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: array
    items:
      type: object
- name: get_lifecycle
  description: Project dependent Prototype to Automation to Publication lineage.
  entry: handlers.main:get_lifecycle
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: array
    maxItems: 1
    items:
      type: object
      required:
      - id
      - kind
      - children
      properties:
        id:
          type: string
        kind:
          const: stage
        children:
          type: array
          maxItems: 5
          items:
            type: object
- name: start_automation
  description: Start Builder Automation from an approved implementation brief.
  entry: handlers.main:start_automation
  side_effects: local_write
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      implementation_brief:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
      conversation_id:
        type: string
      brief_path:
        type: string
  output_schema:
    type: object
- name: submit_automation
  description: Submit one follow-up Builder Automation instruction.
  entry: handlers.main:submit_automation
  side_effects: local_write
  timeout_seconds: 120
  input_schema:
    type: object
    required:
    - text
    properties:
      text:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: return_to_prototype
  description: Use the built-in LLM to derive a safe disconnected Prototype from Automation.
  entry: handlers.main:return_to_prototype
  side_effects: local_write
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: recover_validated_automation
  description: Activate a preserved, committed, and validated Automation result after
    a retryable post-commit failure without assigning Codex again.
  entry: handlers.main:recover_validated_automation
  side_effects: local_write
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: reconcile_automation_checkpoint
  description: Reconcile failed paired Forge checkpoints with the original change
    identity when a partial commit already exists, without assigning Codex again.
  entry: handlers.main:reconcile_automation_checkpoint
  side_effects: external_write
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: get_subscription_update
  description: Inspect the selected project's stable subscription and deterministic
    update plan.
  entry: handlers.main:get_subscription_update
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: apply_subscription_update
  description: Apply exactly one reviewed package update with transactional runtime
    verification.
  entry: handlers.main:apply_subscription_update
  side_effects: external_write
  timeout_seconds: 180
  input_schema:
    type: object
    required:
    - expected_plan_digest
    properties:
      expected_plan_digest:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      approve_permissions:
        type: boolean
        default: false
      webspace_id:
        type: string
      idempotency_key:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: create_project
  description: Create a new DEV skill or scenario from a template.
  entry: handlers.main:create_project
  side_effects: local_write
  input_schema:
    type: object
    required:
    - object_type
    - object_id
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      template:
        type: string
      webspace_id:
        type: string
      conversation_id:
        type: string
  output_schema:
    type: object
- name: push_project
  description: Checkpoint a DEV project as an exact Forge revision and immutable package.
  entry: handlers.main:push_project
  side_effects: local_write
  timeout_seconds: 120
  input_schema:
    type: object
    required:
    - checkpoint_id
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      message:
        type: string
      checkpoint_id:
        type: string
        minLength: 1
        description: Caller-assigned immutable identity for this checkpoint operation.
      webspace_id:
        type: string
  output_schema:
    type: object
- name: publish_project
  description: Prepare an isolated candidate trial or explicitly accept and promote
    it.
  entry: handlers.main:publish_project
  side_effects: external_write
  timeout_seconds: 180
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      bump:
        type: string
        enum:
        - major
        - minor
        - patch
      dry_run:
        type: boolean
      force:
        type: boolean
      confirmed:
        type: boolean
        description: Explicit user confirmation for Trial activation or Publication.
      webspace_id:
        type: string
  output_schema:
    type: object
- name: delete_project
  description: Plan or execute governed DEV project deletion with explicit confirmation.
  entry: handlers.main:delete_project
  side_effects: external_write
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      confirm:
        type: boolean
      remove_local:
        type: boolean
  output_schema:
    type: object
- name: get_state
  description: Verify the complete Builder SDK capability set.
  entry: handlers.main:get_state
  side_effects: none
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - schema
    - project
    - checks
- name: get_development_session
  description: Read the least-write Development Session currently bound to this Builder
    host.
  entry: handlers.main:get_development_session
  side_effects: none
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - bound
    - content
- name: review_development_changes
  description: Reject changed paths outside the bound Development Session write scope,
    including read-only artifact inputs.
  entry: handlers.main:review_development_changes
  side_effects: none
  input_schema:
    type: object
    required:
    - paths
    properties:
      paths:
        type: array
        minItems: 1
        maxItems: 5000
        items:
          type: string
          minLength: 1
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - session_id
    - admitted
    - violations
- name: request_development_scope
  description: Record a human-reviewable request for one extra skill or scenario target
    without granting access.
  entry: handlers.main:request_development_scope
  side_effects: local_write
  input_schema:
    type: object
    required:
    - target_ref
    - reason
    properties:
      target_ref:
        type: string
        pattern: '^(skill|scenario):'
      reason:
        type: string
        minLength: 1
      webspace_id:
        type: string
      actor:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - approved
    - request
- name: get_skill_preview
  description: Describe the skill selected by the paired Builder host for the generic
    preview scenario.
  entry: handlers.main:get_skill_preview
  side_effects: none
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - selected
    - content
