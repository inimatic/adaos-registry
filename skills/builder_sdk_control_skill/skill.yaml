  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: get_lifecycle
  description: Project Builder lifecycle with bounded automation results and durable
