  first_paint: selected skill metadata or an explicit empty state
  recovery: return to Builder and select a skill
  budget:
    max_payload_bytes: 524288
    max_items: 1
  read_policy:
    mode: cache_first
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
