  entry: handlers.main:get_lifecycle
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: array
    maxItems: 3
    items:
      type: object
      required:
      - id
      - kind
      - children
      properties:
        id:
          type: string
        kind:
          const: stage
        children:
          type: array
          maxItems: 5
