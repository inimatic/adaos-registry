      implementation_brief:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
      conversation_id:
        type: string
      brief_path:
        type: string
