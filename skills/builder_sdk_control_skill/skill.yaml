name: builder_sdk_control_skill
version: 0.0.2
description: SDK-only backend for the functional Builder DEV scenario.
entry: handlers/main.py
runtime:
  python: '3.11'
  sdk_only: true
default_tool: get_state
supported_locales:
- en
- ru
dependencies: []
events:
  subscribe: []
  publish:
  - builder.preview.selected
conversation:
  history_policy: node_local
  evidence:
    read: builder_changes
tools:
- name: list_projects
  description: List bounded DEV projects available to Builder.
  entry: handlers.main:list_projects
  input_schema:
    type: object
    properties:
      kind:
        type: string
        enum:
        - scenario
        - skill
      query:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 500
      selected_object_type:
        type: string
        enum:
        - scenario
        - skill
      selected_object_id:
        type: string
      webspace_id:
        type: string
      include_archived:
        type: boolean
        default: false
  output_schema:
    type: array
    items:
      type: object
- name: get_project
  description: Describe one selected DEV project.
  entry: handlers.main:get_project
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: list_project_files
  description: List bounded files belonging to one selected DEV project.
  entry: handlers.main:list_project_files
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      limit:
        type: integer
        minimum: 1
        maximum: 5000
  output_schema:
    type: array
    items:
      type: object
- name: list_project_objects
  description: List a project and its declared skill dependencies.
  entry: handlers.main:list_project_objects
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: array
    items:
      type: object
- name: list_project_file_tree
  description: List bounded files as a nested project tree.
  entry: handlers.main:list_project_file_tree
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      limit:
        type: integer
        minimum: 1
        maximum: 5000
  output_schema:
    type: array
    items:
      type: object
- name: list_templates
  description: List templates available for a DEV project kind.
  entry: handlers.main:list_templates
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
  output_schema:
    type: array
    items:
      type: object
- name: read_project_file
  description: Read one bounded text file from the selected DEV project.
  entry: handlers.main:read_project_file
  input_schema:
    type: object
    required:
    - path
    properties:
      path:
        type: string
        minLength: 1
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      max_bytes:
        type: integer
        minimum: 1
        maximum: 1048576
  output_schema:
    type: object
- name: save_project_file
  description: Atomically save one allowlisted DEV project text file.
  entry: handlers.main:save_project_file
  side_effects: local_write
  input_schema:
    type: object
    required:
    - path
    - text
    properties:
      path:
        type: string
        minLength: 1
      text:
        type: string
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      max_bytes:
        type: integer
        minimum: 1
        maximum: 1048576
      webspace_id:
        type: string
  output_schema:
    type: object
- name: get_prompt_context
  description: Read the bounded technical specification and project preferences.
  entry: handlers.main:get_prompt_context
  input_schema:
    type: object
    properties:
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
  output_schema:
    type: object
- name: save_prompt_context
  description: Atomically save the base technical specification.
  entry: handlers.main:save_prompt_context
  side_effects: local_write
  input_schema:
    type: object
    required:
    - text
    properties:
      text:
        type: string
      object_type:
        type: string
        enum:
        - scenario
        - skill
      object_id:
        type: string
        minLength: 1
      webspace_id:
        type: string
  output_schema:
    type: object
- name: append_prompt_addendum
  description: Append one immutable technical-specification addendum.
