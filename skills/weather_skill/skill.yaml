name: weather_skill
version: 2.6.23
description: Standalone SDK weather skill with Open-Meteo forecasts, browser location,
  declarative actions and subnet projections.
runtime:
  python: '3.11'
dependencies:
- requests>=2.31
llm_policy:
  autoapply_nlu_teacher: true
events:
  subscribe:
  - nlp.intent.weather.get
  - weather.location.requested
  - weather.city_changed
  publish:
  - ui.notify
  - io.out.chat.append
data_projections:
- scope: subnet
  slot: weather.snapshot
  targets:
  - backend: yjs
    path: data/weather
memory_budget:
  expected_rss_mb: 64
  caches:
  - name: city_cache
    max_items: 128
    ttl_seconds: 300
    cleanup_hook: dispose
  - name: geocode_cache
    max_items: 512
    ttl_seconds: 86400
    cleanup_hook: dispose
lifecycle:
  dispose: dispose
default_tool: get_weather
tools:
- name: get_weather
  description: Resolve current weather and forecast for a city or browser-provided
    coordinates.
  entry: handlers.main:get_weather
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      city:
        type: string
        minLength: 1
      latitude:
        type: number
      longitude:
        type: number
      location:
        type: object
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      city:
        type: string
      temp:
        type: number
      description:
        type: string
      current:
        type: object
      hourly_chart:
        type: object
      daily:
        type: array
      error:
        type: string
- name: get_snapshot
  description: Return the current weather widget snapshot for the selected webspace.
  entry: handlers.main:get_snapshot
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      city:
        type: string
      webspace_id:
        type: string
      target_node_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      current:
        type: object
      weather:
        type: object
- name: dispose
  description: Release bounded in-process weather caches before deactivation.
  entry: handlers.main:dispose
  input_schema:
    type: object
    properties: {}
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
nlu:
  intents:
    weather.current:
      examples:
      - какая погода
      - какая погода в Берлине
      - погода в Москве
      - weather in London
      actions:
      - type: skillTool
        skill: weather_skill
        tool: get_weather
        target: weather_skill.get_weather
        params:
          city: $slot.city
  regex_rules:
  - id: rx.1768305525282
    created_at: 1768305525.282357
    intent: weather.current
    pattern: \bпомерить\s+температуру\s+в\s+(?P<city>[^?.!,;:]+)\b
    enabled: true
    source: teacher
    candidate_id: cand.1768305403150
  - id: rx.655bf395-a748-4bf0-b1b2-5213f62daab8
    created_at: 1768330400.5334976
    intent: weather.current
    pattern: \bкакая\s+температура\s+в\s+(?P<city>[^?.!,;:]+)\b
    enabled: true
    source: teacher
    candidate_id: cand.1768330399036
