name: research_evaluator_skill
version: 0.1.42
description: Independent, contamination-aware evaluator for AdaOS research-compilation
  calibrations.
supported_locales:
- en
- ru
entry: handlers/main.py
default_tool: summarize_calibration
runtime:
  python: '3.11'
dependencies: []
capabilities:
- storage.relational
- storage.blob
- skills.invoke
- builder.project_sources
- builder.project_validation
lifecycle:
  after_activate:
  - tool: ensure_schema
exports:
  tools:
  - ensure_schema
  - freeze_calibration
  - derive_compact_calibration
  - get_task
  - get_calibration_lineage
  - prepare_calibration_arm
  - prepare_calibration_suite
  - record_calibration_result
  - evaluate_builder_attempt
  - summarize_calibration
  - export_calibration_package
tools:
- name: derive_compact_calibration
  description: Derive compact digest-linked developer inputs and freeze an environment-controlled,
    counterbalanced v1.9 C0/C3 calibration with bounded workload, a frozen consumer
    ABI, source-bound paired execution, and a hidden scientific implementation probe.
  entry: handlers.main:derive_compact_calibration
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - baseline_task_id
    - task_id
    - core_commit
    - python_version
    - platform
    - model
    - skill_workspace_commit
    - orchestrator_version
    - evaluator_version
    - runner_version
    - manager_version
    properties:
      baseline_task_id:
        type: string
      task_id:
        type: string
      core_commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      python_version:
        type: string
      platform:
        type: string
      model:
        type: string
      skill_workspace_commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      orchestrator_version:
        type: string
      evaluator_version:
        type: string
      runner_version:
        type: string
      manager_version:
        type: string
      source_direction_id:
        description: Optional accepted ResearchDirection whose exact Compilation and
          AutomationBrief replace the baseline task contracts.
        type:
        - string
        - 'null'
      source_task_id:
        description: Optional accepted ResearchTask selected inside source_direction_id.
        type:
        - string
        - 'null'
      standard_prompt_version:
        type: string
        default: adaos-skill-realization/0.8.0
      reasoning_effort:
        enum:
        - low
        - medium
        - high
        - xhigh
        default: high
      attempts_per_arm:
        type: integer
        minimum: 5
        maximum: 100
        default: 5
      paired_seeds:
        type: array
        minItems: 5
        uniqueItems: true
        items:
          type: integer
      max_model_tokens:
        type: integer
        minimum: 1
        default: 5000000
      max_wall_seconds:
        type: integer
        minimum: 60
        maximum: 86400
        default: 10800
      minimum_free_disk_bytes:
        description: Minimum free bytes required on the candidate-runtime volume before
          any model execution begins.
        type: integer
        minimum: 1073741824
        default: 17179869184
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - task_id
    - task_digest
    - task
    - projection_receipt
- name: ensure_schema
  description: Ensure the owner-scoped independent evaluation ledger and report its
    binding.
  entry: handlers.main:ensure_schema
  side_effect_class: local_write
  input_schema:
    type: object
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - binding
    - health
- name: freeze_calibration
  description: Validate and freeze an immutable C0-C4 calibration task with visible
    and hidden inputs.
  entry: handlers.main:freeze_calibration
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - task
    properties:
      task:
        type: object
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - task
    - task_id
    - task_digest
    - message
- name: get_task
  description: Read the public projection of a frozen calibration task without hidden
    evaluator paths.
  entry: handlers.main:get_task
  side_effect_class: none
  input_schema:
    type: object
    required:
    - task_id
    properties:
      task_id:
        type: string
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - task
    - runtime_identity
- name: get_calibration_lineage
  description: Return a path-free immutable task, packet, candidate, result, and summary
    lineage for an authorized research-domain importer.
  entry: handlers.main:get_calibration_lineage
  side_effect_class: none
  input_schema:
    type: object
    required:
    - task_id
    properties:
      task_id:
        type: string
      budget_view:
        enum:
        - fixed_downstream
        - fixed_total_system
        default: fixed_downstream
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - task
    - packets
    - results
    - summary
    - runtime_identity
- name: prepare_calibration_arm
  description: Materialize a digest-bound, contamination-checked input packet for
    one paired attempt.
  entry: handlers.main:prepare_calibration_arm
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - task_id
    - arm_id
    - attempt_index
    properties:
      task_id:
        type: string
      arm_id:
        enum:
        - C0_raw
        - C1_reviewed_prose
        - C2_staged
        - C3_typed_execution
        - C4_over_specified
      attempt_index:
        type: integer
        minimum: 1
      budget_view:
        enum:
        - fixed_downstream
        - fixed_total_system
        default: fixed_downstream
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - packet
- name: prepare_calibration_suite
  description: Materialize all paired C0-C4 packets for one preregistered budget view
    and return their immutable identities.
  entry: handlers.main:prepare_calibration_suite
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - task_id
    properties:
      task_id:
        type: string
      budget_view:
        enum:
        - fixed_downstream
        - fixed_total_system
        default: fixed_downstream
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - task_id
    - task_digest
    - budget_view
    - count
    - packets
- name: record_calibration_result
  description: Independently score and persist a candidate against every frozen mandatory
    check.
  entry: handlers.main:record_calibration_result
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - task_id
    - candidate
    properties:
      task_id:
        type: string
      candidate:
        type: object
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - result
    - evidence_valid_completion
- name: evaluate_builder_attempt
  description: Run the hidden deterministic judge over one terminal isolated Builder
    candidate.
  entry: handlers.main:evaluate_builder_attempt
  side_effect_class: local_write
  timeout_seconds: 3600
  input_schema:
    type: object
    required:
    - task_id
    - arm_id
    - attempt_index
    - candidate_id
    - development_session_id
    - builder_webspace_id
    properties:
      task_id:
        type: string
      arm_id:
        enum:
        - C0_raw
        - C1_reviewed_prose
        - C2_staged
        - C3_typed_execution
        - C4_over_specified
      attempt_index:
        type: integer
        minimum: 1
      candidate_id:
        type: string
      development_session_id:
        type: string
      builder_webspace_id:
        type: string
      budget_view:
        enum:
        - fixed_downstream
        - fixed_total_system
        default: fixed_downstream
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - ready
- name: summarize_calibration
  description: Report per-arm evidence-valid completion, uncertainty, cost, and failure
    attribution.
  entry: handlers.main:summarize_calibration
  side_effect_class: none
  input_schema:
    type: object
    required:
    - task_id
    properties:
      task_id:
        type: string
      budget_view:
        enum:
        - fixed_downstream
        - fixed_total_system
        default: fixed_downstream
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - summary
    - content
- name: export_calibration_package
  description: Export the frozen task, packets, immutable results, and recomputed
    summary as one content-addressed package.
  entry: handlers.main:export_calibration_package
  side_effect_class: local_write
  input_schema:
    type: object
    required:
    - task_id
    properties:
      task_id:
        type: string
      budget_view:
        enum:
        - fixed_downstream
        - fixed_total_system
        default: fixed_downstream
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - task_id
    - package_digest
    - summary_digest
    - packet_count
    - result_count
    - content_ref
data_routes:
- surface: frozen calibration protocol
  route: skill-local
  path: research_evaluator.calibration_tasks
  owner: skill:research_evaluator_skill
  first_paint: empty task list
  recovery: restore the owner-scoped relational binding from a verified backup
  guard_visibility: hidden inputs are omitted from public tool projections and never
    enter arm packets
  budget:
    max_payload_bytes: 1048576
- surface: arm packets and independent results
  route: skill-local
  path: research_evaluator.calibration_packets+calibration_results
  owner: skill:research_evaluator_skill
  first_paint: empty evaluation ledger
  recovery: rematerialize packets from the frozen task; rerun evaluation only under
    preregistered exclusions
  guard_visibility: packet construction fails when a hidden id, ref, or path leaks
    into candidate context
  budget:
    max_payload_bytes: 4194304
