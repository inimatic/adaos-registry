name: media_library_agent
version: 0.6.18
description: Distributed node-local media discovery and bounded rendition agent with durable jobs and ordered catalog deltas.
supported_locales:
- en
- ru
runtime:
  kind: service
  python: '3.11'
  env:
    mode: venv
service:
  host: 127.0.0.1
  port: 18106
  command:
  - -m
  - handlers.service
  healthcheck:
    path: /health
    timeout_ms: 5000
  membership:
    enabled: true
    group_id: media-library-home
    lease_seconds: 600
    protocol_version: '1'
    capabilities:
    - media.catalog
    endpoints:
    - endpoint_id: catalog
      protocol: adaos.skill.v1
      address_ref: skill://{node_id}/{skill}/catalog
      scopes:
      - media.read
      metadata: {}
capabilities:
- media.catalog
- media.rendition
dependencies: []
events:
  subscribe:
  - sys.ready
  - webio.stream.snapshot.requested
  publish:
  - io.out.stream.publish
  - media_library_agent.catalog.changed
lifecycle:
  after_activate: ensure_schema
  rehydrate: rehydrate
  dispose: dispose
default_tool: status
exports:
  tools:
  - ensure_schema
  - rehydrate
  - add_root
  - remove_root
  - list_roots
  - start_scan
  - import_folder
  - scan_status
  - list_jobs
  - cancel_scan
  - pull_deltas
  - browse_folders
  - configure_schedule
  - set_resource_pressure
  - inspect_source
  - search_sources
  - plan_rendition
  - rendition_status
  - list_rendition_jobs
  - cancel_rendition
  - status
  - observe_topology
  - distributed_topology_phase
  - distributed_topology_transfer
  - dispose
tools:
- name: ensure_schema
  entry: handlers.main:ensure_schema
  description: Ensure the durable agent schema.
  side_effects: local_write
  input_schema: {type: object, additionalProperties: true}
  output_schema: {type: object}
- name: rehydrate
  entry: handlers.main:rehydrate
  description: Resume queued agent work after activation.
  side_effects: local_write
  input_schema: {type: object, additionalProperties: true}
  output_schema: {type: object}
- name: add_root
  entry: handlers.main:add_root
  description: Add a node-local media root without copying media bytes.
  side_effects: local_write
  input_schema:
    type: object
    required: [path]
    properties:
      path: {type: string, minLength: 1}
      label: {type: string}
      include_images: {type: boolean, default: false}
      follow_symlinks: {type: boolean, default: false}
      exclusions:
        type: array
        maxItems: 64
        items: {type: string, maxLength: 300}
      scan_window: {type: object}
    additionalProperties: true
  output_schema: {type: object}
- name: remove_root
  entry: handlers.main:remove_root
  description: Disable a root while retaining its external files and indexed evidence.
  side_effects: local_write
  input_schema:
    type: object
    required: [root_id]
    properties:
      root_id: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: list_roots
  entry: handlers.main:list_roots
  description: List roots owned by this node agent.
  side_effects: none
  input_schema:
    type: object
    properties:
      include_disabled: {type: boolean, default: false}
    additionalProperties: true
  output_schema: {type: object}
- name: start_scan
  entry: handlers.main:start_scan
  description: Queue incremental root scans and return durable job identifiers immediately.
  side_effects: local_write
  timeout_seconds: 15
  input_schema:
    type: object
    properties:
      root_id: {type: string}
      mode: {type: string, enum: [incremental, reconcile, full], default: incremental}
      webspace_id: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: import_folder
  entry: handlers.main:import_folder
  description: Add a folder and queue its first asynchronous in-place scan.
  side_effects: local_write
  timeout_seconds: 15
  input_schema:
    type: object
    required: [path]
    properties:
      path: {type: string, minLength: 1}
      label: {type: string}
      include_images: {type: boolean, default: false}
      follow_symlinks: {type: boolean, default: false}
      exclusions:
        type: array
        maxItems: 64
        items: {type: string, maxLength: 300}
      scan_window: {type: object}
      webspace_id: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: scan_status
  entry: handlers.main:scan_status
  description: Return one bounded durable scan progress record.
  side_effects: none
  input_schema:
    type: object
    required: [job_id]
    properties:
      job_id: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: list_jobs
  entry: handlers.main:list_jobs
  description: List recent bounded scan jobs.
  side_effects: none
  input_schema:
    type: object
    properties:
      root_id: {type: string}
      limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    additionalProperties: true
  output_schema: {type: object}
- name: cancel_scan
  entry: handlers.main:cancel_scan
  description: Cooperatively cancel one scan.
  side_effects: local_write
  input_schema:
    type: object
    required: [job_id]
    properties:
      job_id: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: pull_deltas
  entry: handlers.main:pull_deltas
  description: Pull ordered idempotent source deltas through an opaque cursor.
  side_effects: none
  input_schema:
    type: object
    properties:
      cursor: {type: string}
      root_id: {type: string}
      limit: {type: integer, minimum: 1, maximum: 1000, default: 250}
    additionalProperties: true
  output_schema: {type: object}
- name: browse_folders
  entry: handlers.main:browse_folders
  description: Browse indexed folder hierarchy.
  side_effects: none
  input_schema:
    type: object
    properties:
      root_id: {type: string}
      parent: {type: string}
      limit: {type: integer, minimum: 1, maximum: 500, default: 100}
      cursor: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: configure_schedule
  entry: handlers.main:configure_schedule
  description: Configure periodic root reconciliation.
  side_effects: local_write
  input_schema:
    type: object
    required: [root_id]
    properties:
      root_id: {type: string}
      enabled: {type: boolean, default: true}
      interval_seconds: {type: integer, minimum: 300, maximum: 604800, default: 21600}
      debounce_seconds: {type: integer, minimum: 1, maximum: 3600, default: 30}
      watch_enabled: {type: boolean, default: false}
      watch_poll_seconds: {type: integer, minimum: 5, maximum: 3600, default: 30}
    additionalProperties: true
  output_schema: {type: object}
- name: set_resource_pressure
  entry: handlers.main:set_resource_pressure
  description: Pause or resume background scans according to playback pressure.
  side_effects: local_write
  input_schema:
    type: object
    required: [level]
    properties:
      level: {type: string, enum: [normal, playback, critical]}
    additionalProperties: true
  output_schema: {type: object}
- name: inspect_source
  entry: handlers.main:inspect_source
  description: Inspect one source descriptor without reading media bytes.
  side_effects: none
  input_schema:
    type: object
    required: [source_id]
    properties:
      source_id: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: search_sources
  entry: handlers.main:search_sources
  description: Search one node-local shard including technical metadata.
  side_effects: none
  input_schema:
    type: object
    required: [query]
    properties:
      query: {type: string, minLength: 1, maxLength: 500}
      limit: {type: integer, minimum: 1, maximum: 100, default: 30}
      cursor: {type: string}
    additionalProperties: true
  output_schema: {type: object}
- name: plan_rendition
  entry: handlers.main:plan_rendition
  description: Plan and queue a bounded browser-compatible derived rendition when required.
  side_effects: local_write
  timeout_seconds: 15
  input_schema:
    type: object
    required: [source_id]
    properties:
      source_id: {type: string, minLength: 1}
      endpoint_capabilities: {type: object}
      profile: {type: string, default: browser-mp4-v1}
      priority: {type: integer, minimum: 0, maximum: 1000, default: 50}
      force: {type: boolean, default: false}
    additionalProperties: true
  output_schema: {type: object}
- name: rendition_status
  entry: handlers.main:rendition_status
  description: Return one bounded durable rendition job.
  side_effects: none
  input_schema:
    type: object
    required: [job_id]
    properties:
      job_id: {type: string, minLength: 1}
    additionalProperties: true
  output_schema: {type: object}
- name: list_rendition_jobs
  entry: handlers.main:list_rendition_jobs
  description: List recent bounded rendition jobs.
  side_effects: none
  input_schema:
    type: object
    properties:
      source_id: {type: string}
      limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    additionalProperties: true
  output_schema: {type: object}
- name: cancel_rendition
  entry: handlers.main:cancel_rendition
  description: Cooperatively cancel one queued or running rendition.
  side_effects: local_write
  input_schema:
    type: object
    required: [job_id]
    properties:
      job_id: {type: string, minLength: 1}
    additionalProperties: true
  output_schema: {type: object}
- name: status
  entry: handlers.main:status
  description: Return compact agent health, progress, and capacity.
  side_effects: none
  input_schema: {type: object, additionalProperties: true}
  output_schema: {type: object}
- name: observe_topology
  entry: handlers.main:observe_topology
  description: Validate and report one node-local partition replica to the authority plane.
  side_effects: none
  input_schema:
    type: object
    required: [partition, replica]
    properties:
      partition: {type: object}
      replica: {type: object}
    additionalProperties: true
  output_schema: {type: object}
- name: distributed_topology_phase
  entry: handlers.main:distributed_topology_phase
  description: Execute one reviewed idempotent topology adapter phase.
  side_effects: local_write
  timeout_seconds: 600
  input_schema:
    type: object
    required: [schema, target_node_id, selected_instance_id, operation_id, plan_digest, plan, phase, authority_epoch, idempotency_key, step, dataset, partition]
    properties:
      schema: {const: adaos.distributed.topology_phase_request.v1}
      target_node_id: {type: string}
      selected_instance_id: {type: string}
      operation_id: {type: string}
      plan_digest: {type: string}
      plan: {type: object}
      phase: {type: string}
      authority_epoch: {type: integer, minimum: 0}
      idempotency_key: {type: string, minLength: 1}
      step: {type: object}
      dataset: {type: object}
      partition: {type: object}
    additionalProperties: true
  output_schema: {type: object}
- name: distributed_topology_transfer
  entry: handlers.main:distributed_topology_transfer
  description: Read or write one bounded reviewed derived-catalog transfer chunk.
  side_effects: local_write
  timeout_seconds: 600
  input_schema:
    type: object
    required: [schema, target_node_id, selected_instance_id, operation_id, plan_digest, plan, direction, authority_epoch, idempotency_key, transfer_id, manifest, step, dataset, partition]
    properties:
      schema: {const: adaos.distributed.topology_transfer_request.v1}
      target_node_id: {type: string}
      selected_instance_id: {type: string}
      operation_id: {type: string}
      plan_digest: {type: string}
      plan: {type: object}
      direction: {enum: [read, write]}
      authority_epoch: {type: integer, minimum: 0}
      idempotency_key: {type: string, minLength: 1}
      transfer_id: {type: string, minLength: 1}
      manifest: {type: object}
      step: {type: object}
      dataset: {type: object}
      partition: {type: object}
    additionalProperties: true
  output_schema: {type: object}
- name: dispose
  entry: handlers.main:dispose
  description: Stop process-local background workers.
  side_effects: local_write
  input_schema: {type: object, additionalProperties: true}
  output_schema: {type: object}
data_routes:
- surface: widget:media-library-agent-status
  route: tool/details
  tool: status
  owner: skill:media_library_agent
  first_paint: bounded local agent health, capacity, schedules, and pressure
  recovery: repeat status after scan or pressure invalidation
  guard_visibility: aggregate counts and limits; no configured root paths
  budget: {max_payload_bytes: 131072, snapshot_policy: manual}
  read_policy:
    mode: explicit
    triggers: [mount, explicit_refresh, targeted_invalidation]
    cache_ttl_ms: 1000
    max_request_hz: 1
    preserve_last_value: true
    invalidation_tags: [media_center.agent]
- surface: modal:media-center-settings
  route: stream
  receiver: media_library_agent.progress
  owner: skill:media_library_agent
  first_paint: idle scan progress
  recovery: scan_status reads the durable job snapshot after reconnect
  update_source:
  - media_library_agent.worker
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 16384
    max_publish_hz: 2
    max_items: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: preserve the last progress value and mark it stale
    log: skill:media_library_agent.runtime
    quarantine: false
- surface: media-library-agent store
  route: skill-local
  path: data/db/media_library_agent.sqlite3
  owner: skill:media_library_agent
  first_paint: empty root and scan registry
  recovery: WAL recovery and queued job rehydration
  guard_visibility: only public bounded tools expose metadata; media bytes remain external
  budget:
    max_payload_bytes: 1048576
- surface: modal:media-center-renditions
  route: stream
  receiver: media_library_agent.rendition_progress
  owner: skill:media_library_agent
  first_paint: latest bounded rendition job or idle
  recovery: rendition_status reads the durable job after reconnect
  update_source:
  - media_library_agent.worker
  - webio.stream.snapshot.requested
  budget:
    max_payload_bytes: 32768
    max_publish_hz: 2
    max_items: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: preserve the last rendition value and mark it stale
    log: skill:media_library_agent.runtime
    quarantine: false
memory_budget:
  expected_rss_mb: 128
  background_workers:
    max_threads: 1
    cleanup_hook: dispose
  caches:
  - name: scan_batch
    route: process
    max_items: 100
    cleanup_hook: dispose
  - name: rendition_jobs
    route: skill-local
    max_items: 100
    cleanup_hook: dispose
llm_hints:
  description: Node-local asynchronous media discovery agent used by the Media Center coordinator.
  aliases: [media library agent, media scanner]
  primary_actions:
  - id: media_library_agent.import_folder
    intent: media_center.import_folder
    tool: import_folder
    side_effect_class: local_write
  - id: media_library_agent.start_scan
    intent: media_center.scan
    tool: start_scan
    side_effect_class: local_write
updated_at: '2026-08-20T00:00:00+00:00'
