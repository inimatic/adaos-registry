name: slideshow_skill
version: 0.1.64
description: Slideshow pilot skill that shows photos in the widget and can optionally
  project cached thumbnails to assigned ReDevice endpoints.
supported_locales:
- en
- ru
webui_owner: shared
runtime:
  type: python
  kind: service
  module: handlers.main
  env:
    mode: venv
service:
  host: 127.0.0.1
  port: 18104
  command:
  - -m
  - handlers.service
  healthcheck:
    path: /health
    timeout_ms: 1000
dependencies:
- pillow>=10.0.0
lifecycle:
  after_activate: activate_slideshow_runtime
  rehydrate: activate_slideshow_runtime
events:
  subscribe:
  - sys.ready
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
tools:
- name: activate_slideshow_runtime
  description: Rehydrate slideshow background polling after skill activation.
  entry: handlers.main:activate_slideshow_runtime
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      polling:
        type: boolean
      selected_codes:
        type: array
        items:
          type: string
- name: list_slideshow_photos
  description: List source photos that can be shown in the widget or sent to a ReDevice
    slideshow endpoint.
  entry: handlers.main:list_slideshow_photos
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      source_dir:
        type: string
        description: Root folder with source photos.
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      source_dir:
        type: string
      count:
        type: integer
      items:
        type: array
        items:
          type: object
- name: set_slideshow_source
  description: Persist the slideshow source folder in skill memory and refresh visible
    session/index state without starting a scan.
  entry: handlers.main:set_slideshow_source
  input_schema:
    type: object
    required:
    - source_dir
    properties:
      source_dir:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      source_dir:
        type: string
      index:
        type: object
      status:
        type: object
- name: get_slideshow_index_status
  description: Publish and return the current background photo index status.
  entry: handlers.main:get_slideshow_index_status
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      source_dir:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - status
    properties:
      ok:
        type: boolean
      status:
        type: string
      source_dir:
        type: string
      indexed_count:
        type: integer
      visited_files:
        type: integer
- name: get_slideshow_folders
  description: Publish and return the current top-level slideshow folder snapshot.
  entry: handlers.main:get_slideshow_folders
  side_effects: read_only
  side_effect_class: read_only
  input_schema:
    type: object
    properties:
      source_dir:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      source_dir:
        type: string
      selected_folder:
        type: string
      items:
        type: array
        items:
          type: object
- name: start_redevice_slideshow
  description: Start slideshow playback in the widget and queue a display.render_surface
    command when a ReDevice endpoint is selected.
  entry: handlers.main:start_redevice_slideshow
  input_schema:
    type: object
    properties:
      code:
        type: string
        description: Optional ReDevice pair code. The first admitted endpoint is used
          when omitted.
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 10
      webspace_id:
        type: string
      source_dir:
        type: string
        description: Root folder with source photos.
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      error:
        type: string
      command_id:
        type: string
      source_dir:
        type: string
      device:
        type: object
      items:
        type: array
        items:
          type: object
- name: select_redevice_endpoint
  description: Select a ReDevice endpoint for the slideshow modal and publish visible
    selection state.
  entry: handlers.main:select_redevice_endpoint
  input_schema:
    type: object
    properties:
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
        description: Root folder with source photos.
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      selected_device_code:
        type: string
      selected_items:
        type: array
        items:
          type: object
      items:
        type: array
        items:
          type: object
- name: refresh_slideshow_photo_index
  description: Start or resume a background photo index refresh for the selected root
    folder while preserving favorites until a full scan succeeds.
  entry: handlers.main:refresh_slideshow_photo_index
  input_schema:
    type: object
    properties:
      source_dir:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      source_dir:
        type: string
      count:
        type: integer
      index:
        type: object
- name: cancel_slideshow_photo_index
  description: Ask the background photo indexer to stop after the current batch.
  entry: handlers.main:cancel_slideshow_photo_index
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - status
    properties:
      ok:
        type: boolean
      status:
        type: string
- name: select_slideshow_folder
  description: Select a top-level indexed folder as the current slideshow scope.
  entry: handlers.main:select_slideshow_folder
  input_schema:
    type: object
    properties:
      folder:
        type: string
      source_dir:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      selected_folder:
        type: string
- name: toggle_redevice_endpoint
  description: Add or remove a ReDevice endpoint from the slideshow sync group.
  entry: handlers.main:toggle_redevice_endpoint
  input_schema:
    type: object
    properties:
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      selected_codes:
        type: array
        items:
          type: string
- name: control_redevice_slideshow
  description: Control the shared slideshow state for the widget and broadcast it
    to selected ReDevice endpoints when present.
  entry: handlers.main:control_redevice_slideshow
  input_schema:
    type: object
    required:
    - action
    properties:
      action:
        type: string
        enum:
        - start
        - prev
        - next
        - fav
        - favorite_on
        - favorite_off
        - hide
        - send_telegram
        - sync_on
        - sync_off
        - interval_3000
        - interval_5000
        - interval_7000
        - interval_15000
        - interval_30000
        - set_interval
        - cache_folder
        - random
        - sequential
        - all
        - favorites
        - fullscreen_on
        - fullscreen_off
        - fit
        - crop
        - stop
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
      interval_ms:
        oneOf:
        - type: integer
        - type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      error:
        type: string
- name: voice_control_redevice_slideshow
  description: Resolve a spoken ReDevice name and limited slideshow command, then
    apply it through the normal slideshow control path.
  entry: handlers.main:voice_control_redevice_slideshow
  input_schema:
    type: object
    properties:
      action:
        type: string
        enum:
        - start
        - stop
        - next
        - prev
        - favorite
        - fav
        - send_telegram
      device_name:
        type: string
      text:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      error:
        type: string
      voice_action:
        type: string
      resolved_endpoint:
        type: object
- name: rename_redevice_endpoint
  description: Rename a ReDevice endpoint and set comma-separated aliases.
  entry: handlers.main:rename_redevice_endpoint
  input_schema:
    type: object
    required:
    - code
    properties:
      code:
        type: string
      display_name:
        type: string
      aliases:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: refresh_redevice_slideshow_state
  description: Read the latest ReDevice registry state and last surface event.
  entry: handlers.main:refresh_redevice_slideshow_state
  input_schema:
    type: object
    properties:
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      device:
        type: object
      owner:
        type: object
      updated_at:
        type: string
data_routes:
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.endpoints
  first_paint: empty ReDevice endpoint inventory
  recovery: latest endpoint inventory is restored from stream snapshot
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 32
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last ReDevice endpoint inventory
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.preview
  first_paint: empty photo preview
  recovery: photo preview is refreshed manually from the selected source folder
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 64
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last photo preview list
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.session
  first_paint: empty slideshow session state
  recovery: latest slideshow session state is restored from stream snapshot
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 98304
    max_publish_hz: 1
    max_items: 16
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last slideshow session state
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_folders_modal
  route: stream
  receiver: slideshow_skill.folders
  first_paint: empty folder index
  recovery: folder list is restored from the persistent photo index
  update_source:
  - webio.stream.snapshot.requested
  - slideshow_skill.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 256
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last indexed folder list
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.command
  first_paint: empty slideshow command state
  recovery: latest slideshow command state is restored from stream snapshot
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 32
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last slideshow command state
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.index
  first_paint: idle photo index status
  recovery: latest background index status is restored from skill memory
  update_source:
  - webio.stream.snapshot.requested
  - slideshow_skill.action
  - slideshow_skill.indexer
  budget:
    max_payload_bytes: 32768
    max_publish_hz: 2
    max_items: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last photo index status
    log: service.slideshow_skill.runtime.log
    quarantine: false
memory_budget:
  expected_rss_mb: 128
  caches:
  - name: slideshow.photos.sqlite
    owner: slideshow_skill
    max_items: persistent_index_rows
    storage: skill_internal_sqlite
    cleanup_hook: refresh_slideshow_photo_index
  - name: slideshow.thumbnail_cache
    owner: source_photo_folder
    storage: source_local_dot_adaos_thumbs
    cleanup_hook: source_folder_retention_policy
  - name: slideshow.stream_fingerprints
    max_items: 64
    cleanup_hook: webio.stream.subscription.changed
  - name: slideshow.device_cache_jobs
    max_items: 16
    ttl_seconds: 3600
    cleanup_hook: dispose
  - name: slideshow.folder_cache
    max_items: 1
    cleanup_hook: dispose
  - name: slideshow.command_state
    max_items: 1
    storage: skill_memory
  background_workers:
  - name: slideshow-photo-index
    max_threads: 1
    cleanup_hook: cancel_slideshow_photo_index
  - name: slideshow-root-poll
    max_threads: 1
    cleanup_hook: dispose
  - name: slideshow-device-cache-warm
    max_threads: 1
    cleanup_hook: dispose
redui: redui.json
