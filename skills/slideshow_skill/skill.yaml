name: slideshow_skill
version: 0.1.8
description: ReDevice slideshow pilot skill that renders cached thumbnails on an assigned
  endpoint and records endpoint surface events.
runtime:
  type: python
  module: handlers.main
dependencies:
- pillow>=10.0.0
tools:
- name: list_slideshow_photos
  description: List source photos that can be sent to a ReDevice slideshow endpoint.
  entry: handlers.main:list_slideshow_photos
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      source_dir:
        type: string
        description: Root folder with source photos.
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      source_dir:
        type: string
      count:
        type: integer
      items:
        type: array
        items:
          type: object
- name: start_redevice_slideshow
  description: Convert source photos to cached thumbnails and queue a display.render_surface
    command for a ReDevice endpoint.
  entry: handlers.main:start_redevice_slideshow
  input_schema:
    type: object
    properties:
      code:
        type: string
        description: Optional ReDevice pair code. The first admitted endpoint is used
          when omitted.
      limit:
        type: integer
        minimum: 1
        maximum: 30
        default: 10
      webspace_id:
        type: string
      source_dir:
        type: string
        description: Root folder with source photos.
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      error:
        type: string
      command_id:
        type: string
      source_dir:
        type: string
      device:
        type: object
      items:
        type: array
        items:
          type: object
- name: select_redevice_endpoint
  description: Select a ReDevice endpoint for the slideshow modal and publish visible
    selection state.
  entry: handlers.main:select_redevice_endpoint
  input_schema:
    type: object
    properties:
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
        description: Root folder with source photos.
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      selected_device_code:
        type: string
      selected_items:
        type: array
        items:
          type: object
      items:
        type: array
        items:
          type: object
- name: toggle_redevice_endpoint
  description: Add or remove a ReDevice endpoint from the slideshow sync group.
  entry: handlers.main:toggle_redevice_endpoint
  input_schema:
    type: object
    properties:
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      selected_codes:
        type: array
        items:
          type: string
- name: control_redevice_slideshow
  description: Control the shared slideshow state and broadcast it to selected ReDevice endpoints.
  entry: handlers.main:control_redevice_slideshow
  input_schema:
    type: object
    required:
    - action
    properties:
      action:
        type: string
        enum:
        - start
        - prev
        - next
        - fav
        - sync_on
        - sync_off
        - random
        - sequential
        - all
        - favorites
        - fullscreen_on
        - fullscreen_off
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      error:
        type: string
- name: rename_redevice_endpoint
  description: Rename a ReDevice endpoint and set comma-separated aliases.
  entry: handlers.main:rename_redevice_endpoint
  input_schema:
    type: object
    required:
    - code
    properties:
      code:
        type: string
      display_name:
        type: string
      aliases:
        type: string
      webspace_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
- name: refresh_redevice_slideshow_state
  description: Read the latest ReDevice registry state and last surface event.
  entry: handlers.main:refresh_redevice_slideshow_state
  input_schema:
    type: object
    properties:
      code:
        type: string
      webspace_id:
        type: string
      source_dir:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      device:
        type: object
      owner:
        type: object
      updated_at:
        type: string
data_routes:
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.endpoints
  first_paint: empty ReDevice endpoint inventory
  recovery: latest endpoint inventory is restored from stream snapshot
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 32
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last ReDevice endpoint inventory
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.preview
  first_paint: empty photo preview
  recovery: photo preview is refreshed manually from the selected source folder
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 64
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last photo preview list
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.session
  first_paint: empty slideshow session state
  recovery: latest slideshow session state is restored from stream snapshot
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 98304
    max_publish_hz: 1
    max_items: 16
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last slideshow session state
    log: service.slideshow_skill.runtime.log
    quarantine: false
- surface: modal:slideshow_modal
  route: stream
  receiver: slideshow_skill.command
  first_paint: empty slideshow command state
  recovery: latest slideshow command state is restored from stream snapshot
  update_source:
  - slideshow_skill.action
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 32
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: keep the last slideshow command state
    log: service.slideshow_skill.runtime.log
    quarantine: false
redui: redui.json
updated_at: '2026-06-02T00:00:00+00:00'

