schema: adaos.conversational.affordances.v1
package_id: builder_skill
affordances:
- id: plan_prototype
  kind: workflow_command
  label: Start Prototype change
  description: Create a bounded Prototype Change in the governed Builder workflow.
  workflow:
    workflow_type: builder.change
    command_id: plan_prototype_change
    transition_id: plan_prototype
  skill_invocation: null
  action_policy:
    schema: adaos.conversation.action_policy.v1
    risk_class: local_reversible
    side_effect: reversible
    confirmation: none
  required_capabilities: []
  presentation:
    hint: button
    priority: 10
  output_refs:
  - prototype_started
- id: request_prototype_review
  kind: workflow_command
  label: Review Prototype
  description: Move the current declarative Prototype into review without changing it.
  workflow:
    workflow_type: builder.change
    command_id: request_prototype_review
    transition_id: request_prototype_review
  skill_invocation: null
  action_policy:
    schema: adaos.conversation.action_policy.v1
    risk_class: read
    side_effect: none
    confirmation: none
  required_capabilities: []
  presentation:
    hint: button
    priority: 20
  output_refs:
  - prototype_review_ready
- id: accept_prototype
  kind: workflow_command
  label: Accept Prototype
  description: Accept the reviewed Prototype and hand the Change to Automation.
  workflow:
    workflow_type: builder.change
    command_id: accept_prototype
    transition_id: accept_prototype
  skill_invocation: null
  action_policy:
    schema: adaos.conversation.action_policy.v1
    risk_class: isolated_write
    side_effect: reversible
    confirmation: none
  required_capabilities: []
  presentation:
    hint: button
    priority: 30
  output_refs:
  - prototype_accepted
