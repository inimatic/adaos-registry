schema: adaos.conversational.story.v1
id: builder.prototype_cycle.ru.happy_path
title: Prototype request through Automation admission
story_kind: workflow
workflow_type: builder.change
locale: ru
channel: web
actor:
  id: user:local
  permissions: []
  roles:
  - registered
start:
  instance_id: builder:scenario:dogfood
  state: ready
  generation: 0
  context: {}
steps:
- user: Начни изменение прототипа для этого сценария
  given:
    proposal:
      kind: workflow_command
      intent_id: plan_prototype
      command: plan_prototype_change
      skill_id: null
      operation_id: null
      arguments: {}
      confidence: 0.97
      action_policy:
        schema: adaos.conversation.action_policy.v1
        risk_class: local_reversible
        side_effect: reversible
        confirmation: none
    event: null
    skill_result: null
    output_ref: prototype_started
  expect:
    proposal:
      kind: workflow_command
      command: plan_prototype_change
      confidence_at_least: 0.9
    command: plan_prototype_change
    transition_id: plan_prototype
    state: prototype_editing
    reason_code: null
    output:
      kind: accepted
      output_ref: prototype_started
      summary: Prototype change started.
      actions:
      - request_review
      next_expected_input: action
- user: Покажи этот прототип для проверки
  given:
    proposal:
      kind: workflow_command
      intent_id: request_prototype_review
      command: request_prototype_review
      skill_id: null
      operation_id: null
      arguments: {}
      confidence: 0.96
      action_policy:
        schema: adaos.conversation.action_policy.v1
        risk_class: read
        side_effect: none
        confirmation: none
    event: null
    skill_result: null
    output_ref: prototype_review_ready
  expect:
    proposal:
      kind: workflow_command
      command: request_prototype_review
      confidence_at_least: 0.9
    command: request_prototype_review
    transition_id: request_prototype_review
    state: prototype_review
    reason_code: null
    output:
      kind: result
      output_ref: prototype_review_ready
      summary: Prototype is ready for review.
      actions:
      - accept_prototype
      next_expected_input: action
- user: Прими этот прототип и переходи к реализации
  given:
    proposal:
      kind: workflow_command
      intent_id: accept_prototype
      command: accept_prototype
      skill_id: null
      operation_id: null
      arguments: {}
      confidence: 0.98
      action_policy:
        schema: adaos.conversation.action_policy.v1
        risk_class: isolated_write
        side_effect: reversible
        confirmation: none
    event: null
    skill_result: null
    output_ref: prototype_accepted
  expect:
    proposal:
      kind: workflow_command
      command: accept_prototype
      confidence_at_least: 0.9
    command: accept_prototype
    transition_id: accept_prototype
    state: automation_ready
    reason_code: null
    output:
      kind: result
      output_ref: prototype_accepted
      summary: Prototype accepted for implementation.
      actions: []
      next_expected_input: none
