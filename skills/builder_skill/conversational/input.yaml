      - builder_start_automation.example.en.1
      - builder_start_automation.example.ru.1
    slots: []
  - id: builder_accept_verification
    description: Accept Builder verification and prepare the trial stage.
    kind: workflow_command
    affordance_id: builder_accept_verification
