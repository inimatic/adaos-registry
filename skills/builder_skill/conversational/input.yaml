schema: adaos.conversational.input.v1
package_id: builder_skill
intents:
  - id: builder_plan_prototype
    description: Start a Builder prototype change from the ready state.
    kind: workflow_command
    affordance_id: builder_plan_prototype
    workflow:
      workflow_type: builder.change
      command_id: plan_prototype_change
      transition_id: plan_prototype
    skill_invocation: null
    example_ids:
      - builder_plan_prototype.example.en.1
      - builder_plan_prototype.example.ru.1
    slots: []
  - id: builder_request_review
    description: Request review for the current Builder prototype.
    kind: workflow_command
    affordance_id: builder_request_review
    workflow:
      workflow_type: builder.change
      command_id: request_prototype_review
      transition_id: request_prototype_review
