name: builder_skill
version: 0.3.170
description: Rapid prototyping Builder skill for creating and editing scenario UI
  drafts from voice or text dialog.
entry: handlers/main.py
workflow:
  manifest: workflow.json
runtime:
  python: '3.11'
  sdk_only: true
capabilities:
- applications.develop
- applications.publish
- storage.relational
default_tool: chat
dependencies: []
events:
  subscribe: []
  publish:
  - io.out.chat.append
  - builder.workbench.ensure_requested
  - builder.ui_revision.materialize
  - desktop.webspace.reload
exports:
  tools:
  - start
  - chat
  - handle_interaction_response
  - create_scenario_draft
  - create_application_draft
  - resume_application_registration
  - get_application_development_state
  - update_application_metadata
  - materialize_application
  - create_application_trial
  - decide_application_trial
  - publish_application_trial
  - promote_application_stable
  - publish_application_stable_source
  - update_current_scenario
  - get_session
  - get_preview_state
  - set_ui_revision_current
  - ensure_dev_webspace
  - get_workspace_binding
  - open_dev_webspace
  - attach_dialog_widget
  - set_active_draft
  - list_development_skills
  - delete_development_skill
tools:
- name: start
  description: Start or resume the Builder rapid prototyping dialog.
  side_effects: local_write
  entry: handlers.main:start
  input_schema:
    type: object
    properties:
      text:
        type: string
      webspace_id:
        type: string
      conversation_context:
        type: object
        description: When supplied for prototype generation, this must be a canonical
          adaos.context.packet.v1 packet. Routing metadata belongs in _meta.
        properties:
          schema:
            type: string
            const: adaos.context.packet.v1
        additionalProperties: true
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    - dialog
- name: chat
  description: Handle a Builder dialog turn and create or patch a scenario prototype.
  side_effects: local_write
  entry: handlers.main:chat
  timeout_seconds: 120
  input_schema:
    type: object
    properties:
      text:
        type: string
      webspace_id:
        type: string
      auto_apply:
        type: boolean
      retry_job_id:
        type: string
        description: Replay one failed LLM result for the exact same request without
          another model call.
      expected_ui_revision:
        type: string
        description: Current UI revision required for a safe failed-result replay.
      conversation_context:
        type: object
        description: When supplied for prototype generation, this must be a canonical
          adaos.context.packet.v1 packet. Routing metadata belongs in _meta.
        properties:
          schema:
            type: string
            const: adaos.context.packet.v1
        additionalProperties: true
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    - dialog
- name: handle_interaction_response
  description: Handle one validated semantic Builder interaction response routed by
    AdaOS core.
  side_effects: local_write
  entry: handlers.main:handle_interaction_response
  timeout_seconds: 30
  input_schema:
    type: object
    required:
    - event
    properties:
      event:
        type: object
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
- name: create_scenario_draft
  description: Create a new dev-space scenario draft with a declarative web UI prototype.
  side_effects: local_write
  entry: handlers.main:create_scenario_draft
  input_schema:
    type: object
    required:
    - idea
    properties:
      idea:
        type: string
      scenario_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - session_id
    - scenario_id
    properties:
      pending_action:
        type: object
        description: Reserved for destructive or release-stage Builder actions.
- name: create_application_draft
  description: Create an exact Application aggregate and its primary scenario prototype.
  side_effects: local_write
  entry: handlers.main:create_application_draft
  input_schema:
    type: object
    required:
    - idea
    properties:
      idea:
        type: string
      application_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - application_id
    - application_status
- name: resume_application_registration
  description: Resume aggregate registration for an existing recoverable Application
    draft.
  side_effects: local_write
  entry: handlers.main:resume_application_registration
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
- name: get_application_development_state
  description: Return the selected Application aggregate, Builder workflow, candidate
    identity, channels, and development operations.
  side_effects: none
  entry: handlers.main:get_application_development_state
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - application_id
    - application_revision
- name: update_application_metadata
  description: Replace bounded catalog metadata for the selected publisher-owned Application.
  side_effects: local_write
  entry: handlers.main:update_application_metadata
  input_schema:
    type: object
    required:
    - title
    - summary
    - categories
    - idempotency_key
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 160
      summary:
        type: string
        minLength: 1
        maxLength: 500
      categories:
        type: array
        maxItems: 12
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
      idempotency_key:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - operation
- name: materialize_application
  description: Materialize the selected accepted Application UI revision in its isolated
    DEV Preview.
  side_effects: local_write
  entry: handlers.main:materialize_application
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      revision:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - operation
- name: create_application_trial
  description: Prepare one immutable Trial candidate from the selected Application
    and activate it in isolated Trial storage.
  side_effects: local_write
  entry: handlers.main:create_application_trial
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - candidate_id
    - operation
- name: decide_application_trial
  description: Record the publisher's explicit acceptance or rejection of the selected
    immutable Trial candidate.
  side_effects: local_write
  entry: handlers.main:decide_application_trial
  input_schema:
    type: object
    required:
    - accepted
    - idempotency_key
    properties:
      accepted:
        type: boolean
      idempotency_key:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - candidate_id
    - operation
- name: publish_application_trial
  description: Publish the selected accepted Trial as a private link or move the public
    prerelease channel after the first stable.
  side_effects: local_write
  entry: handlers.main:publish_application_trial
  input_schema:
    type: object
    required:
    - mode
    - idempotency_key
    properties:
      mode:
        type: string
        enum:
        - link_only
        - prerelease
      idempotency_key:
        type: string
      addresses_report_ids:
        type: array
        maxItems: 200
        items:
          type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - mode
    - candidate_id
    - operation
- name: promote_application_stable
  description: Promote the selected accepted Trial candidate to the stable Application
    channel with a CAS precondition.
  side_effects: local_write
  entry: handlers.main:promote_application_stable
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - candidate_id
    - operation
- name: publish_application_stable_source
  description: Publish the stable source projection after stable promotion using the
    exact release digest.
  side_effects: local_write
  entry: handlers.main:publish_application_stable_source
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      release_notes:
        type: string
        maxLength: 20000
      release_digest:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - release_digest
    - operation
- name: update_current_scenario
  description: Apply a safe declarative UI patch to the current Builder scenario session.
  side_effects: local_write
  entry: handlers.main:update_current_scenario
  timeout_seconds: 120
  input_schema:
    type: object
    required:
    - instruction
    properties:
      instruction:
        type: string
      webspace_id:
        type: string
      scenario_id:
        type: string
        description: Explicit target scenario for API and agent calls; must agree
          with the conversational topic when both are supplied.
      retry_job_id:
        type: string
        description: Explicit failed LLM job whose complete saved response should
          be revalidated locally instead of submitting another model request.
      expected_ui_revision:
        type: string
        description: Required revision precondition when retry_job_id is supplied.
      conversation_context:
        type: object
        description: When supplied for prototype generation, this must be a canonical
          adaos.context.packet.v1 packet. Routing metadata belongs in _meta.
        properties:
          schema:
            type: string
            const: adaos.context.packet.v1
        additionalProperties: true
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    properties:
      pending_action:
        type: object
        description: Reserved for destructive or release-stage Builder actions.
- name: get_session
  description: Return the current Builder rapid prototyping session.
  side_effects: none
  entry: handlers.main:get_session
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
- name: get_preview_state
  description: Return the render-ready declarative preview state for the current Builder
    session.
  side_effects: none
  entry: handlers.main:get_preview_state
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - preview_state
- name: set_ui_revision_current
  description: Restore a stored Builder UI revision as the current scenario web UI.
  side_effects: local_write
  entry: handlers.main:set_ui_revision_current
  input_schema:
    type: object
    required:
    - revision
    properties:
      revision:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
- name: ensure_dev_webspace
  description: Create or reuse the paired Prompt IDE dev webspace for the current
    source webspace.
  side_effects: local_write
  entry: handlers.main:ensure_dev_webspace
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      active_draft_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
- name: get_workspace_binding
  description: Return the Builder source/dev webspace binding and active draft.
  side_effects: none
  entry: handlers.main:get_workspace_binding
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - binding
- name: open_dev_webspace
  description: Return the browser URL for the paired Prompt IDE dev webspace.
  side_effects: local_write
  entry: handlers.main:open_dev_webspace
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      base_url:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - url
    - webspace_id
- name: attach_dialog_widget
  description: Return embedded Voice Chat widget config for Builder Prompt IDE.
  side_effects: none
  entry: handlers.main:attach_dialog_widget
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - widget
- name: set_active_draft
  description: Switch the active Builder development draft in the paired Prompt IDE
    dev webspace.
  side_effects: local_write
  entry: handlers.main:set_active_draft
  input_schema:
    type: object
    properties:
      draft_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - binding
- name: list_development_skills
  description: List Builder drafts and skills/scenarios currently in development.
  side_effects: none
  entry: handlers.main:list_development_skills
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - items
- name: delete_development_skill
  description: Delete a Builder development draft and clear it from the active workbench
    if selected.
  side_effects: local_write
  entry: handlers.main:delete_development_skill
  input_schema:
    type: object
    required:
    - draft_id
    properties:
      draft_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
data_routes:
- surface: builder rapid prototype preview
  route: skill-local
  path: relational:builder_state
  owner: skill:builder_skill
  first_paint: empty Builder session with a prompt to describe the application
  recovery: lazily migrate legacy skill_env keys; get_preview_state rebuilds preview
    from owner-scoped relational state and dev scenario files
  guard_visibility: Builder reports degraded preview state in tool response
  budget:
    max_items: 25
    max_payload_bytes: 524288
- surface: builder workbench state
  route: yjs
  path: data.builder
  owner: skill:builder_skill
  projection_slot: builder
  first_paint: empty workbench binding with embedded Voice Chat widget config
  recovery: get_workspace_binding and get_preview_state republish data.builder from
    state/builder/workbench
  guard_visibility: Builder reports projection publication status in tool response
  budget:
    max_payload_bytes: 131072
    max_publish_hz: 2
    coalesce_ms: 250
    snapshot_policy: none
data_projections:
- scope: subnet
  slot: builder
  targets:
  - backend: yjs
    path: data/builder
llm_hints:
  description: Builder rapid prototyping agent. Use when the user asks Builder/Строитель
    to create or change an application, scenario, form, list, table, card view, or
    web UI prototype.
  aliases:
  - Builder
  - builder
  - buikder
  - Строитель
  - строитель
  - билдер
  side_effect_class: local_write
  primary_actions:
  - id: builder.start
    intent: builder.start
    tool: start
    side_effect_class: local_write
    examples:
    - Строитель, создадим приложение список покупок
    - Builder, create a shopping list app
  - id: builder.chat
    intent: builder.chat
    tool: chat
    side_effect_class: local_write
    examples:
    - добавь поле цена
    - покажи список карточками
nlu_hints:
  aliases:
  - Строитель
  - Builder
  - билдер
  examples:
  - text: Строитель, создадим приложение список покупок
    locale: ru
    intent: builder.start
  - text: Builder, create a shopping list app
    locale: en
    intent: builder.start
conversation:
  dialog_channel:
    id: builder
    label: Builder
    owner: skill:builder_skill
    default_tool: builder_skill.chat
  agents:
  - id: agent:builder_skill:builder
    label: Строитель
    owner: skill:builder_skill
    kind: skill_agent
    channel_id: builder
    skill: builder_skill
    talk_tool: chat
    gender: male
    voice: ru-male
    icon: construct-outline
    aliases:
    - Строитель
    - строитель
    - Builder
    - builder
    - buikder
    - билдер
