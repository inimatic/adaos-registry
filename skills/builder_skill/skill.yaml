name: builder_skill
version: 0.4.50
description: Rapid prototyping Builder skill for creating and editing scenario UI
  drafts from voice or text dialog.
entry: handlers/main.py
workflow:
  manifest: workflow.json
runtime:
  python: '3.11'
  sdk_only: true
  activation:
    mode: lazy
    startup_allowed: false
    background_refresh: true
    assessment:
      schema: adaos.skill.activation_assessment.v1
      assessor: builder.compiler
      classification: event_subscriber
      handler_digest: sha256:0e805dd85c210473b6d8ad8611fbed78c6afa8dc0e57f565d4af697053e7aba4
      observed_subscriptions:
      - builder.pending_action.response
      declared_subscriptions:
      - builder.pending_action.response
      dynamic_subscription_count: 0
      tool_count: 35
      reasons:
      - event_subscriptions_require_early_handler_registration
capabilities:
- ai.inference
- applications.develop
- applications.publish
- workspace.read
- workspace.write
- storage.relational
default_tool: chat
dependencies: []
events:
  subscribe:
  - builder.pending_action.response
  publish:
  - builder.preview.desired
  - io.out.chat.append
  - builder.workbench.ensure_requested
  - builder.ui_revision.materialize
  - desktop.webspace.reload
exports:
  tools:
  - add_design_reference
  - get_output_routes
  - request_output_routes
  - select_output_routes
  - start
  - chat
  - prototype_chatgpt_edit
  - handle_interaction_response
  - create_scenario_draft
  - create_application_draft
  - resume_application_registration
  - get_application_development_state
  - update_application_metadata
  - materialize_application
  - accept_application_automation_checkpoint
  - create_application_trial
  - decide_application_trial
  - publish_application_trial
  - promote_application_stable
  - publish_application_stable_source
  - update_current_scenario
  - get_session
  - apply_semantic_revision
  - get_preview_state
  - adopt_current_ui_revision
  - set_ui_revision_current
  - ensure_dev_webspace
  - get_workspace_binding
  - open_dev_webspace
  - attach_dialog_widget
  - set_active_draft
  - list_development_skills
  - delete_development_skill
tools:
- name: add_design_reference
  description: Retain immutable HTML or text as a project-scoped design reference;
    never execute it.
  entry: handlers.main:add_design_reference
  side_effects: local_write
  permissions:
  - applications.develop
  - workspace.write
  input_schema:
    type: object
    required:
    - scenario_id
    - name
    - media_type
    - text
    properties:
      scenario_id:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 160
      media_type:
        type: string
        enum:
        - text/html
        - text/css
        - text/javascript
        - application/javascript
        - application/json
        - text/plain
        - text/markdown
      text:
        type: string
        minLength: 1
        maxLength: 262144
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - reference
    properties:
      ok:
        type: boolean
      reference:
        type: object
- name: get_output_routes
  description: get output routes
  entry: handlers.main:get_output_routes
  side_effects: read_only
  permissions:
  - workspace.read
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: false
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      status:
        type: string
        enum:
        - ready
        - unavailable
      reason:
        type:
        - string
        - 'null'
      conversation_id:
        type:
        - string
        - 'null'
      policy_revision:
        type: integer
      truncated:
        type: boolean
      automatic_external_outputs_default:
        type: string
      items:
        type: array
        maxItems: 20
        items:
          type: object
          properties:
            route_id:
              type: string
            transport:
              type: string
            status:
              type: string
              enum:
              - active
              - paused
              - expired
              - revoked
            expires_at:
              type:
              - string
              - 'null'
            selected:
              type: boolean
          required:
          - route_id
          - transport
          - status
          - expires_at
          - selected
          additionalProperties: false
    required:
    - ok
    - status
    additionalProperties: true
- name: request_output_routes
  description: request output routes
  entry: handlers.main:request_output_routes
  side_effects: local_write
  permissions:
  - workspace.write
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      locale:
        type: string
        enum:
        - en
        - ru
    additionalProperties: false
  output_schema:
    type: object
- name: select_output_routes
  description: select output routes
  entry: handlers.main:select_output_routes
  side_effects: local_write
  permissions:
  - workspace.write
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      route_ids:
        type: array
        maxItems: 20
        items:
          type: string
      response_id:
        type: string
        minLength: 1
    additionalProperties: false
    required:
    - route_ids
    - response_id
  output_schema:
    type: object
    properties:
      conversation_id:
        type:
        - string
        - 'null'
      route_ids:
        type: array
        maxItems: 20
        items:
          type: string
      policy_revision:
        type: integer
      status:
        type: string
      ok:
        type: boolean
      reason:
        type:
        - string
        - 'null'
    additionalProperties: false
- name: prototype_chatgpt_edit
  description: Foreground Prototype generation or admitted edit through Core personal
    ChatGPT. Never falls back to Root or Automation.
  entry: handlers.main:prototype_chatgpt_edit
  side_effects: local_write
  timeout_seconds: 600
  input_schema:
    type: object
    required:
    - text
    - webspace_id
    properties:
      text:
        type: string
      webspace_id:
        type: string
      auto_apply:
        type: boolean
      conversation_context:
        type: object
    additionalProperties: true
  output_schema:
    type: object
- name: start
  description: Start or resume the Builder rapid prototyping dialog.
  side_effects: local_write
  entry: handlers.main:start
  input_schema:
    type: object
    properties:
      text:
        type: string
      webspace_id:
        type: string
      conversation_context:
        type: object
        description: When supplied for prototype generation, this must be a canonical
          adaos.context.packet.v1 packet. Routing metadata belongs in _meta.
        properties:
          schema:
            type: string
            const: adaos.context.packet.v1
        additionalProperties: true
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    - dialog
- name: chat
  description: Handle a Builder dialog turn and create or patch a scenario prototype.
  side_effects: local_write
  entry: handlers.main:chat
  timeout_seconds: 600
  input_schema:
    type: object
    properties:
      text:
        type: string
      webspace_id:
        type: string
      auto_apply:
        type: boolean
      retry_job_id:
        type: string
        description: Replay one failed LLM result for the exact same request without
          another model call.
      expected_ui_revision:
        type: string
        description: Current UI revision required for a safe failed-result replay.
      conversation_context:
        type: object
        description: When supplied for prototype generation, this must be a canonical
          adaos.context.packet.v1 packet. Routing metadata belongs in _meta.
        properties:
          schema:
            type: string
            const: adaos.context.packet.v1
        additionalProperties: true
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    - dialog
- name: handle_interaction_response
  description: Handle one validated semantic Builder interaction response routed by
    AdaOS core.
  side_effects: local_write
  entry: handlers.main:handle_interaction_response
  timeout_seconds: 30
  input_schema:
    type: object
    required:
    - event
    properties:
      event:
        type: object
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
- name: create_scenario_draft
  description: Create a new dev-space scenario draft with a declarative web UI prototype.
  side_effects: local_write
  entry: handlers.main:create_scenario_draft
  input_schema:
    type: object
    required:
    - idea
    properties:
      idea:
        type: string
      scenario_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - session_id
    - scenario_id
    properties:
      pending_action:
        type: object
        description: Reserved for destructive or release-stage Builder actions.
- name: create_application_draft
  description: Create an exact Application aggregate and its primary scenario prototype.
  side_effects: local_write
  entry: handlers.main:create_application_draft
  input_schema:
    type: object
    required:
    - idea
    properties:
      idea:
        type: string
      application_id:
        type: string
      confirmed_technical_application_id:
        type: string
        pattern: ^[a-z](?:[a-z0-9_.-]{0,126}[a-z0-9])?$
        description: Exact explicitly confirmed technical Application id; must agree
          with the idea and application_id before creation or provider calls.
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - application_id
    - application_status
- name: resume_application_registration
  description: Resume aggregate registration for an existing recoverable Application
    draft.
  side_effects: local_write
  entry: handlers.main:resume_application_registration
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      scenario_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
- name: get_application_development_state
  description: Return the selected Application aggregate, Builder workflow, candidate
    identity, channels, and development operations.
  side_effects: none
  entry: handlers.main:get_application_development_state
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - application_id
    - application_revision
- name: update_application_metadata
  description: Replace bounded catalog metadata for the selected publisher-owned Application.
  side_effects: local_write
  entry: handlers.main:update_application_metadata
  input_schema:
    type: object
    required:
    - title
    - summary
    - categories
    - idempotency_key
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 160
      summary:
        type: string
        minLength: 1
        maxLength: 500
      categories:
        type: array
        maxItems: 12
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
      idempotency_key:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - operation
- name: materialize_application
  description: Materialize the selected accepted Application UI revision in its isolated
    DEV Preview.
  side_effects: local_write
  entry: handlers.main:materialize_application
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      revision:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - operation
- name: accept_application_automation_checkpoint
  description: Checkpoint every owned Application Project component and accept the
    exact verified Automation identities in the canonical Builder workflow.
  side_effects: local_write
  entry: handlers.main:accept_application_automation_checkpoint
  timeout_seconds: 300
  input_schema:
    type: object
    required:
    - confirmed
    - idempotency_key
    - verification_refs
    properties:
      confirmed:
        type: boolean
      idempotency_key:
        type: string
      verification_refs:
        type: array
        items:
          type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - package_digest
    - source_revision
    - workflow
- name: create_application_trial
  description: Prepare one immutable Trial candidate from the selected Application
    and activate it in isolated Trial storage. Builder binds the accepted checkpoint,
    permission contract, and sealed Automation evidence automatically.
  side_effects: local_write
  entry: handlers.main:create_application_trial
  timeout_seconds: 300
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      permission_decision:
        type: object
        description: Explicit audited owner decision for permissions introduced by
          the Trial activation.
        required:
        - approved
        - actor
        - actor_type
        - approval_id
        properties:
          approved:
            type: boolean
            const: true
          actor:
            type: string
          actor_type:
            type: string
            const: user
          approval_id:
            type: string
          reason:
            type: string
        additionalProperties: true
      verification_evidence:
        type: object
        description: Optional additive evidence. It cannot replace the accepted source
          commit, Trial scope, or authoritative permission contract.
        additionalProperties: true
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - candidate_id
    - operation
- name: decide_application_trial
  description: Record the publisher's explicit acceptance or rejection of the selected
    immutable Trial candidate.
  side_effects: local_write
  entry: handlers.main:decide_application_trial
  input_schema:
    type: object
    required:
    - accepted
    - idempotency_key
    properties:
      accepted:
        type: boolean
      idempotency_key:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - candidate_id
    - operation
- name: publish_application_trial
  description: Publish the selected accepted Trial as a private link or move the public
    prerelease channel after the first stable.
  side_effects: local_write
  entry: handlers.main:publish_application_trial
  input_schema:
    type: object
    required:
    - mode
    - idempotency_key
    properties:
      mode:
        type: string
        enum:
        - link_only
        - prerelease
      idempotency_key:
        type: string
      addresses_report_ids:
        type: array
        maxItems: 200
        items:
          type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - mode
    - candidate_id
    - operation
- name: promote_application_stable
  description: Promote the selected accepted Trial candidate to the stable Application
    channel with a CAS precondition.
  side_effects: local_write
  entry: handlers.main:promote_application_stable
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - candidate_id
    - operation
- name: publish_application_stable_source
  description: Publish the stable source projection after stable promotion using the
    exact release digest.
  side_effects: local_write
  entry: handlers.main:publish_application_stable_source
  input_schema:
    type: object
    required:
    - idempotency_key
    properties:
      idempotency_key:
        type: string
      release_notes:
        type: string
        maxLength: 20000
      release_digest:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
    - release_digest
    - operation
- name: update_current_scenario
  description: Apply a safe declarative UI patch to the current Builder scenario session.
  side_effects: local_write
  entry: handlers.main:update_current_scenario
  timeout_seconds: 120
  input_schema:
    type: object
    required:
    - instruction
    properties:
      instruction:
        type: string
      webspace_id:
        type: string
      scenario_id:
        type: string
        description: Explicit target scenario for API and agent calls; must agree
          with the conversational topic when both are supplied.
      retry_job_id:
        type: string
        description: Explicit failed LLM job whose complete saved response should
          be revalidated locally instead of submitting another model request.
      expected_ui_revision:
        type: string
        description: Required revision precondition when retry_job_id is supplied.
      conversation_context:
        type: object
        description: When supplied for prototype generation, this must be a canonical
          adaos.context.packet.v1 packet. Routing metadata belongs in _meta.
        properties:
          schema:
            type: string
            const: adaos.context.packet.v1
        additionalProperties: true
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
    properties:
      pending_action:
        type: object
        description: Reserved for destructive or release-stage Builder actions.
- name: get_session
  description: Return the current Builder rapid prototyping session.
  side_effects: none
  entry: handlers.main:get_session
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
- name: apply_semantic_revision
  description: Apply one bounded semantic change to an exact Prototype revision and
    compile it through the canonical semantic compiler.
  side_effects: local_write
  entry: handlers.main:apply_semantic_revision
  input_schema:
    type: object
    required:
    - expected_ui_revision
    - operation_id
    - change
    properties:
      expected_ui_revision:
        type: string
      operation_id:
        type: string
      change:
        type: object
        required:
        - kind
        - view_ref
        - order_field_ref
        properties:
          kind:
            type: string
            enum:
            - set_list_reorder
          view_ref:
            type: string
          order_field_ref:
            type: string
          enabled:
            type: boolean
        additionalProperties: false
      session_id:
        type: string
      scenario_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - status
  timeout_seconds: 120
- name: get_preview_state
  description: Return the render-ready declarative preview state for the current Builder
    session.
  side_effects: none
  entry: handlers.main:get_preview_state
  input_schema:
    type: object
    properties:
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - preview_state
- name: set_ui_revision_current
  description: Restore a stored Builder UI revision as the current scenario web UI.
  side_effects: local_write
  timeout_seconds: 120
  entry: handlers.main:set_ui_revision_current
  input_schema:
    type: object
    required:
    - revision
    properties:
      revision:
        type: string
      session_id:
        type: string
      scenario_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - message
- name: adopt_current_ui_revision
  description: Validate and adopt the current reviewed Builder WebUI artifact as a
    new revision.
  side_effects: local_write
  entry: handlers.main:adopt_current_ui_revision
  input_schema:
    type: object
    required:
    - review_note
    - expected_ui_revision
    properties:
      review_note:
        type: string
        minLength: 8
      expected_ui_revision:
        type: string
      session_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
- name: ensure_dev_webspace
  description: Create or reuse the paired Prompt IDE dev webspace for the current
    source webspace.
  side_effects: local_write
  entry: handlers.main:ensure_dev_webspace
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      active_draft_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
- name: get_workspace_binding
  description: Return the Builder source/dev webspace binding and active draft.
  side_effects: none
  entry: handlers.main:get_workspace_binding
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - binding
- name: open_dev_webspace
  description: Return the browser URL for the paired Prompt IDE dev webspace.
  side_effects: local_write
  entry: handlers.main:open_dev_webspace
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      base_url:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - url
    - webspace_id
- name: attach_dialog_widget
  description: Return embedded Voice Chat widget config for Builder Prompt IDE.
  side_effects: none
  entry: handlers.main:attach_dialog_widget
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - widget
- name: set_active_draft
  description: Switch the active Builder development draft in the paired Prompt IDE
    dev webspace.
  side_effects: local_write
  entry: handlers.main:set_active_draft
  input_schema:
    type: object
    properties:
      draft_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - binding
- name: list_development_skills
  description: List Builder drafts and skills/scenarios currently in development.
  side_effects: none
  entry: handlers.main:list_development_skills
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - items
- name: delete_development_skill
  description: Delete a Builder development draft and clear it from the active workbench
    if selected.
  side_effects: local_write
  entry: handlers.main:delete_development_skill
  input_schema:
    type: object
    required:
    - draft_id
    properties:
      draft_id:
        type: string
      webspace_id:
        type: string
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
- name: application_data_drain
  description: Provide a verified Application data lifecycle receipt.
  entry: handlers.main:application_data_drain
  side_effects: runtime_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: application_data_rehydrate
  description: Provide a verified Application data lifecycle receipt.
  entry: handlers.main:application_data_rehydrate
  side_effects: runtime_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
data_routes:
- surface: builder rapid prototype preview
  route: skill-local
  path: relational:builder_state
  owner: skill:builder_skill
  first_paint: empty Builder session with a prompt to describe the application
  recovery: lazily migrate legacy skill_env keys; get_preview_state rebuilds preview
    from owner-scoped relational state and dev scenario files
  guard_visibility: Builder reports degraded preview state in tool response
  budget:
    max_items: 25
    max_payload_bytes: 524288
- surface: builder workbench state
  route: yjs
  path: data.builder
