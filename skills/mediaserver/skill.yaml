name: mediaserver
version: 0.8.5
entry: handlers/main.py
runtime:
  python: '3.11'
description: Local MVP media debugging skill for upload/playback diagnostics and media-channel
  readiness checks.
dependencies: []
events: {}
data_projections:
- scope: subnet
  slot: mediaserver.library
  targets:
  - backend: yjs
    path: data/media/library
default_tool: get_snapshot
tools:
- name: get_snapshot
  description: Return current media library snapshot and media-channel capability
    diagnostics.
  entry: handlers.main:get_snapshot
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - items
    - capabilities
- name: refresh_snapshot
  description: Refresh media library projection and return a lightweight acknowledgement.
  entry: handlers.main:refresh_snapshot
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: get_diagnostics
  description: Return compact operator diagnostics for mediaserver projection pressure
    and media runtime readiness.
  entry: handlers.main:get_diagnostics
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - items
    - media
    - reliability
