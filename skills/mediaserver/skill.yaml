name: mediaserver
version: 0.9.18
entry: handlers/main.py
runtime:
  python: '3.11'
description: Local MVP media debugging skill for upload/playback diagnostics and media-channel
  readiness checks.
dependencies: []
events: {}
data_projections:
- scope: subnet
  slot: mediaserver.library_summary
  targets:
  - backend: yjs
    path: data/media/library_summary
data_routes:
- surface: widget:mediaserver.summary
  route: yjs
  projection_slot: mediaserver.library_summary
  path: data/media/library_summary
  first_paint: compact summary from ydoc defaults
  recovery: Yjs replay restores count, bytes, capability, freshness, and route contract
  update_source:
  - mediaserver.refresh_snapshot
  - mediaserver.get_snapshot
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 0.2
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: media summary reports projection guard decision
    log: skill:mediaserver.runtime
    quarantine: true
- surface: modal:mediaserver.library_page
  route: tool
  tool: list_library_page
  first_paint: first bounded page of media rows
  recovery: browser requests another bounded page; rows are not replayed from Yjs
  update_source:
  - mediaserver.list_library_page
  budget:
    max_payload_bytes: 65536
    max_items: 100
    snapshot_policy: manual
  read_policy:
    mode: explicit
    triggers:
    - mount
    - explicit_refresh
    - targeted_invalidation
    cache_ttl_ms: 0
    max_request_hz: 2
    preserve_last_value: true
    invalidation_tags:
    - mediaserver.library
  guard_visibility:
    degraded_state: media browser shows page-route error without mutating Yjs
    log: skill:mediaserver.runtime
    quarantine: false
default_tool: get_snapshot
tools:
- name: get_snapshot
  description: Return current compact media library summary and media-channel capability
    diagnostics. Full rows are available only through list_library_page.
  entry: handlers.main:get_snapshot
  side_effects: runtime_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - count
    - total_bytes
    - summary
- name: list_library_page
  description: Return a bounded page of media library rows with cursor pagination
    and optional name/mime filters.
  entry: handlers.main:list_library_page
  side_effects: none
  input_schema:
    type: object
    additionalProperties: true
    properties:
      limit:
        type: integer
        default: 50
        maximum: 100
      page_size:
        type: integer
        default: 50
        maximum: 100
      offset:
        type: integer
        default: 0
      cursor:
        type: string
      query:
        type: string
      mime_type:
        type: string
  output_schema:
    type: object
    required:
    - ok
    - items
    - pagination
- name: refresh_snapshot
  description: Refresh media library projection and return a lightweight acknowledgement.
  entry: handlers.main:refresh_snapshot
  side_effects: runtime_write
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
- name: get_diagnostics
  description: Return compact operator diagnostics for mediaserver projection pressure
    and media runtime readiness.
  entry: handlers.main:get_diagnostics
  side_effects: none
  input_schema:
    type: object
    additionalProperties: true
  output_schema:
    type: object
    required:
    - ok
    - items
    - media
    - reliability
