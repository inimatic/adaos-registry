# Development pushes allocate no CI runners. Qualify reviewed code before release.
name: Static checks
'on':
  pull_request:
    paths:
    - '**/*.py'
    - '.github/**/*.yml'
    - '.github/**/*.yaml'
    - '**/package.json'
    - '**/package-lock.json'
    - '**/registry.json'
    - '**/pyproject.toml'
    - '**/*.mjs'
    - '**/*.cjs'
    - '**/*.sh'
    - '**/*.go'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: inimatic/.github/.github/actions/static-checks@f4f2f7a1df24896ecd898f6815115ea0522e19f2
