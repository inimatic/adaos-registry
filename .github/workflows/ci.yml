name: Validate published registry catalog
'on':
  pull_request:
    paths-ignore:
    - README.md
    - CHANGELOG.md
    - .github/BRANCHING.md
    branches:
    - main
    - dev2027
  push:
    paths-ignore:
    - README.md
    - CHANGELOG.md
    - .github/BRANCHING.md
    branches:
    - main
    - dev2027
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: registry-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /registry.json
          /.github/scripts/validate_registry.py
          /.github/scripts/test_validate_registry.py
          /semantic/
          /skills/*/skill.yaml
          /scenarios/*/scenario.yaml
          /projects/*/project.yaml
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Validate published identities, versions and retained release bindings
      run: |
        legacy_base=$(python .github/scripts/validate_registry.py --legacy-baseline)
        if ! git cat-file -e "$legacy_base^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$legacy_base"
        fi
        python .github/scripts/test_validate_registry.py
        python .github/scripts/validate_registry.py
