schema: adaos.project.v1
kind: project
id: default_app_bundle
version: 0.1.2
profiles:
- adaos.default_apps.v1
components:
  owned:
  - ref: skill:notebook_skill
    role: primary
    exposure: application
    lifecycle: bound
    relations:
    - realizes
  - ref: skill:weather_skill
    role: supporting
    exposure: application
    lifecycle: bound
    relations:
    - uses
  - ref: skill:conversation_companions
    role: supporting
    exposure: application
    lifecycle: bound
    relations:
    - uses
  - ref: skill:rasa_nlu_service_skill
    role: supporting
    exposure: advanced
    lifecycle: bound
    relations:
    - uses
  dependencies: []
entrypoints: []
catalog:
  title: Default Apps Bundle
  title_i18n:
    en: Default Apps Bundle
    ru: Набор приложений по умолчанию
  description: Small default AdaOS apps and the current stable NLU service baseline.
  description_i18n:
    en: Small default AdaOS apps and the current stable NLU service baseline.
    ru: Небольшие стандартные приложения AdaOS и текущая стабильная базовая служба
      NLU.
  categories:
  - system
  - productivity
  tags:
  - default-install
  - notebook
  - weather
  - conversation
  - nlu
publication:
  stage: alpha
  visibility: listed
  channel: stable
install:
  default: true
  features:
  - id: personal-tools
    title: Personal tools
    title_i18n:
      en: Personal tools
      ru: Персональные инструменты
    default: true
    optional: false
    components:
    - skill:notebook_skill
    - skill:weather_skill
  - id: conversation-companions
    title: Conversation companions
    title_i18n:
      en: Conversation companions
      ru: Собеседники
    default: true
    optional: false
    components:
    - skill:conversation_companions
  - id: rasa-nlu
    title: Rasa NLU service
    title_i18n:
      en: Rasa NLU service
      ru: Служба Rasa NLU
    default: true
    optional: false
    components:
    - skill:rasa_nlu_service_skill
compatibility:
  validation_profiles:
  - default_apps.local
lifecycle:
  uninstall:
    components: remove_if_unreferenced
    runtime_data: retain
    source_artifacts: retain
created_at: '2026-08-27T00:00:00+00:00'
created_by: AdaOS Project Composition
