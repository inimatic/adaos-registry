schema: adaos.project.v1
kind: project
id: web_desktop
version: 0.3.94
profiles:
- adaos.desktop.shell.v1
- adaos.default_install.v1
components:
  owned:
  - ref: scenario:web_desktop
    role: primary
    exposure: application
    lifecycle: bound
    relations:
    - presents
  - ref: skill:web_desktop_runtime_skill
    role: implementation
    exposure: project_only
    lifecycle: bound
    relations:
    - realizes
  dependencies:
  - ref: skill:web_desktop_skill
    version: ==0.2.5
    lifecycle: shared
    relations:
    - uses
  - ref: skill:greet_on_boot_skill
    version: ==0.2.4
    lifecycle: shared
    relations:
    - uses
  - ref: skill:pair_new_device_skill
    version: ==0.1.0
    lifecycle: shared
    relations:
    - uses
  - ref: skill:voice_chat_skill
    version: ==0.7.8
    lifecycle: shared
    relations:
    - uses
  - ref: skill:browsers_skill
    version: ==0.15.26
    lifecycle: shared
    relations:
    - uses
  - ref: skill:infrastate_skill
    version: ==0.75.94
    lifecycle: shared
    relations:
    - uses
  - ref: skill:conversation_companions
    version: ==0.3.2
    lifecycle: shared
    relations:
    - uses
entrypoints:
- id: desktop
  presentation: scenario:web_desktop
  default: true
  bindings:
    shell: web_desktop
catalog:
  title: Management
  icon: desktop-outline
  title_i18n:
    en: Management
    ru: Управление
  description: Default AdaOS desktop shell with project-owned connection flows, voice bridge, and browser
    surface support.
  description_i18n:
    en: Default AdaOS desktop shell, join flow, voice bridge, and browser surface support.
    ru: Стандартная веб-оболочка AdaOS, подключение устройств, голосовой мост и поддержка браузерных интерфейсов.
  categories:
  - system
  - desktop
  tags:
  - default-install
  - shell
  - browser
  - voice
  - onboarding
publication:
  stage: beta
  visibility: listed
  channel: stable
install:
  default: true
  features:
  - id: shell
    title: Desktop shell
    title_i18n:
      en: Desktop shell
      ru: Оболочка рабочего стола
    default: true
    optional: false
    components:
    - scenario:web_desktop
    - skill:web_desktop_runtime_skill
compatibility:
  required_entrypoints:
  - desktop
  validation_profiles:
  - desktop.default
permission_profile:
  schema: adaos.application.permission_profile.v1
  required:
  - id: workspace.read
    approval_policy: grant_on_install
    purpose: Open desktop applications and read desktop launcher state.
  - id: workspace.write
    approval_policy: grant_on_install
    purpose: Update the user's desktop layout, pins, widgets, and preferences.
    sensitive: true
  - id: storage.blob
    approval_policy: grant_on_install
    purpose: Store and retrieve the signed-in user's content-addressed profile avatar.
    sensitive: true
  - id: profile.read.self
    approval_policy: grant_on_install
    purpose: Read the signed-in user's display profile and portable preferences.
  - id: profile.write.self
    approval_policy: grant_on_install
    purpose: Update the signed-in user's own display profile and portable preferences.
    sensitive: true
  - id: applications.read
    approval_policy: owner_only
    purpose: Observe and explicitly manage reviewed Core application lifecycle operations.
    sensitive: false
  - id: applications.plan
    approval_policy: owner_only
    purpose: Observe and explicitly manage reviewed Core application lifecycle operations.
    sensitive: true
  - id: applications.apply
    approval_policy: owner_only
    purpose: Observe and explicitly manage reviewed Core application lifecycle operations.
    sensitive: true
  - id: applications.recover
    approval_policy: owner_only
    purpose: Observe and explicitly manage reviewed Core application lifecycle operations.
    sensitive: true
  - id: applications.develop
    approval_policy: owner_only
    purpose: Observe and explicitly manage reviewed Core application lifecycle operations.
    sensitive: true
  optional: []
  secrets: []
  data_practices:
    collected: []
    sent_off_device: []
    linked_to_user: []
    tracking: false
  llm_model_use: []
  notifications: []
  background_actions: []
  external_providers: []
application_roles:
- id: desktop_owner
  title: Desktop owner
  grants:
  - desktop.open
  - desktop.settings.write
  - workspace.read
  - workspace.write
  - storage.blob
  - profile.read.self
  - profile.write.self
  assignable_to:
  - owner
  - co_owner
  - admin
  requires_permissions:
  - workspace.read
  - workspace.write
  - storage.blob
  - profile.read.self
  - profile.write.self
- id: desktop_member
  title: Desktop member
  grants:
  - desktop.open
  - workspace.read
  - storage.blob
  - profile.read.self
  - profile.write.self
  assignable_to:
  - member
  - child
  - guest
  requires_permissions:
  - workspace.read
  - storage.blob
  - profile.read.self
  - profile.write.self
- id: desktop_lifecycle_owner
  title: Desktop lifecycle owner
  grants:
  - desktop.open
  - desktop.settings.write
  - workspace.read
  - workspace.write
  - storage.blob
  - profile.read.self
  - profile.write.self
  - applications.read
  - applications.plan
  - applications.apply
  - applications.recover
  - applications.develop
  assignable_to:
  - owner
  requires_permissions:
  - workspace.read
  - workspace.write
  - storage.blob
  - profile.read.self
  - profile.write.self
  - applications.read
  - applications.plan
  - applications.apply
  - applications.recover
  - applications.develop
  default_for:
    owner: desktop_lifecycle_owner
lifecycle:
  uninstall:
    components: retain
    runtime_data: retain
    source_artifacts: retain
created_at: '2026-08-27T00:00:00+00:00'
created_by: AdaOS Project Composition
