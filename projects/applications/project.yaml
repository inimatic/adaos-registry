schema: adaos.project.v1
kind: project
id: applications
version: 0.1.39
profiles:
- adaos.system.applications.v1
components:
  owned:
  - ref: scenario:applications
    role: primary
    exposure: application
    lifecycle: bound
    relations:
    - uses
  dependencies: []
entrypoints:
- id: main
  presentation: scenario:applications
  default: true
  bindings: {}
catalog:
  title: Applications
  icon: apps-outline
  description: Manage installed applications, Marketplace discovery, releases, updates,
    permissions, runtime placement, and development status.
  categories:
  - system
  tags:
  - applications
  - marketplace
  - permissions
publication:
  stage: beta
  visibility: listed
  channel: stable
install:
  default: false
  features: []
development:
  domain_packs:
  - applications.compatibility.v1
lifecycle:
  uninstall:
    components: remove_if_unreferenced
    runtime_data: retain
    source_artifacts: retain
created_at: '2026-09-06T05:19:24Z'
created_by: builder.chat
permission_profile:
  schema: adaos.application.permission_profile.v1
  required:
  - id: applications.read
    purpose: Read the Application catalog, installed state, releases, permissions,
      roles, access grants, and operation history.
    approval_policy: grant_on_install
  - id: applications.report
    purpose: Read Root-owned Application development reports.
    approval_policy: owner_only
  - id: applications.plan
    purpose: Prepare reviewable lifecycle plans and release-readiness checks without
      applying them.
    approval_policy: owner_only
  - id: applications.apply
    purpose: Apply exact reviewed lifecycle plans and manage access for the selected
      Application.
    approval_policy: owner_only
    sensitive: true
  - id: applications.develop
    purpose: Manage this publisher's unpublished local Application development.
    approval_policy: owner_only
    sensitive: true
  - id: applications.publish
    purpose: Promote an accepted Application release and publish its exact source
      and portable CBS projection to the shared registry.
    approval_policy: owner_only
    sensitive: true
  optional: []
  secrets: []
  external_providers: []
  llm_model_use: []
  notifications: []
  background_actions: []
  data_practices:
    collected:
    - application_metadata
    - access_metadata
    linked_to_user:
    - access_metadata
    retention: Retained with local Application lifecycle and access audit history.
    sent_off_device: []
    tracking: false
  privacy_labels:
    collected:
    - application_metadata
    - access_metadata
    linked_to_user: true
    sent_off_device: false
    tracking: false
