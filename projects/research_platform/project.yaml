schema: adaos.project.v1
kind: project
id: research_platform
version: 0.1.21
profiles:
- adaos.research.platform.v1
components:
  owned:
  - ref: scenario:research_workbench
    role: primary
    exposure: application
    lifecycle: bound
    relations:
    - presents
  - ref: skill:research_orchestrator_skill
    role: implementation
    exposure: project_only
    lifecycle: bound
    relations:
    - realizes
  - ref: skill:research_manager_skill
    role: implementation
    exposure: project_only
    lifecycle: bound
    relations:
    - realizes
  - ref: skill:research_evaluator_skill
    role: supporting
    exposure: project_only
    lifecycle: bound
    relations:
    - evaluates
  - ref: skill:research_calibration_runner_skill
    role: supporting
    exposure: project_only
    lifecycle: bound
    relations:
    - evaluates
  - ref: skill:mlflow_tracker_skill
    role: supporting
    exposure: advanced
    lifecycle: bound
    relations:
    - uses
  dependencies: []
entrypoints:
- id: workbench
  presentation: scenario:research_workbench
  default: true
  bindings:
    platform: research
catalog:
  title: Research Platform
  icon: flask-outline
  title_i18n:
    en: Research Platform
    ru: Исследовательская платформа
  description: Reusable governed research workbench, orchestration, experiment management,
    evaluation, and tracking.
  description_i18n:
    en: Reusable governed research workbench, orchestration, experiment management,
      evaluation, and tracking.
    ru: Переиспользуемая управляемая исследовательская рабочая среда, оркестрация,
      управление экспериментами, оценка и трекинг.
  categories:
  - research
  tags:
  - workbench
  - orchestration
  - experiments
  - evaluator
  - mlflow
publication:
  stage: beta
  visibility: listed
  channel: stable
install:
  default: false
  features:
  - id: workbench
    title: Research workbench
    title_i18n:
      en: Research workbench
      ru: Исследовательская рабочая среда
    default: true
    optional: false
    components:
    - scenario:research_workbench
    - skill:research_orchestrator_skill
    - skill:research_manager_skill
  - id: evaluation
    title: Evaluation and calibration
    title_i18n:
      en: Evaluation and calibration
      ru: Оценка и калибровка
    default: true
    optional: false
    components:
    - skill:research_evaluator_skill
    - skill:research_calibration_runner_skill
  - id: tracker
    title: MLflow tracker
    title_i18n:
      en: MLflow tracker
      ru: Трекер MLflow
    default: false
    optional: true
    components:
    - skill:mlflow_tracker_skill
compatibility:
  required_entrypoints:
  - workbench
  required_contracts:
  - capability:research.workbench.manage@^1.0.0
  - capability:research.lifecycle.manage@^1.0.0
  - capability:research.tracking.manage@^1.0.0
  validation_profiles:
  - research.platform.local
lifecycle:
  uninstall:
    components: remove_if_unreferenced
    runtime_data: retain
    source_artifacts: retain
created_at: '2026-08-27T00:00:00+00:00'
created_by: AdaOS Project Composition
permission_profile:
  schema: adaos.application.permission_profile.v1
  required:
  - id: workspace.read
    purpose: Read research directions, datasets, tasks, and evidence in the selected workspace.
    approval_policy: grant_on_install
  - id: workspace.write
    purpose: Persist experiments, evaluation evidence, calibration results, and tracker state.
    approval_policy: owner_only
    sensitive: true
  - id: network.egress
    purpose: Contact explicitly configured research and tracking providers.
    approval_policy: owner_only
    sensitive: true
  optional: []
  secrets: []
  external_providers: []
  llm_model_use: []
  notifications: []
  background_actions: []
  data_practices:
    collected: [research_artifact, experiment_evidence, calibration_result]
    linked_to_user: []
    retention: Research artifacts remain in the configured workspace and tracker.
    sent_off_device: [explicit_provider_request]
    tracking: false
