schema: adaos.project.v1
kind: project
id: cv_descriptor_lab
version: 0.1.19
profiles:
- adaos.cv.descriptor_lab.v1
components:
  owned:
  - ref: skill:cv_descriptor
    role: primary
    exposure: advanced
    lifecycle: bound
    relations:
    - realizes
  dependencies: []
entrypoints:
- id: descriptors
  presentation: skill:cv_descriptor
  default: true
  bindings:
    descriptor_store: local
catalog:
  title: CV Descriptor Lab
  title_i18n:
    en: CV Descriptor Lab
    ru: Лаборатория CV-дескрипторов
  description: Browser-side visual object descriptor pilot for embeddings, signatures,
    thumbnails, and descriptions.
  description_i18n:
    en: Browser-side visual object descriptor pilot for embeddings, signatures, thumbnails,
      and descriptions.
    ru: Пилот браузерных CV-дескрипторов для эмбеддингов, сигнатур, миниатюр и описаний.
  categories:
  - vision
  - demo
  tags:
  - cv
  - descriptors
  - lab
  - alpha
publication:
  stage: beta
  visibility: listed
  channel: stable
install:
  default: false
  features:
  - id: descriptors
    title: Visual descriptors
    default: true
    optional: false
    components:
    - skill:cv_descriptor
compatibility:
  required_entrypoints:
  - descriptors
  required_contracts:
  - capability:vision.descriptors.manage@^1.0.0
  validation_profiles:
  - cv.descriptor.local
lifecycle:
  uninstall:
    components: remove_if_unreferenced
    runtime_data: retain
    source_artifacts: retain
created_at: '2026-08-27T00:00:00+00:00'
created_by: AdaOS Project Composition
permission_profile:
  schema: adaos.application.permission_profile.v1
  required:
  - id: workspace.read
    purpose: Read selected images and existing descriptor records.
    approval_policy: grant_on_install
  - id: workspace.write
    purpose: Persist generated descriptors and explicit runtime commands.
    approval_policy: owner_only
    sensitive: true
  optional: []
  secrets: []
  external_providers: []
  llm_model_use: []
  notifications: []
  background_actions: []
  data_practices:
    collected: [image_metadata, visual_descriptor]
    linked_to_user: []
    retention: Descriptor records remain in local Application state.
    sent_off_device: []
    tracking: false
