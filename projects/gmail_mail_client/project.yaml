catalog:
  title: Gmail Mail Client
  description: Create a new private AdaOS Application named "Gmail Mail Client" from
    scratch. It must be CBS-compatible. Its semantic application requires capability:mail.messages.manage
    version ^1.0.0 without naming Gmail, a package, a skill, or credentials. For the
    first beta, implement an application-local Gmail binding. The UI must provide
    inbox search and filters, message reading, labels, archive, trash, compose and
    send, connection/setup status, explicit least-privilege disclosures, and deterministic
    empty/loading/error/permission-denied states. Account credentials and OAuth tokens
    must never be stored in UI state or logs. Keep shared provider reuse and a global
    capability registry out of this first stage.
  categories: []
  tags: []
publication:
  stage: alpha
  visibility: unlisted
  channel: stable
install:
  default: false
  features: []
