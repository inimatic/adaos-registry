schema: adaos.project.v1
kind: project
id: research_tlp
version: 0.3.18
profiles:
- adaos.research.tlp.v1
components:
  owned:
  - ref: scenario:tlp_research
    role: primary
    exposure: application
    lifecycle: bound
    relations:
    - presents
  - ref: skill:tlp_structured_proof_02
    role: implementation
    exposure: project_only
    lifecycle: bound
    relations:
    - realizes
  - ref: skill:tlp_experiment_skill
    role: supporting
    exposure: project_only
    lifecycle: bound
    relations:
    - uses
    - evaluates
  dependencies:
  - ref: project:research_platform
    version: ^0.1
    lifecycle: shared
    relations:
    - uses
    - presents
entrypoints:
- id: tlp
  presentation: scenario:tlp_research
  default: true
  bindings:
    research_category: tlp
catalog:
  title: TLP Mechanistic Research
  title_i18n:
    en: TLP Mechanistic Research
    ru: Механистическое исследование TLP
  description: Governed TLP research instance with STL-10 proof runner and experiment
    provider.
  description_i18n:
    en: Governed TLP research instance with STL-10 proof runner and experiment provider.
    ru: Управляемый экземпляр исследования TLP со STL-10 proof runner и experiment
      provider.
  categories:
  - research
  tags:
  - tlp
  - alpha
  - max-plus
  - pooling
publication:
  stage: beta
  visibility: listed
  channel: stable
install:
  default: false
  features:
  - id: tlp-study
    title: TLP study
    title_i18n:
      en: TLP study
      ru: Исследование TLP
    default: true
    optional: false
    components:
    - scenario:tlp_research
    - skill:tlp_structured_proof_02
    - skill:tlp_experiment_skill
compatibility:
  required_entrypoints:
  - tlp
  required_contracts:
  - capability:research.tlp.evaluate@^1.0.0
  - capability:research.lifecycle.manage@^1.0.0
  - capability:research.tracking.manage@^1.0.0
  validation_profiles:
  - research.tlp.local
lifecycle:
  uninstall:
    components: remove_if_unreferenced
    runtime_data: retain
    source_artifacts: retain
created_at: '2026-08-27T00:00:00+00:00'
created_by: AdaOS Project Composition
permission_profile:
  schema: adaos.application.permission_profile.v1
  required:
  - id: workspace.read
    purpose: Inspect TLP research directions, datasets, and validation evidence.
    approval_policy: grant_on_install
  - id: workspace.write
    purpose: Persist explicit TLP experiment and evaluation operations.
    approval_policy: owner_only
    sensitive: true
  optional: []
  secrets: []
  external_providers: []
  llm_model_use: []
  notifications: []
  background_actions: []
  data_practices:
    collected:
    - research_direction
    - experiment_evidence
    linked_to_user: []
    retention: Research state and evidence remain in the selected workspace.
    sent_off_device: []
    tracking: false
